# Claude Code (web) → stage, without a manual merge.
#
# Every push to a `claude/**` branch (what Claude Code on the web creates) runs the checks below — the backend job is
# ci.yml (go vet + `go test -race ./...` with integration tests on real MariaDB/Redis); when they pass,
# the branch is merged into `stage` and pushed. The server then notices the new stage commit within ~2 minutes and
# rebuilds stage.ritmeapp.ir (deploy/stage-autodeploy.sh + systemd timer) — nothing here has to reach the server.
#
# A merge conflict is never forced: the job fails, stage is left untouched, and the branch needs a rebase on stage.
#
# Gates (T-M12-03): `merge` needs BOTH jobs green — backend (go vet + go test -race with integration, ci.yml) and
# frontend (audits, typecheck, vitest). No step of a gate may carry `continue-on-error`.
#
# Signatures: the real gate is on the server (deploy/stage-autodeploy.sh verifies every new stage commit against the
# pinned /etc/ritme/allowed_signers and refuses anything else). The "signatures" step below is an early, advisory copy
# of that check so an unsigned branch fails HERE instead of being merged and then blocking stage on the server. It
# reads the public keys from the repository variable RITME_ALLOWED_SIGNERS (allowed_signers format); unset → warning
# only. Advisory because a push to claude/** runs that branch's own copy of this workflow.
# The merge commit this job makes is unsigned on purpose: the server accepts an unsigned merge only when its tree is
# exactly the clean merge of its parents, and checks the parents' signatures.
# docs/quality-2026-11/autodeploy.md has the key setup.
name: claude-to-stage

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # go vet + the full Go suite with -race, integration tests against MariaDB/Redis service containers (T-M12-11).
  backend:
    uses: ./.github/workflows/ci.yml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # critical until T-M12-04b (zod 4 / next-intl 4 / picomatch) lands, then raise both to --audit-level=high.
      - name: npm audit (frontend, prod deps, critical)
        run: npm audit --omit=dev --audit-level=critical
      - name: npm audit (admin-web, prod deps, critical)
        working-directory: admin-web
        run: npm audit --omit=dev --audit-level=critical
      - name: composer audit (laravel-site, locked)
        working-directory: laravel-site
        run: composer audit --locked
      - name: typecheck
        run: npm run typecheck
      - name: unit tests + coverage (report only)
        run: npx vitest run --coverage --coverage.reporter=text-summary --coverage.reporter=json-summary --coverage.reporter=lcov
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage
          if-no-files-found: warn

  merge:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # One merge into stage at a time; queued, never cancelled.
    concurrency:
      group: merge-into-stage
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage
          fetch-depth: 0
      - name: Signatures (advisory; the server re-checks)
        env:
          SRC_SHA: ${{ github.sha }}
          ALLOWED_SIGNERS: ${{ vars.RITME_ALLOWED_SIGNERS }}
        run: |
          if [ -z "$ALLOWED_SIGNERS" ]; then
            echo "::warning::RITME_ALLOWED_SIGNERS is not set — skipping the signature pre-check (the server still verifies)."
            exit 0
          fi
          printf '%s\n' "$ALLOWED_SIGNERS" > "$RUNNER_TEMP/allowed_signers"
          git fetch origin "+refs/heads/stage:refs/remotes/origin/stage"
          bad=0
          for c in $(git rev-list "origin/stage..$SRC_SHA"); do
            if ! git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" \
                     -c gpg.minTrustLevel=fully verify-commit "$c" >/dev/null 2>&1; then
              echo "::error::${c::12} $(git log -1 --format='%an: %s' "$c") is not signed by an allowed key."
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "::error::Not merged: the server would refuse to deploy it. Sign the commits, or approve the branch with a signed merge into stage from the Mac (docs/quality-2026-11/autodeploy.md)."
            exit 1
          fi
      - name: Merge ${{ github.ref_name }} into stage
        env:
          SRC_BRANCH: ${{ github.ref_name }}
          SRC_SHA: ${{ github.sha }}
        run: |
          git config user.name  "ritme-ci"
          git config user.email "ci@ritme.app"
          git fetch origin "+refs/heads/stage:refs/remotes/origin/stage"
          git reset --hard origin/stage
          if git merge-base --is-ancestor "$SRC_SHA" HEAD; then
            echo "stage already contains ${SRC_SHA::8} — nothing to merge."
            exit 0
          fi
          if ! git merge --no-ff "$SRC_SHA" -m "Merge ${SRC_BRANCH} into stage (auto)"; then
            git merge --abort || true
            echo "::error::${SRC_BRANCH} conflicts with stage — rebase it on stage and push again. Stage was not changed."
            exit 1
          fi
          git push origin HEAD:stage
          {
            echo "### Merged into stage"
            echo "\`${SRC_BRANCH}\` (${SRC_SHA::8}) → stage $(git rev-parse --short HEAD)."
            echo "The server rebuilds https://stage.ritmeapp.ir within ~2 minutes (log: /var/log/ritme-stage-autodeploy.log)."
          } >> "$GITHUB_STEP_SUMMARY"
