# golangci-lint v2. Run: make lint (or golangci-lint run from backend-go/).
version: "2"

run:
  go: "1.25"
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: unused-parameter
          disabled: true
    gosec:
      excludes:
        - G104 # covered by errcheck
  exclusions:
    generated: lax # sqlc / enumgen output
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]
      # internal/http is the router package; the name is deliberate (it is imported as apihttp).
      - path: internal/http/
        text: "var-naming: avoid package names that conflict with Go standard library package names"
        linters: [revive]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ritme/backend-go
