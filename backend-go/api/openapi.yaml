                      period_end_date: "2026-07-24"
                      source: user_logged
                    - id: 100403
                      period_start_date: "2026-06-22"
                      period_end_date: "2026-06-26"
                      source: user_logged
                    - id: 100402
                      period_start_date: "2026-05-25"
                      period_end_date: "2026-05-29"
                      source: user_logged
                    - id: 100401
                      period_start_date: "2026-04-27"
                      period_end_date: "2026-05-01"
                      source: user_logged
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/cycle/period/start:
    post:
      tags: [Period Log]
      summary: Mark a period as started
      description: "Records the start of a menstrual period (defaults to today), re-anchors the cycle and triggers recalculation."
      operationId: postCyclePeriodStart
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      requestBody:
        content:
          application/json:
            schema:
              properties:
                date:
                  description: "Period start date; defaults to today"
                  type: [string, "null"]
                  format: date
                  examples: ["2024-12-01"]
              type: object
      responses:
        '200':
          description: Period start recorded
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data:
                    type: object
                    required: [active, period_start_date, period_end_date, warnings]
                    properties:
                      active: {type: boolean}
                      period_start_date: {$ref: "#/components/schemas/Date"}
                      period_end_date:
                        anyOf: [{$ref: "#/components/schemas/Date"}, {type: "null"}]
                      warnings:
                        type: array
                        items:
                          type: object
                          required: [type, message]
                          properties: {type: {type: string}, message: {type: string}}
