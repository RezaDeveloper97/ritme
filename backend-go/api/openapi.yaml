        excerpt: {type: string}
        image_url: {type: [string, "null"]}
        read_time_minutes: {type: integer}
        category: {type: string}
        cycle_phases: {type: array, items: {type: string}}
        published_at: {$ref: "#/components/schemas/Date"}
    User:
