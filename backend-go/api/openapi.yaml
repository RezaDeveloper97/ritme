  /api/v1/home:
    get:
      tags: [Home]
      summary: Get the full home page
      description: "Aggregates every home-page section into a single, ordered, server-driven feed. Each item is a self-describing section ({key, type, title, order, data}); the frontend renders by `type` and iterates by `order`. Sections with nothing to show are omitted."
      operationId: getHome
      security:
        - {bearerAuth: []}
      parameters:
        - name: date
          in: query
          description: Reference date (YYYY-MM-DD). Defaults to today.
          required: false
          schema: {type: string, format: date, examples: ["2026-05-30"]}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Home page assembled successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [mode, mode_label, date, locale, profile_complete, sections]
                    properties:
                      mode: {type: string}
                      mode_label: {type: string}
                      date: {$ref: "#/components/schemas/Date"}
                      locale: {type: string}
                      profile_complete: {type: boolean}
                      sections:
                        type: array
                        items:
                          type: object
                          required: [key, type, title, subtitle, order, action, data, meta]
                          properties:
                            key: {type: string}
                            type: {type: string}
                            title: {type: [string, "null"]}
                            subtitle: {type: [string, "null"]}
                            order: {type: integer}
                            action:
                              type: [object, "null"]
                              required: [key, label]
                              properties: {key: {type: string}, label: {type: string}}
                            data:
                              type: object
                              additionalProperties:
                                anyOf:
                                  - type: object
                                    properties:
                                      id: {type: [integer, "null"]}
                                      name: {type: [string, "null"]}
                                      key: {type: string}
                                      label: {type: string}
                                      illumination: {type: number}
                                      age_days: {type: number}
                                      unread_count: {type: integer}
                                      has_unread: {type: boolean}
                                      percent: {type: number}
                                      level: {type: string}
                                      completed: {type: integer}
                                      total: {type: integer}
                                      phone: {type: string}
                                      from: {$ref: "#/components/schemas/Date"}
                                      to: {$ref: "#/components/schemas/Date"}
                                      cycle_day: {type: integer}
                                      started_at: {$ref: "#/components/schemas/Date"}
                                      period_end_date:
                                        anyOf: [{$ref: "#/components/schemas/Date"}, {type: "null"}]
                                      period_length: {type: [number, "null"]}
                                      is_ongoing: {type: boolean}
                                      cycle_length:
                                        anyOf:
                                          - type: object
                                            required: [min, max]
                                            properties: {min: {type: number}, max: {type: number}}
                                          - {type: number}
                                          - {type: "null"}
                                      cycle_length_source: {type: string}
                                      based_on_cycles: {type: number}
                                      period_duration:
                                        type: object
                                        required: [min, max]
                                        properties: {min: {type: number}, max: {type: number}}
                                  - type: array
                                    items:
                                      type: object
                                      additionalProperties:
                                        anyOf:
                                          - type: object
                                            required: [min, max]
                                            properties: {min: {type: number}, max: {type: number}}
                                          - {type: array, items: {type: string}}
                                          - {type: string}
                                          - {type: number}
                                          - {type: boolean}
                                          - {type: "null"}
                                  - {type: string}
                                  - {type: number}
                                  - {type: boolean}
                                  - {type: "null"}
                            meta:
                              description: "Only `null` was recorded in the contract goldens; type not pinned."
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/ValidationFailed"}
