                  success: {type: boolean}
                  data:
                    type: object
                    required: [next_due_on, due_by, next_due_label, interval_label, timing_label, reminder_label, cycle_timed]
                    properties:
                      next_due_on: {$ref: "#/components/schemas/Date"}
                      due_by: {$ref: "#/components/schemas/Date"}
                      next_due_label: {type: string}
                      interval_label: {type: string}
                      timing_label: {type: [string, "null"]}
                      reminder_label: {type: string}
                      cycle_timed: {type: boolean}
              example:
                success: true
                data: {next_due_on: "2029-09-20", due_by: "2029-09-20", next_due_label: ۳۰ شهریور ۱۴۰۸, interval_label: هر ۳ سال, timing_label: روز ۱۰ تا ۲۰ سیکل, reminder_label: ۳۰ روز قبل یادآوری می‌کنیم, cycle_timed: false}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404': {$ref: "#/components/responses/CheckupNotFound"}
        '422': {$ref: "#/components/responses/CheckupValidationFailed"}
  /api/v1/checkups/records:
    get:
      tags: [Checkups]
      summary: The checkup history
      description: |
        The user's records, newest first (`done_on`, then id), 20 per page. `filter=this_year` = since the first day of
        the current year in the request language's calendar (1 Farvardin for fa, 1 January otherwise);
        `with_attachment` = `has_attachment` records (the file itself is on the device only); `type` = one checkup.
      operationId: getCheckupRecords
      security:
        - {bearerAuth: []}
      parameters:
        - {name: filter, in: query, required: false, schema: {type: string, enum: [all, this_year, with_attachment]}}
        - {name: type, in: query, required: false, schema: {type: integer}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: One page of records
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [items, meta]
