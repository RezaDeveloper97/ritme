  /api/v1/home/cycle-overview:
    get:
      tags: [Home]
      summary: Cycle home summary — logging streak, period / PMS range, cycle length and regularity
      description: |
        Go only (B-N1-06, Night & Bloom cycle home). No second prediction model: `next_period.start` is the §35
        resolver's `predicted_next_period_start` (the same as `cycle_view.anchors`), `end` = start + effective period
        length − 1; `pms_window` = the resolver's `pms_possible` days (start − 3 … start − 1). Both `null` without a
        resolvable cycle. `cycle_length.median` = the effective cycle length (median of the last ≤ 3 valid cycles, else
        profile, else 28; `source` says which), `based_on_cycles` = valid cycles (null when 0), `spread_days` =
        ceil((max − min) / 2) of the last ≤ 3 valid lengths (null with fewer than 2), `regularity` = the metrics'
        regularity status. `logging.streak_days` = consecutive days with a daily health log ending today, or
        yesterday while today has none yet (capped at 90). `plus_trial_offer` is the Ritme Plus trial banner
        (`nbl_Prem_TrialHome`, B-N2-06): the running trial offer with its countdown, null when none runs.
      operationId: getHomeCycleOverview
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The overview
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [date, logging, next_period, pms_window, cycle_length, plus_trial_offer]
                    properties:
                      date: {$ref: "#/components/schemas/Date"}
                      logging:
                        type: object
                        required: [streak_days, logged_today]
                        properties:
                          streak_days: {type: integer, minimum: 0}
                          logged_today: {type: boolean}
                      next_period:
                        oneOf:
                          - {type: "null"}
                          - type: object
                            required: [start, end]
                            properties: {start: {$ref: "#/components/schemas/Date"}, end: {$ref: "#/components/schemas/Date"}}
                      pms_window:
                        oneOf:
                          - {type: "null"}
                          - type: object
                            required: [start, end]
                            properties: {start: {$ref: "#/components/schemas/Date"}, end: {$ref: "#/components/schemas/Date"}}
                      cycle_length:
                        type: object
                        required: [median, source, based_on_cycles, spread_days, regularity]
                        properties:
                          median: {type: integer}
                          source: {type: string, enum: [recent_valid_cycles, profile, default]}
                          based_on_cycles: {type: [integer, "null"]}
                          spread_days: {type: [integer, "null"]}
                          regularity: {type: string, enum: [not_enough_data, relatively_regular, irregular_possible]}
                      plus_trial_offer: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/PlusTrialOffer"}]}
              example:
                success: true
                data:
                  date: "2026-10-01"
                  logging: {streak_days: 6, logged_today: true}
                  next_period: {start: "2026-10-12", end: "2026-10-16"}
                  pms_window: {start: "2026-10-09", end: "2026-10-11"}
                  cycle_length: {median: 28, source: recent_valid_cycles, based_on_cycles: 5, spread_days: 1, regularity: relatively_regular}
                  plus_trial_offer: null
        '401': {$ref: "#/components/responses/Unauthenticated"}
