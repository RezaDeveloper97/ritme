                      title: {type: string}
                      relation: {type: string, enum: [past, current, future]}
                      current_week: {type: integer}
                      range: {$ref: "#/components/schemas/PregnancyV2Range"}
                      range_label: {type: string}
                      size_line: {type: [string, "null"]}
                      bookmarked: {type: boolean}
