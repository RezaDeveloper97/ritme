  /api/v1/info-pages/{group}:
    get:
      tags: [Info]
      summary: Boxes of a text screen with keys and last edit
      description: |
        Go only (B-N1-12): the Night & Bloom Support / About / Legal screens. Like `/info/{group}` (active boxes,
        display order, one locale) plus each box's stable `key` (seeded: `summary` in privacy/terms = the Legal
        «خلاصه در ۳ خط», one line per `\n`; `about/disclaimer` = the About footer; `support/email`) and the page's last edit day `updated_at` (null when
        empty). `link_label` / `link_url` are both set or both null. `support` holds the support channels
        (`tel:` → phone line with the hours in `body`, `http(s):` / `mailto:` → the chat card). Public.
      operationId: getInfoPage
      security: []
      parameters:
        - name: group
          in: path
          required: true
          schema: {type: string, enum: [help, privacy, terms, about, support]}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The page
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [group, updated_at, sections]
                    properties:
                      group: {type: string}
                      updated_at:
                        oneOf:
                          - {$ref: "#/components/schemas/Date"}
                          - {type: "null"}
                      sections:
                        type: array
                        items:
                          type: object
                          required: [id, key, heading, body, link_label, link_url]
                          properties:
                            id: {type: integer}
                            key: {type: [string, "null"]}
                            heading: {type: string}
                            body: {type: string}
                            link_label: {type: [string, "null"]}
                            link_url: {type: [string, "null"]}
              example:
                success: true
                data:
                  group: privacy
                  updated_at: "2026-09-23"
                  sections:
                    - {id: 20, key: summary, heading: "In 3 lines", body: "We never sell your health data or use it for advertising\nSharing with a doctor, a companion or AI happens only with your explicit consent\nYou can download or delete your data at any time", link_label: null, link_url: null}
                    - {id: 6, key: commitment, heading: "Our commitment to you", body: "Ritme is built to hold some of your most personal health information…", link_label: null, link_url: null}
        '404': {$ref: "#/components/responses/ModelNotFound"}
  /api/v1/languages:
