                required: [success, message]
                properties: {success: {type: boolean}, message: {type: string}}
              example: {success: false, message: Invalid phase key}
  /api/v1/cycle/recalculate:
    post:
      tags: [Cycle]
      summary: Trigger recalculation
      description: "Records a recalculation of the cycle data. Every cycle endpoint computes live from the user's inputs, so the recalculation completes synchronously: the version is bumped and the status is `completed` in the response (and in /cycle/status) right away. Kept for clients that call it after daily log updates."
      operationId: postCycleRecalculate
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      responses:
        '200':
          description: Recalculation completed
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data:
                    type: object
                    required: [version, status]
                    properties: {version: {type: integer}, status: {type: string}}
              example: {success: true, message: Recalculation completed, data: {version: 2, status: completed}}
        '400':
          description: Profile not complete
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties: {success: {type: boolean}, message: {type: string}}
              example: {success: false, message: Please complete your profile first}
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/cycle/status:
    get:
      tags: [Cycle]
      summary: Get calculation status
      description: Check if cycle calculations are being processed
      operationId: getCycleStatus
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      responses:
        '200':
          description: Status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [status, status_label, is_processing, version, started_at, completed_at]
                    properties:
                      status: {type: string}
                      status_label: {type: string}
                      is_processing: {type: boolean}
                      version: {type: integer}
                      started_at:
                        anyOf: [{$ref: "#/components/schemas/LaravelDateTime"}, {type: "null"}]
                      completed_at:
                        anyOf: [{$ref: "#/components/schemas/LaravelDateTime"}, {type: "null"}]
              example:
                success: true
                data:
                  status: completed
                  status_label: Completed
                  is_processing: false
                  version: 2
                  started_at: "2026-09-23T06:30:00.000000Z"
                  completed_at: "2026-09-23T06:30:00.000000Z"
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/cycle/today:
    get:
      tags: [Cycle]
      summary: "Get today's cycle calculation"
      description: >-
        Retrieve calculated cycle data for today including phase, fertility window, and pregnancy probability.
        `phase`, `is_fertile_window`, `text_flags` and `daily_tips` follow the §19 display fertile window (ends on the ovulation day): on the day after ovulation `phase` is `luteal`, `is_fertile_window` false, there is no `fertility_status` flag and the tips are the early-luteal ones; `subphase` stays `post_ovulation` (D-30).
      operationId: getCycleToday
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      responses:
        '200':
          description: "Today's cycle calculation retrieved successfully"
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [calculation, cycle_view, calculation_status, is_recalculating]
                    properties:
                      calculation:
                        type: object
                        required:
                          - calculation_date
                          - cycle_day
                          - phase
                          - subphase
                          - estimated_ovulation_day
                          - cycle_length_used
                          - is_fertile_window
                          - is_pms_window
                          - is_period_tomorrow
                          - is_luteal_spotting
                          - cycle_score
                          - age_factor
                          - base_probability
                          - symptom_score
                          - final_probability
                          - cycle_variability
                          - uncertainty_range
                          - text_flags
                          - daily_tips
                          - source_profile_data
                          - source_daily_log_data
                        properties:
                          calculation_date: {$ref: "#/components/schemas/Date"}
                          cycle_day: {type: [integer, "null"]}
                          phase: {type: [string, "null"]}
                          subphase: {type: [string, "null"]}
                          estimated_ovulation_day: {type: [integer, "null"]}
                          cycle_length_used: {type: [number, "null"]}
                          is_fertile_window: {type: boolean}
                          is_pms_window: {type: boolean}
                          is_period_tomorrow: {type: boolean}
                          is_luteal_spotting: {type: boolean}
                          cycle_score: {type: [number, "null"]}
                          age_factor: {type: [number, "null"]}
                          base_probability: {type: [number, "null"]}
                          symptom_score: {type: [number, "null"]}
                          final_probability: {type: [number, "null"]}
                          cycle_variability: {type: [string, "null"]}
                          uncertainty_range: {type: [number, "null"]}
                          text_flags:
                            type: object
                            properties:
                              fertility_status:
                                anyOf: [{$ref: "#/components/schemas/RawTranslations"}, {type: string}]
                              probability_message:
                                anyOf: [{$ref: "#/components/schemas/RawTranslations"}, {type: string}]
                              phase_info:
                                anyOf: [{$ref: "#/components/schemas/RawTranslations"}, {type: string}]
                              incomplete_profile:
                                anyOf: [{$ref: "#/components/schemas/RawTranslations"}, {type: string}]
                              pms_warning:
                                anyOf: [{$ref: "#/components/schemas/RawTranslations"}, {type: string}]
                          daily_tips:
                            type: array
                            items:
                              type: object
                              required: [type, title, icon, text]
                              properties:
                                type: {type: string}
                                title: {type: string}
                                icon: {type: string}
                                text: {type: string}
                          source_profile_data:
                            type: [object, "null"]
                            required: [birthday, period_duration, cycle_duration, last_period_start]
                            properties:
                              birthday: {$ref: "#/components/schemas/Date"}
                              period_duration: {type: number}
                              cycle_duration: {type: number}
                              last_period_start: {$ref: "#/components/schemas/Date"}
                          source_daily_log_data:
                            type: [object, "null"]
                            additionalProperties:
                              anyOf:
                                - {type: array, items: {type: string}}
                                - {type: string}
                                - {type: number}
                                - {type: "null"}
                      cycle_view: {$ref: "#/components/schemas/CycleView"}
                      calculation_status: {type: string}
                      is_recalculating: {type: boolean}
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/health-logs:
    get:
      tags: [Daily Health Log]
      summary: Get health logs list
      description: "Retrieve paginated list of user's daily health logs with optional date filtering"
      operationId: getHealthLogs
      security:
        - {bearerAuth: []}
      parameters:
        - name: from_date
          in: query
          description: Filter logs from this date (YYYY-MM-DD)
          required: false
          schema: {type: string, format: date, examples: ["2024-12-01"]}
        - name: to_date
          in: query
          description: Filter logs until this date (YYYY-MM-DD)
          required: false
          schema: {type: string, format: date, examples: ["2024-12-31"]}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Health logs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required:
                      - current_page
                      - data
                      - first_page_url
                      - from
                      - last_page
                      - last_page_url
                      - links
                      - next_page_url
                      - path
                      - per_page
                      - prev_page_url
                      - to
                      - total
                    properties:
                      current_page: {type: integer}
                      data:
                        type: array
                        items:
                          type: object
                          additionalProperties:
                            anyOf:
                              - {type: array, items: {type: string}}
                              - {type: string}
                              - {type: number}
                              - {type: boolean}
                              - {type: "null"}
                      first_page_url: {type: string}
                      from: {type: [number, "null"]}
                      last_page: {type: integer}
                      last_page_url: {type: string}
                      links:
                        type: array
                        items:
                          type: object
                          required: [url, label, page, active]
                          properties:
                            url: {type: [string, "null"]}
                            label: {type: string}
                            page: {type: [integer, "null"]}
                            active: {type: boolean}
                      next_page_url: {type: [string, "null"]}
                      path: {type: string}
                      per_page: {type: integer}
                      prev_page_url: {type: [string, "null"]}
                      to: {type: [number, "null"]}
                      total: {type: integer}
              example:
                success: true
                data:
                  current_page: 1
                  data: []
                  first_page_url: "http://127.0.0.1:8090/api/v1/health-logs?page=1"
                  from: null
                  last_page: 1
                  last_page_url: "http://127.0.0.1:8090/api/v1/health-logs?page=1"
                  links:
                    - {url: null, label: "&laquo; Previous", page: null, active: false}
                    - url: "http://127.0.0.1:8090/api/v1/health-logs?page=1"
                      label: "1"
                      page: 1
                      active: true
                    - {url: null, label: "Next &raquo;", page: null, active: false}
                  next_page_url: null
                  path: "http://127.0.0.1:8090/api/v1/health-logs"
                  per_page: 30
                  prev_page_url: null
                  to: null
                  total: 0
        '401': {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [Daily Health Log]
      summary: Create or update daily health log
      description: |
        Create a new health log or update existing one for the specified date. Each user can have only one log per day.

        Upsert on `(user_id, log_date)`: **201** when the row is created, **200** when it is updated. On create `data` holds only the attributes that were sent plus `user_id`, `id` and timestamps (Eloquent); on update the full row. An optional top-level `warning` follows `data`.
      operationId: postHealthLogs
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [log_date]
              properties:
                log_date:
                  description: Date of the log entry
                  type: string
                  format: date
                  examples: ["2024-12-07"]
                bleeding_intensity:
                  description: Bleeding intensity level
                  type: string
                  enum: [low, medium, high, very_high]
                blood_color: {description: Blood color, type: string, enum: [bright_red, red, dark_red, brown]}
                has_clots:
                  description: "Legacy presence-only clotting flag; superseded by clots_amount"
                  type: boolean
                clots_amount: {description: Amount of clotting, type: string, enum: [none, low, medium, high]}
                spotting: {description: Spotting occurrence, type: boolean}
                bleeding_smell:
                  description: Bleeding odor
                  type: string
                  enum: [normal, slightly_unusual, strong_unpleasant]
                headache_intensity: {description: Headache intensity, type: string, enum: [low, medium, high]}
                stomach_ache_intensity:
                  description: Stomach ache intensity
                  type: string
                  enum: [low, medium, high]
                pelvic_pain_intensity:
                  description: Pelvic pain intensity
                  type: string
                  enum: [low, medium, high]
                breast_pain_intensity:
                  description: Breast pain intensity
                  type: string
                  enum: [low, medium, high]
                back_pain_intensity:
                  description: Back pain intensity
                  type: string
                  enum: [low, medium, high]
                ovarian_pain_intensity:
                  description: Ovarian pain intensity
                  type: string
                  enum: [low, medium, high]
                nausea_intensity:
                  description: Nausea/vomiting intensity
