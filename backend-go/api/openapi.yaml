  /api/v1/home/sections/{section}:
    get:
      tags: [Home]
      summary: Get a single home-page section
      description: "Returns one section by its key for lazy-loading or independent refresh (e.g. tasks, vitals, articles). Use this to refresh a single widget without rebuilding the whole page."
      operationId: getHomeSectionsBySection
      security:
        - {bearerAuth: []}
      parameters:
        - name: section
          in: path
          description: "Section key (e.g. header, week_calendar, next_period, cycle_prediction, recommendations, tasks, challenge, doctor_reminder, medication_reminder, smart_tip, affirmation, weekly_summary, vitals, status_charts, articles, my_cycles, cycle_summary)"
          required: true
          schema: {type: string, examples: [tasks]}
        - {name: date, in: query, required: false, schema: {type: string, format: date}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Section retrieved (data may be null if the section has nothing to show)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [section]
                    properties:
                      section:
                        type: [object, "null"]
                        required: [key, type, title, subtitle, order, action, data, meta]
                        properties:
                          key: {type: string}
                          type: {type: string}
                          title: {type: [string, "null"]}
                          subtitle: {type: [string, "null"]}
                          order: {type: integer}
                          action:
                            type: [object, "null"]
                            required: [key, label]
                            properties: {key: {type: string}, label: {type: string}}
                          data:
                            type: object
                            additionalProperties:
                              anyOf:
                                - type: object
                                  properties:
                                    id: {type: integer}
                                    name: {type: [string, "null"]}
                                    key: {type: string}
                                    label: {type: string}
                                    illumination: {type: number}
                                    age_days: {type: integer}
                                    unread_count: {type: integer}
                                    has_unread: {type: boolean}
                                    percent: {type: number}
                                    level: {type: string}
                                    completed: {type: integer}
                                    total: {type: integer}
                                    phone: {type: string}
                                    from: {$ref: "#/components/schemas/Date"}
                                    to: {$ref: "#/components/schemas/Date"}
                                    cycle_day: {type: integer}
                                    started_at: {$ref: "#/components/schemas/Date"}
                                    period_end_date: {$ref: "#/components/schemas/Date"}
                                    period_length: {type: number}
                                    is_ongoing: {type: boolean}
                                    cycle_length:
                                      anyOf:
                                        - type: object
                                          required: [min, max]
                                          properties: {min: {type: number}, max: {type: number}}
                                        - {type: number}
                                    cycle_length_source: {type: string}
                                    based_on_cycles: {type: number}
                                    period_duration:
                                      type: object
                                      required: [min, max]
                                      properties: {min: {type: number}, max: {type: number}}
                                - type: array
                                  items:
                                    type: object
                                    additionalProperties:
                                      anyOf:
                                        - type: object
                                          required: [min, max]
                                          properties: {min: {type: number}, max: {type: number}}
                                        - {type: array, items: {type: string}}
                                        - {type: string}
                                        - {type: number}
                                        - {type: boolean}
                                        - {type: "null"}
                                - {type: string}
                                - {type: number}
                                - {type: boolean}
                                - {type: "null"}
                          meta:
                            description: "Only `null` was recorded in the contract goldens; type not pinned."
              example:
                success: true
                data:
                  section:
                    key: challenge
                    type: challenge
                    title: "Today's challenge"
                    subtitle: null
                    order: 70
                    action: null
                    data:
                      id: 21
                      title: Replenish iron after your period
                      description: "After bleeding, pair an iron-rich meal with vitamin C"
                      category: nutrition
                      cycle_day: 7
                      cycle_day_from: 5
                      cycle_day_to: 9
                      is_completed: false
                    meta: null
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404':
          description: Unknown section key
          content:
            application/json:
              schema:
                type: object
                required: [success, message, available_sections]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  available_sections: {type: array, items: {type: string}}
              example:
                success: false
                message: Unknown section
                available_sections:
                  - header
                  - week_calendar
                  - next_period
                  - cycle_prediction
                  - recommendations
                  - tasks
                  - challenge
                  - doctor_reminder
                  - medication_reminder
                  - smart_tip
                  - affirmation
                  - weekly_summary
                  - vitals
                  - status_charts
                  - articles
                  - my_cycles
                  - cycle_summary
        '422': {$ref: "#/components/responses/ValidationFailed"}
