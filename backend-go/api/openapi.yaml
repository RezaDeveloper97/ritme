              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: "#/components/schemas/OnboardingState"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/onboarding/steps/{step}:
    put:
      tags: [Profile]
      summary: Save one onboarding step
      description: |
        Idempotent: every step replaces its own answers, so repeating a request gives the same state. Bodies:
        `name` {name}; `gender` {gender}; `goal` {goal} (sets the life mode and keeps `user_goal` /
        `pregnancy_intention` in step: only ttc is TTC); `cycle` {last_period_start?, period_duration?,
        cycle_duration?} and `health` {birthday?, height?, weight?} write the profile like `POST /profile`
        (null / absent = keep; «دقیق یادم نیست» = no last_period_start); `menopause` {stage, last_period?, surgical?,
        hrt?}; `conditions` {chronic_illnesses?, gyn_conditions?, medications?} (lists stored deduplicated in
        screen order; null / absent = skipped, [] = «هیچ‌کدام»). The first step stamps `started_at` (a user who
        already finished the legacy onboarding is stamped completed too). Responds with the full state.
        Per-user write throttle. An unknown step is a 404.
      operationId: updateOnboardingStep
      security:
        - {bearerAuth: []}
      parameters:
        - name: step
          in: path
          required: true
          schema: {type: string, enum: [name, gender, goal, cycle, menopause, conditions, health]}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 255}
                gender: {type: string, enum: [female, male]}
                goal: {type: string, enum: [cycle, ttc, pregnancy, menopause]}
                last_period_start: {oneOf: [{$ref: "#/components/schemas/Date"}, {type: "null"}]}
                period_duration: {type: [integer, "null"], minimum: 1, maximum: 15}
                cycle_duration: {type: [integer, "null"], minimum: 15, maximum: 60}
                stage: {type: string, enum: [peri, meno, post, unsure]}
                last_period: {oneOf: [{$ref: "#/components/schemas/Date"}, {type: "null"}], description: "approximate; the client sends any day of the chosen month"}
                surgical: {type: [boolean, "null"]}
                hrt: {type: [boolean, "null"]}
                chronic_illnesses: {type: [array, "null"], items: {type: string, enum: [diabetes, hypertension, thyroid, asthma, anemia, migraine, other]}}
                gyn_conditions: {type: [array, "null"], items: {type: string, enum: [pcos, endometriosis, fibroids, recurrent_infections, other]}}
                medications: {type: [array, "null"], items: {type: string, enum: [contraceptive_pill, iud, hormonal_medication]}}
                birthday: {oneOf: [{$ref: "#/components/schemas/Date"}, {type: "null"}]}
                height: {type: [integer, "null"], minimum: 50, maximum: 250}
                weight: {type: [number, "null"], minimum: 20, maximum: 300}
            example: {stage: peri, last_period: "2025-08-01", surgical: false, hrt: null}
      responses:
        '200':
          description: Saved; the state
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {$ref: "#/components/schemas/OnboardingState"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404':
          description: Unknown step (framework 404)
          content:
            application/json:
              schema: {type: object, properties: {message: {type: string}}}
        '422':
          description: "Validation failed (controller 422 `{success: false, message, errors}`, request language)"
          content:
            application/json:
              schema:
                type: object
                required: [success, message, errors]
                properties:
                  success: {type: boolean, const: false}
                  message: {type: string}
                  errors:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/onboarding/complete:
    post:
      tags: [Profile]
      summary: Finish onboarding
      description: |
        «ورود به ریتمی». Needs a name and a gender and, for a woman, the goal; otherwise a 422 whose `errors` are
        keyed by the missing step (`name`, `gender`, `goal`). Creates the profile row if no step did and stamps
        `completed_at` once (repeating keeps the first time). Afterwards `profile_completed` is true.
      operationId: completeOnboarding
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Completed; the state
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {$ref: "#/components/schemas/OnboardingState"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422':
          description: "Validation failed (controller 422 `{success: false, message, errors}`, request language)"
          content:
            application/json:
              schema:
                type: object
                required: [success, message, errors]
                properties:
                  success: {type: boolean, const: false}
                  message: {type: string}
                  errors:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/profile:
    get:
      tags: [Profile]
      summary: Get user profile
      description: "Retrieve the authenticated user's profile information"
      operationId: getProfile
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [user, profile, bmi]
                    properties:
                      user:
                        type: object
                        required:
                          - id
                          - name
                          - email
                          - mobile
                          - mobile_verified_at
                          - blocked_at
                          - email_verified_at
                          - created_at
                          - updated_at
                          - profile
                        properties:
                          id: {type: integer}
                          name: {type: [string, "null"]}
                          email: {type: [string, "null"]}
                          mobile: {type: string}
                          mobile_verified_at: {$ref: "#/components/schemas/LaravelDateTime"}
                          blocked_at:
                            anyOf:
                              - {$ref: "#/components/schemas/LaravelDateTime"}
                              - {$ref: "#/components/schemas/IsoDateTime"}
                              - {type: "null"}
                          email_verified_at:
                            anyOf:
                              - {$ref: "#/components/schemas/LaravelDateTime"}
                              - {$ref: "#/components/schemas/IsoDateTime"}
                              - {type: "null"}
                          created_at: {$ref: "#/components/schemas/LaravelDateTime"}
                          updated_at: {$ref: "#/components/schemas/LaravelDateTime"}
                          profile: {$ref: "#/components/schemas/Profile"}
                      profile: {$ref: "#/components/schemas/Profile"}
                      bmi:
                        type: [object, "null"]
                        required: [value, category, category_label, message]
                        properties:
                          value: {type: number}
                          category: {type: string}
                          category_label: {type: string}
                          message: {type: string}
        '401': {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [Profile]
      summary: Create or update user profile
      description: "Create or update the authenticated user's profile information including menstrual cycle data. A confirmed onboarding period (cycle_histories, source user_profile_confirmed) is seeded or re-synced only from a sent `last_period_start` (D-24: Go never defaults it to today; Laravel does)."
      operationId: postProfile
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name: {description: "User's name", type: string, examples: [Sara]}
                birthday: {description: Date of birth, type: string, format: date, examples: ["1995-05-15"]}
                weight: {description: Weight in kg, type: number, format: float, examples: [60.5]}
                height: {description: Height in cm, type: integer, examples: [165]}
                period_duration:
                  description: "How long does your period usually last? (days)"
                  type: integer
                  examples: [5]
                cycle_duration:
                  description: "How long does your cycle usually last? (days)"
                  type: integer
                  examples: [28]
                last_period_start:
                  description: "When did your last period start? Left empty (null) if not provided (D-24; Laravel defaults it to today for non-pregnant users)"
                  type: string
                  format: date
                  examples: ["2024-12-01"]
                user_goal:
                  description: "User goal: ttc (Trying to Conceive) or non_ttc"
                  type: string
                  enum: [ttc, non_ttc]
                  examples: [non_ttc]
                subscription_type:
                  description: Subscription type
                  type: string
                  enum: [free, premium]
                  examples: [free]
                pregnancy_intention:
                  description: "Pregnancy intention captured at onboarding; derives user_goal (trying=ttc)"
                  type: string
                  enum: [avoiding, pregnant, trying, unsure]
                  examples: [avoiding]
                chronic_conditions:
                  description: Optional self-reported chronic conditions
                  type: array
                  items:
                    type: string
                    enum: [pcos, hypothyroidism, hyperthyroidism, hypertension, heart_disease, diabetes]
              type: object
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data:
                    type: object
                    required: [user, profile, calculation_status]
                    properties:
                      user:
                        type: object
                        required:
                          - id
                          - name
                          - email
                          - mobile
                          - mobile_verified_at
                          - blocked_at
                          - email_verified_at
                          - created_at
                          - updated_at
                        properties:
                          id: {type: integer}
                          name: {type: [string, "null"]}
                          email: {type: [string, "null"]}
                          mobile: {type: string}
                          mobile_verified_at: {$ref: "#/components/schemas/LaravelDateTime"}
                          blocked_at:
                            anyOf:
                              - {$ref: "#/components/schemas/LaravelDateTime"}
                              - {$ref: "#/components/schemas/IsoDateTime"}
                              - {type: "null"}
                          email_verified_at:
                            anyOf:
                              - {$ref: "#/components/schemas/LaravelDateTime"}
                              - {$ref: "#/components/schemas/IsoDateTime"}
                              - {type: "null"}
                          created_at: {$ref: "#/components/schemas/LaravelDateTime"}
                          updated_at: {$ref: "#/components/schemas/LaravelDateTime"}
                      profile:
                        type: object
                        required:
                          - id
                          - user_id
                          - birthday
                          - weight
                          - height
                          - period_duration
                          - cycle_duration
                          - last_period_start
                          - user_goal
                          - pregnancy_intention
                          - chronic_conditions
                          - subscription_type
                          - calculation_status
                          - calculation_started_at
                          - calculation_completed_at
                          - calculation_version
                          - created_at
                          - updated_at
                        properties:
                          id: {type: integer}
                          user_id: {type: integer}
                          birthday:
                            anyOf: [{$ref: "#/components/schemas/Date"}, {type: "null"}]
                          weight: {type: [number, "null"]}
                          height: {type: [number, "null"]}
                          period_duration: {type: [number, "null"]}
                          cycle_duration: {type: [number, "null"]}
                          last_period_start:
                            anyOf: [{$ref: "#/components/schemas/Date"}, {type: "null"}]
                          user_goal: {type: string}
                          pregnancy_intention: {type: [string, "null"]}
                          chronic_conditions: {type: [array, "null"], items: {type: string}}
                          subscription_type: {type: string}
                          calculation_status: {type: string}
                          calculation_started_at:
                            anyOf: [{$ref: "#/components/schemas/LaravelDateTime"}, {type: "null"}]
                          calculation_completed_at:
                            anyOf: [{$ref: "#/components/schemas/LaravelDateTime"}, {type: "null"}]
                          calculation_version: {type: integer}
                          created_at: {$ref: "#/components/schemas/LaravelDateTime"}
                          updated_at: {$ref: "#/components/schemas/LaravelDateTime"}
                      calculation_status: {type: string}
              example:
                success: true
                message: Profile updated successfully
                data:
                  user:
                    id: 1001
                    name: New Person
                    email: null
                    mobile: "09900000001"
                    mobile_verified_at: "2026-09-23T05:30:00.000000Z"
                    blocked_at: null
                    email_verified_at: null
                    created_at: "2026-09-23T05:30:00.000000Z"
                    updated_at: "2026-09-23T06:30:00.000000Z"
                  profile:
                    id: 1019
                    user_id: 1001
                    birthday: "1995-02-14"
                    weight: 58.5
                    height: 162
                    period_duration: 5
                    cycle_duration: 29
                    last_period_start: "2026-09-10"
                    user_goal: non_ttc
                    pregnancy_intention: avoiding
                    chronic_conditions: []
                    subscription_type: free
                    calculation_status: completed
                    calculation_started_at: "2026-09-23T06:30:00.000000Z"
                    calculation_completed_at: "2026-09-23T06:30:00.000000Z"
                    calculation_version: 1
                    created_at: "2026-09-23T06:30:00.000000Z"
                    updated_at: "2026-09-23T06:30:00.000000Z"
                  calculation_status: completed
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  errors:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
                  allowed_fields: {type: array, items: {type: string}}
              example:
                success: false
                message: "Validation failed: Birthday must be a valid date."
                errors: {birthday: [Birthday must be a valid date.]}
  /api/v1/profile/notification-settings:
    get:
      tags: [Profile]
      summary: Notification settings
      description: |
        Go only (B-N1-11). The categories a push may be sent for (grouped cycle · health · other, screen order),
        the quiet-hours window (Tehran wall-clock, `start` > `end` wraps midnight) and `neutral_copy` («متن خنثی»:
        push title/body never carry health data). A user who never saved gets the defaults (fertile window, vitals
        and articles off; quiet 23:00–08:00; neutral copy on).
      operationId: getNotificationSettings
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: "#/components/schemas/NotificationSettings"}
              example:
                success: true
                data:
                  groups:
                    - {code: cycle, items: [{code: before_period, enabled: true}, {code: pms, enabled: true}, {code: fertile_window, enabled: false}, {code: daily_log, enabled: true}]}
                    - {code: health, items: [{code: medications, enabled: true}, {code: appointments, enabled: true}, {code: checkups, enabled: true}, {code: vitals, enabled: false}]}
                    - {code: other, items: [{code: learning, enabled: true}, {code: companion, enabled: true}, {code: articles, enabled: false}]}
                  quiet_hours: {enabled: true, start: "23:00", end: "08:00"}
                  neutral_copy: true
        '401': {$ref: "#/components/responses/Unauthenticated"}
    put:
      tags: [Profile]
      summary: Update notification settings
      description: |
        Partial update: omitted keys keep their value; unknown category codes are ignored. Responds with the full
        settings. Per-user write throttle.
      operationId: updateNotificationSettings
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                categories:
                  type: object
                  additionalProperties: {type: boolean}
                quiet_hours:
                  type: object
                  properties:
                    enabled: {type: boolean}
                    start: {type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$"}
                    end: {type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$"}
                neutral_copy: {type: boolean}
            example: {categories: {fertile_window: true}, quiet_hours: {enabled: true, start: "22:30", end: "07:00"}, neutral_copy: true}
      responses:
        '200':
          description: Saved; the settings
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {$ref: "#/components/schemas/NotificationSettings"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422':
          description: "Validation failed (controller 422 `{success: false, message, errors}`, request language)"
          content:
            application/json:
              schema:
                type: object
                required: [success, message, errors]
                properties:
                  success: {type: boolean, const: false}
                  message: {type: string}
                  errors:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/profile/cycle-settings:
    get:
      tags: [Profile]
      summary: Cycle settings
      description: |
        Go only (B-N1-09). «سیکل تو»: the cycle / period length the screen shows, whether it is «خودکار از داده‌ها»
        (`auto`: the engine's median of the last valid cycles → profile → default) or manual (the profile's
        `cycle_duration` / `period_duration`), with both layers. «یادآورها»: the timed cycle reminders in screen
        order — switches are notification-settings categories (`pill` is set only here), times are Tehran
        wall-clock; `days_before` (before_period) and `cycle_day` (pms, the first day of the 3-day PMS window).
        Never saved = automatic lengths and the default reminders.
      operationId: getCycleSettings
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: "#/components/schemas/CycleSettings"}
              example:
                success: true
                data:
                  lengths:
                    auto: true
                    cycle_length: 29
                    period_length: 5
                    calculated: {cycle_length: 29, period_length: 5, based_on_cycles: 6}
                    manual: {cycle_length: 28, period_length: 5}
                  reminders:
                    - {code: before_period, enabled: true, time: "09:00", days_before: 2}
                    - {code: pms, enabled: true, time: "09:00", cycle_day: 27}
                    - {code: fertile_window, enabled: false, time: "09:00"}
                    - {code: daily_log, enabled: true, time: "22:00"}
                    - {code: pill, enabled: false, time: "21:00"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
    put:
      tags: [Profile]
      summary: Update cycle settings
      description: |
        Partial update: omitted keys keep their value. `cycle_length` / `period_length` are written to the profile
        like `POST /profile` (the engine recalculates). Reminder switches and times are stored on the
        notification preferences (quiet hours and neutral copy are untouched). Responds with the full settings.
        Per-user write throttle.
      operationId: updateCycleSettings
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lengths_auto: {type: boolean}
                cycle_length: {type: integer, minimum: 15, maximum: 60}
                period_length: {type: integer, minimum: 1, maximum: 15}
                reminders:
                  type: object
                  description: "Keyed by reminder code (before_period, pms, fertile_window, daily_log, pill)."
                  additionalProperties:
                    type: object
                    properties:
                      enabled: {type: boolean}
                      time: {type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$"}
                      days_before: {type: integer, minimum: 1, maximum: 7, description: "before_period only"}
            example: {lengths_auto: false, cycle_length: 30, reminders: {before_period: {days_before: 3, time: "20:00"}, pill: {enabled: true}}}
      responses:
        '200':
          description: Saved; the settings
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {$ref: "#/components/schemas/CycleSettings"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422':
          description: "Validation failed (controller 422 `{success: false, message, errors}`, request language)"
          content:
            application/json:
              schema:
                type: object
                required: [success, message, errors]
                properties:
                  success: {type: boolean, const: false}
                  message: {type: string}
                  errors:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/profile/life-stage:
    get:
      tags: [Profile]
      summary: Life-stage mode
      description: |
        Go only (B-N2-01). `mode` is the effective mode: an active pregnancy profile → pregnancy; a stored
        postpartum / menopause / teen → that; otherwise `user_goal` ttc → ttc, else cycle (users without a stored
        mode — everyone before B-N2-01 — resolve exactly as before). `stored_mode` is the user's choice (null =
        none). `ivf_iui` / `track_contraception` are the mode screen's switches (nbl_Me_Mode).
      operationId: getLifeStage
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The life stage
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: "#/components/schemas/LifeStage"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
    put:
      tags: [Profile]
      summary: Update the life-stage mode
      description: |
        Partial update {mode?, ivf_iui?, track_contraception?}. A mode keeps `user_goal` / `pregnancy_intention`
        in step (only ttc is TTC; pregnancy → intention pregnant) and never deletes data. Pregnancy itself is
        switched by the pregnancy endpoints: while a pregnancy profile is active the effective mode stays
        pregnancy. Per-user write throttle.
      operationId: updateLifeStage
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: {type: string, enum: [cycle, ttc, pregnancy, postpartum, menopause, teen]}
                ivf_iui: {type: boolean}
                track_contraception: {type: boolean}
            example: {mode: ttc, ivf_iui: true}
      responses:
        '200':
          description: Saved; the life stage
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {$ref: "#/components/schemas/LifeStage"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422':
          description: "Validation failed (controller 422 `{success: false, message, errors}`, request language)"
          content:
            application/json:
              schema:
                type: object
                required: [success, message, errors]
                properties:
                  success: {type: boolean, const: false}
                  message: {type: string}
                  errors:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/profile/life-stage/loss-copy:
    get:
      tags: [Profile]
      summary: Calm pregnancy-exit copy
      description: |
        Go only (B-N2-03). The admin-edited texts of the mode switcher's calm pregnancy exit («اگر بارداری‌ات
        ادامه پیدا نکرد»): message_contents `pregnancy_setup` / `loss_exit` in the request language, else the
        default language's row (live = active + approved). Every key is always present; a text is null while no
        live row has it, so the app falls back to its translation bundle. The exit itself is
        `POST /pregnancy/deactivate` + `PUT /profile/life-stage`.
      operationId: getLifeStageLossCopy
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The copy
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [title, body, confirm, cancel, done_title, done_body, done_action]
                    properties:
                      title: {type: [string, "null"]}
                      body: {type: [string, "null"]}
                      confirm: {type: [string, "null"]}
                      cancel: {type: [string, "null"]}
                      done_title: {type: [string, "null"]}
                      done_body: {type: [string, "null"]}
                      done_action: {type: [string, "null"]}
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/profile/consents:
    get:
      tags: [Profile]
      summary: Privacy consents
      description: |
        Go only (B-N1-12). The consents of the Privacy screen in screen order: `ai_lab_analysis` (lab results may
        be read by the AI analysis), `assistant_profile` (the health assistant may use age, mode and medications),
        `anonymous_stats` (anonymous usage statistics). Every consent is opt-in: never answered = `granted: false`.
        `granted_at` / `revoked_at` are the last grant / withdrawal (null when never).
      operationId: getConsents
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The consents
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: "#/components/schemas/Consents"}
              example:
                success: true
                data:
                  consents:
                    - {code: ai_lab_analysis, granted: true, granted_at: "2026-09-23T10:00:00+03:30", revoked_at: null}
                    - {code: assistant_profile, granted: false, granted_at: null, revoked_at: null}
                    - {code: anonymous_stats, granted: false, granted_at: null, revoked_at: null}
        '401': {$ref: "#/components/responses/Unauthenticated"}
    put:
      tags: [Profile]
      summary: Update privacy consents
      description: |
        Partial update `{consents: {<code>: bool}}`: omitted codes keep their answer, unknown codes are ignored.
        A change is stamped with the request time (grant → `granted_at`, withdrawal of a grant → `revoked_at`).
        Responds with all consents. Per-user write throttle.
      operationId: updateConsents
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consents]
              properties:
                consents:
                  type: object
                  properties:
                    ai_lab_analysis: {type: boolean}
                    assistant_profile: {type: boolean}
                    anonymous_stats: {type: boolean}
            example: {consents: {ai_lab_analysis: true, anonymous_stats: false}}
      responses:
        '200':
          description: Saved; the consents
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {$ref: "#/components/schemas/Consents"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422':
          description: "Validation failed (controller 422 `{success: false, message, errors}`, request language)"
          content:
            application/json:
              schema:
                type: object
                required: [success, message, errors]
                properties:
                  success: {type: boolean, const: false}
                  message: {type: string}
                  errors:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/support/reports:
    post:
      tags: [Profile]
      summary: Report a problem
      description: |
        Go only (B-N1-12, «گزارش مشکل»). Multipart, or JSON with the screenshot as a base64 data URL: `message` (10–2000 chars),
        optional `app_version` and `screenshot` (jpeg/png/webp judged by its bytes, ≤ 5 MB). The screenshot is
        re-encoded (metadata dropped) and kept on the private storage volume; the report is read by the support
        team in the admin and is not sent to third parties. The user agent is stored with it. More than 5 reports
        in an hour → 429; also under the per-user write throttle.
      operationId: createSupportReport
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string, minLength: 10, maxLength: 2000}
                app_version: {type: string, maxLength: 32}
                screenshot: {type: string, format: binary}
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string, minLength: 10, maxLength: 2000}
                app_version: {type: string, maxLength: 32}
                screenshot: {type: string, description: "Optional base64 data URL `data:image/<type>;base64,…` (the web client)"}
            example: {message: "The period prediction looks wrong after I edited a date.", app_version: "1.1.0"}
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data:
                    type: object
                    required: [id, status, created_at]
                    properties:
                      id: {type: integer}
                      status: {type: string, enum: [open]}
                      created_at: {$ref: "#/components/schemas/IsoDateTime"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422':
          description: "Validation failed (controller 422 `{success: false, message, errors}`, request language)"
          content:
            application/json:
              schema:
                type: object
                required: [success, message, errors]
                properties:
                  success: {type: boolean, const: false}
                  message: {type: string}
                  errors:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
        '429':
          description: "Too many reports in the last hour (`{success: false, message}`, request language), or the write throttle"
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success: {type: boolean, const: false}
                  message: {type: string}
