        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404': {$ref: "#/components/responses/CheckupNotFound"}
        '422': {$ref: "#/components/responses/CheckupValidationFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/cycle/date/{date}:
    get:
      tags: [Cycle]
      summary: Get cycle calculation for specific date
      description: >-
        Retrieve calculated cycle data for a specific date.
        `phase`, `is_fertile_window`, `text_flags` and `daily_tips` follow the §19 display fertile window (ends on the ovulation day): on the day after ovulation `phase` is `luteal`, `is_fertile_window` false, there is no `fertility_status` flag and the tips are the early-luteal ones; `subphase` stays `post_ovulation` (D-30).
      operationId: getCycleDateByDate
      security:
        - {bearerAuth: []}
      parameters:
        - name: date
          in: path
          description: Date (YYYY-MM-DD)
          required: true
          schema: {type: string, format: date, examples: ["2024-12-15"]}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Cycle calculation retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [calculation, cycle_view, calculation_status, is_recalculating]
                    properties:
                      calculation:
                        type: object
                        required:
                          - calculation_date
                          - cycle_day
                          - phase
                          - subphase
                          - estimated_ovulation_day
                          - cycle_length_used
                          - is_fertile_window
                          - is_pms_window
                          - is_period_tomorrow
                          - is_luteal_spotting
                          - cycle_score
                          - age_factor
                          - base_probability
                          - symptom_score
                          - final_probability
                          - cycle_variability
                          - uncertainty_range
                          - text_flags
                          - daily_tips
                          - source_profile_data
                          - source_daily_log_data
                        properties:
                          calculation_date: {$ref: "#/components/schemas/Date"}
                          cycle_day: {type: [integer, "null"]}
                          phase: {type: [string, "null"]}
                          subphase: {type: [string, "null"]}
                          estimated_ovulation_day: {type: [integer, "null"]}
                          cycle_length_used: {type: [number, "null"]}
                          is_fertile_window: {type: boolean}
                          is_pms_window: {type: boolean}
                          is_period_tomorrow: {type: boolean}
                          is_luteal_spotting: {type: boolean}
                          cycle_score: {type: [number, "null"]}
                          age_factor: {type: [number, "null"]}
                          base_probability: {type: [number, "null"]}
                          symptom_score: {type: [number, "null"]}
                          final_probability: {type: [number, "null"]}
                          cycle_variability: {type: [string, "null"]}
                          uncertainty_range: {type: [number, "null"]}
                          text_flags:
                            type: object
                            properties:
                              probability_message: {type: string}
                              phase_info: {type: string}
                              fertility_status: {type: string}
                              pms_warning: {type: string}
                              period_prediction: {type: string}
                              incomplete_profile: {type: string}
                          daily_tips:
                            type: array
                            items:
                              type: object
                              required: [type, title, icon, text]
                              properties:
                                type: {type: string}
                                title: {type: string}
                                icon: {type: string}
                                text: {type: string}
                          source_profile_data:
                            type: [object, "null"]
                            required: [birthday, period_duration, cycle_duration, last_period_start]
                            properties:
                              birthday: {$ref: "#/components/schemas/Date"}
                              period_duration: {type: number}
                              cycle_duration: {type: number}
                              last_period_start: {$ref: "#/components/schemas/Date"}
                          source_daily_log_data:
                            type: [object, "null"]
                            additionalProperties:
                              anyOf:
                                - {type: array, items: {type: string}}
                                - {type: string}
                                - {type: number}
                                - {type: boolean}
                                - {type: "null"}
                      cycle_view: {$ref: "#/components/schemas/CycleView"}
                      calculation_status: {type: string}
                      is_recalculating: {type: boolean}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties: {success: {type: boolean}, message: {type: string}}
              example: {success: false, message: Invalid date format. Use YYYY-MM-DD.}
  /api/v1/cycle/history:
    get:
      tags: [Cycle]
      summary: Cycle history — median length, period length, spread, regularity verdict and per-cycle bars
      description: |
        Go only (B-N1-08, Night & Bloom «سیکل‌های من»). Reads the user's confirmed, non-estimated periods that started
        on or before today. `cycles` is the current cycle first (`is_current`, `end` null, `length` = days so far,
        today inclusive) and then the newest ≤ 6 completed cycles, newest first (`end` = the day before the next
        start). `period_days` = end − start + 1 of a closed period; an open one counts the days so far, capped at the
        effective period length (`period_ongoing: true`). `cycle_length.median` = median of the window's valid
        (21–45 d) lengths; `spread_days` = max(2, round(median absolute deviation)); `range` = median ± spread;
        `in_range` marks a completed cycle inside that band (null without a band, always null for the current one).
        `regularity.status` = `regular` when at most one cycle falls outside the band and the spread is ≤ 4 days,
        `irregular` otherwise, `not_enough_data` with fewer than two valid lengths. `predicted` = the effective cycle
        length the predictions use. Descriptive only, never diagnostic.
      operationId: getCycleHistory
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The history
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [date, based_on_cycles, cycle_length, period_length, regularity, cycles]
                    properties:
                      date: {$ref: "#/components/schemas/Date"}
                      based_on_cycles: {type: integer, minimum: 0}
                      cycle_length:
                        type: object
                        required: [median, spread_days, range, predicted]
                        properties:
                          median: {type: [integer, "null"]}
                          spread_days: {type: [integer, "null"]}
                          range:
                            oneOf:
                              - {type: "null"}
                              - type: object
                                required: [min, max]
                                properties: {min: {type: integer}, max: {type: integer}}
                          predicted: {type: integer}
                      period_length:
                        type: object
                        required: [median]
                        properties: {median: {type: [integer, "null"]}}
                      regularity:
                        type: object
                        required: [status, in_range, total]
                        properties:
                          status: {type: string, enum: [regular, irregular, not_enough_data]}
                          in_range: {type: integer, minimum: 0}
                          total: {type: integer, minimum: 0}
                      cycles:
                        type: array
                        items:
                          type: object
                          required: [start, end, period_end, period_days, period_ongoing, length, is_current, in_range]
                          properties:
                            start: {$ref: "#/components/schemas/Date"}
                            end:
                              oneOf: [{type: "null"}, {$ref: "#/components/schemas/Date"}]
                            period_end:
                              oneOf: [{type: "null"}, {$ref: "#/components/schemas/Date"}]
                            period_days: {type: integer, minimum: 0}
                            period_ongoing: {type: boolean}
                            length: {type: integer, minimum: 1}
                            is_current: {type: boolean}
                            in_range: {type: [boolean, "null"]}
              example:
                success: true
                data:
                  date: "2026-10-01"
                  based_on_cycles: 2
                  cycle_length: {median: 29, spread_days: 2, range: {min: 27, max: 31}, predicted: 29}
                  period_length: {median: 5}
                  regularity: {status: regular, in_range: 2, total: 2}
                  cycles:
                    - {start: "2026-09-10", end: null, period_end: "2026-09-14", period_days: 5, period_ongoing: false, length: 22, is_current: true, in_range: null}
                    - {start: "2026-08-12", end: "2026-09-09", period_end: "2026-08-16", period_days: 5, period_ongoing: false, length: 29, is_current: false, in_range: true}
                    - {start: "2026-07-14", end: "2026-08-11", period_end: "2026-07-18", period_days: 5, period_ongoing: false, length: 29, is_current: false, in_range: true}
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/cycle/symptom-pattern:
    get:
      tags: [Cycle]
      summary: Per-symptom pattern over the typical cycle (heat strips)
      description: |
        Go only (B-N1-08, Night & Bloom «الگوی علائم»). The newest ≤ 6 completed cycles with a valid length
        (21–45 d) are mapped onto a typical cycle of `typical.cycle_length` days (their median; the effective length
        until then): the last 14 days line up with the next period, the earlier part stretches proportionally. Each
        `strip` has one value per typical day — the mean logged weight across the cycles, 0–1 (pain scale low/medium/high
        = ⅓/⅔/1, a yes/no symptom or a mood = 1). `cycles` counts the cycles in which the symptom was logged at all;
        items are sorted by it (catalogue order for ties) and only logged symptoms appear. `window` is the run around
        the strip's peak that stays ≥ half of it (1-based days); `relation` `before_period` (it reaches the end;
        `days` = days before the period it starts), `early` (it starts on day 1–2; `days` = its length) or `mid`.
        Until `cycles_counted` reaches `cycles_needed` (3) `ready` is false and every group is empty. Groups and
        symptom keys are stable codes the clients label. The patterns show co-occurrence, not cause.
      operationId: getCycleSymptomPattern
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The pattern
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [ready, cycles_counted, cycles_needed, typical, groups]
                    properties:
                      ready: {type: boolean}
                      cycles_counted: {type: integer, minimum: 0}
                      cycles_needed: {type: integer}
                      typical:
                        type: object
                        required: [cycle_length, period_length, ovulation_day]
                        properties:
                          cycle_length: {type: integer}
                          period_length: {type: integer}
                          ovulation_day: {type: integer}
                      groups:
                        type: array
                        items:
                          type: object
                          required: [key, items]
                          properties:
                            key: {type: string, enum: [symptoms, mood, pain]}
                            items:
                              type: array
                              items:
                                type: object
                                required: [key, cycles, strip, window]
                                properties:
                                  key: {type: string}
                                  cycles: {type: integer, minimum: 1}
                                  strip: {type: array, items: {type: number, minimum: 0, maximum: 1}}
                                  window:
                                    oneOf:
                                      - {type: "null"}
                                      - type: object
                                        required: [start_day, end_day, relation, days]
                                        properties:
                                          start_day: {type: integer}
                                          end_day: {type: integer}
                                          relation: {type: string, enum: [before_period, early, mid]}
                                          days: {type: integer}
              example:
                success: true
                data:
                  ready: false
                  cycles_counted: 2
                  cycles_needed: 3
                  typical: {cycle_length: 28, period_length: 5, ovulation_day: 14}
                  groups: [{key: symptoms, items: []}, {key: mood, items: []}, {key: pain, items: []}]
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/cycle/month/{year}/{month}:
    get:
      tags: [Cycle]
      summary: Get cycle calculations for a month
      description: |
        Retrieve all calculated cycle data for a specific month (calendar view)

        Encoded with `JSON_UNESCAPED_UNICODE`. In the default `full` view `text_flags`, `daily_tips` and `source_*` stay raw `{en, fa}` blobs.
      operationId: getCycleMonthByYearByMonth
      security:
        - {bearerAuth: []}
      parameters:
        - name: year
          in: path
          description: Year
          required: true
          schema: {type: integer, examples: [2024]}
        - name: month
          in: path
          description: Month (1-12)
          required: true
          schema: {type: integer, examples: [12]}
        - name: view
          in: query
          description: "Opt-in payload size. `full` (default, unchanged — the Android app reads it) returns every engine field per day, including the bilingual `text_flags`, `daily_tips` and `source_*` snapshots. `calendar` returns per day only calculation_date, cycle_day, phase, subphase, estimated_ovulation_day, cycle_length_used, is_fertile_window, is_pms_window, is_period_tomorrow, final_probability and cycle_variability (~93 % smaller) and skips the tip/text work. A day without cycle data keeps the same sentinel in both views: `cycle_day` null."
          required: false
          schema: {type: string, default: full, enum: [full, calendar]}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Monthly cycle calculations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [calculations, calculation_status, is_recalculating, month_summary]
                    properties:
                      calculations:
                        type: array
                        items:
                          type: object
                          required:
                            - calculation_date
                            - cycle_day
                            - phase
                            - subphase
                            - estimated_ovulation_day
                            - cycle_length_used
                            - is_fertile_window
                            - is_pms_window
                            - is_period_tomorrow
                            - final_probability
                            - cycle_variability
                          properties:
                            calculation_date: {$ref: "#/components/schemas/Date"}
                            cycle_day: {type: [integer, "null"]}
                            phase: {type: [string, "null"]}
                            subphase: {type: [string, "null"]}
                            estimated_ovulation_day: {type: [integer, "null"]}
                            cycle_length_used: {type: [number, "null"]}
                            is_fertile_window: {type: boolean}
                            is_pms_window: {type: boolean}
                            is_period_tomorrow: {type: boolean}
                            final_probability: {type: [number, "null"]}
                            cycle_variability: {type: [string, "null"]}
                            is_luteal_spotting: {type: boolean}
                            cycle_score: {type: [number, "null"]}
                            age_factor: {type: [number, "null"]}
                            base_probability: {type: [number, "null"]}
                            symptom_score: {type: [number, "null"]}
                            uncertainty_range: {type: [number, "null"]}
                            text_flags:
                              type: object
                              properties:
                                fertility_status: {$ref: "#/components/schemas/RawTranslations"}
                                probability_message: {$ref: "#/components/schemas/RawTranslations"}
                                phase_info: {$ref: "#/components/schemas/RawTranslations"}
                                pms_warning: {$ref: "#/components/schemas/RawTranslations"}
                                period_prediction: {$ref: "#/components/schemas/RawTranslations"}
                                incomplete_profile: {$ref: "#/components/schemas/RawTranslations"}
                            daily_tips:
                              type: array
                              items:
                                type: object
                                required: [type, fa, en, title]
                                properties:
                                  type: {type: string}
                                  fa: {type: string}
                                  en: {type: string}
                                  title: {$ref: "#/components/schemas/RawTranslations"}
                            source_profile_data:
                              type: [object, "null"]
                              required: [birthday, period_duration, cycle_duration, last_period_start]
                              properties:
                                birthday: {$ref: "#/components/schemas/Date"}
                                period_duration: {type: number}
                                cycle_duration: {type: number}
                                last_period_start: {$ref: "#/components/schemas/Date"}
                            source_daily_log_data:
                              type: [object, "null"]
                              additionalProperties:
                                anyOf:
                                  - {type: array, items: {type: string}}
                                  - {type: string}
                                  - {type: number}
                                  - {type: boolean}
                                  - {type: "null"}
                      calculation_status: {type: string}
                      is_recalculating: {type: boolean}
                      month_summary:
                        type: object
                        required: [fertile_days, period_days, pms_days]
                        properties:
                          fertile_days: {type: integer}
                          period_days: {type: integer}
                          pms_days: {type: integer}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422':
          description: Invalid month or unknown view
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties: {success: {type: boolean}, message: {type: string}}
              example: {success: false, message: Invalid month. Must be between 1 and 12.}
  /api/v1/cycle/period:
    post:
      tags: [Period Log]
      summary: Log a complete period range
      description: "Creates a logged period from an explicit start (and optional end) date in one call. Unlike start+end, this never depends on which period is currently ongoing, so a client reconciling several ranges at once can't close the wrong one."
      operationId: postCyclePeriod
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [start_date]
              properties:
                start_date: {type: string, format: date, examples: ["2026-03-21"]}
                end_date:
                  description: Omit/null to leave the period ongoing
                  type: [string, "null"]
                  format: date
                  examples: ["2026-03-25"]
              type: object
      responses:
        '200':
          description: Period created
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data:
                    type: object
                    required: [id, active, period_start_date, period_end_date, warnings]
                    properties:
                      id: {type: integer}
                      active: {type: boolean}
                      period_start_date: {$ref: "#/components/schemas/Date"}
                      period_end_date:
                        anyOf: [{$ref: "#/components/schemas/Date"}, {type: "null"}]
                      warnings:
                        type: array
                        items:
                          type: object
                          required: [type, message]
                          properties: {type: {type: string}, message: {type: string}}
              example:
                success: true
                message: Profile updated successfully
                data:
                  id: 101805
                  active: false
                  period_start_date: "2026-03-30"
                  period_end_date: "2026-04-03"
                  warnings: []
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422':
          description: Validation error / overlap
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  errors:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
                  code: {type: string}
              example:
                success: false
                message: The end date field must be a date after or equal to start date.
                errors: {end_date: [The end date field must be a date after or equal to start date.]}
  /api/v1/cycle/period/end:
    post:
      tags: [Period Log]
      summary: Mark the ongoing period as ended
      description: Closes the current ongoing period with an end date (defaults to today) and records the bleeding length.
      operationId: postCyclePeriodEnd
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      requestBody:
        content:
          application/json:
            schema:
              properties:
                date:
                  description: "Period end date; defaults to today"
                  type: [string, "null"]
                  format: date
                  examples: ["2024-12-05"]
              type: object
      responses:
        '200':
          description: Period end recorded
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data:
                    type: object
                    required: [active, period_start_date, period_end_date, warnings]
                    properties:
                      active: {type: boolean}
                      period_start_date: {$ref: "#/components/schemas/Date"}
                      period_end_date: {$ref: "#/components/schemas/Date"}
                      warnings:
                        type: array
                        items:
                          type: object
                          required: [type, message]
                          properties: {type: {type: string}, message: {type: string}}
              example:
                success: true
                message: Profile updated successfully
                data:
                  active: false
                  period_start_date: "2026-09-21"
                  period_end_date: "2026-09-21"
