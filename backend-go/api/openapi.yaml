  /api/v1/fertility/bbt:
    get:
      tags: [Fertility]
      summary: Basal body temperature chart
      description: |
        The TTC BBT chart (docs/fertility-ttc/README.md, engine `internal/fertility/bbt`), in 3 queries (profile, cycle
        history, readings). `cycles` is newest first: the current cycle (the cycle engine's anchor for today, running to
        the day before the predicted next period, or to today when late) and, for `range` 3 / 6, the previous cycles
        between the history's period starts (fewer when the history is shorter; empty without a resolvable cycle).
        Each cycle's `points` are its `daily_health_logs.basal_body_temperature` readings up to today, numbered by
        **its own** cycle day, so the cycles overlay aligned.

        Shift rule (3-over-6, over readings — days without a reading are skipped): the first reading ≥ 0.20 °C above the
        maximum of the 6 readings before it, followed by 2 more readings above that maximum, confirms a shift;
        `coverline` = that maximum and `shift_day` = the cycle day of the first high reading (ovulation ≈ the day before),
        `phase: post_shift`. Otherwise `shift_day: null`, `phase: pre_shift` and `coverline` is provisional (the
        baseline of a rise that has fewer than 3 readings yet, else the maximum of the latest 6 readings); `null` with
        fewer than 6 readings. `fertile_window` is the cycle engine's fertile zone (`main_phase = fertile`) in cycle
        days, `null` when the cycle has none. Temperatures are `decimal(4,2)` strings.

        `stats` are the current cycle's: `pre_ovulation_avg` = mean of its first 6 readings (fewer when fewer exist;
        null without any), `logged_days`, `cycle_days_so_far` (up to today) and `gaps` = days so far without a reading.
        `past_shift_days` = the confirmed shift days of the previous cycles (up to 5, newest first), independent of
        `range`. `tip` is localized (`Accept-Language`, localized digits) and names the past shift days when known.
      operationId: getFertilityBbt
      security:
        - {bearerAuth: []}
      parameters:
        - {name: range, in: query, required: false, schema: {type: integer, enum: [1, 3, 6], default: 1}, description: "Cycles shown."}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The chart
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [range, cycles, stats, past_shift_days, tip]
                    properties:
                      range: {type: integer, enum: [1, 3, 6]}
                      cycles:
                        type: array
                        maxItems: 6
                        items: {$ref: "#/components/schemas/FertilityBbtCycle"}
                      stats:
                        type: object
                        required: [pre_ovulation_avg, logged_days, cycle_days_so_far, gaps]
                        properties:
                          pre_ovulation_avg: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/DecimalString"}]}
                          logged_days: {type: integer, minimum: 0}
                          cycle_days_so_far: {type: integer, minimum: 0}
                          gaps: {type: integer, minimum: 0}
                      past_shift_days:
                        type: array
                        items: {type: integer, minimum: 1}
                      tip:
                        type: object
                        required: [title, body]
                        properties:
                          title: {type: string}
                          body: {type: string}
              example:
                success: true
                data:
                  range: 1
                  cycles:
                    - start_date: "2026-09-10"
                      points: [{cycle_day: 1, date: "2026-09-10", value: "36.20"}, {cycle_day: 2, date: "2026-09-11", value: "36.30"}]
                      coverline: "36.45"
                      fertile_window: {from_day: 10, to_day: 15}
                      shift_day: null
                      phase: pre_shift
                  stats: {pre_ovulation_avg: "36.27", logged_days: 13, cycle_days_so_far: 14, gaps: 1}
                  past_shift_days: [16, 15]
                  tip:
                    title: دنبال جهش ۰٫۲ تا ۰٫۵ درجه باش
                    body: اگر دما سه روز پشت‌سرهم بالاتر از خط مبنا بماند، احتمالاً تخمک‌گذاری یک روز قبل از اولین روز بالا بوده. در ۲ سیکل قبل این جهش روز ۱۶ و ۱۵ بود.
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/FertilityValidationFailed"}
  /api/v1/fertility/insights:
    get:
      tags: [Fertility]
      summary: Fertility predictions and where they come from
      description: |
        The TTC insights screen (docs/fertility-ttc/README.md, `internal/fertility/insights.go`), in 4 queries (profile,
        cycle history, BBT readings, LH tests). No second prediction model: `window` is the cycle view's fertile zone
        (`main_phase = fertile` days ending on `estimated_ovulation_date`) of the current cycle while its ovulation day
        is today or later, else of the next predicted cycle (the current one's when the period is late); `null` without
        a resolvable cycle. `cycles_used` = the cycle metrics' valid complete cycles.

        `evidence` is always `cycles`, `bbt_shift`, `lh` (localized `title` / `detail`):
        `cycles` strong = relatively regular (last 3 cycles), medium = ≥ 1 valid cycle, none = 0;
        `bbt_shift` = confirmed 3-over-6 shifts in the current + last 5 cycles, strong ≥ 2, medium = 1, none = 0;
        `lh` = this cycle's tests, strong = a positive, medium = a faint, none = negatives only or no test.
        `confidence`: strong = 2, medium = 1, none = 0 points summed; high ≥ 4 (and `cycles` not none), medium ≥ 2,
        low otherwise or without a window.

        `history` = the last 5 finished cycles, newest first: `ovulation_day` (cycle day) = BBT shift day − 1
        (`source: bbt`), else the first positive LH day + 1 (`lh`), else the cycle engine's estimate (`estimate`);
        `month_label` = the month of that day in the locale's calendar (Jalali for fa). `tips` are localized strings
        chosen by what is missing (daily BBT, LH from the window's first cycle day, logging periods).
      operationId: getFertilityInsights
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The insights
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [cycles_used, window, confidence, evidence, history, tips]
                    properties:
                      cycles_used: {type: integer, minimum: 0}
                      window:
                        oneOf:
                          - {type: "null"}
                          - type: object
                            required: [start, end, ovulation]
                            properties:
                              start: {$ref: "#/components/schemas/Date"}
                              end: {$ref: "#/components/schemas/Date"}
                              ovulation: {$ref: "#/components/schemas/Date"}
                      confidence: {type: string, enum: [low, medium, high]}
                      evidence:
                        type: array
                        items:
                          type: object
                          required: [key, title, detail, strength]
                          properties:
                            key: {type: string, enum: [cycles, bbt_shift, lh]}
                            title: {type: string}
                            detail: {type: string}
                            strength: {type: string, enum: [strong, medium, none]}
                      history:
                        type: array
                        maxItems: 5
                        items:
                          type: object
                          required: [month_label, ovulation_day, date, source, cycle_start]
                          properties:
                            month_label: {type: string}
                            ovulation_day: {type: [integer, "null"], minimum: 1}
                            date: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Date"}]}
                            source: {type: string, enum: [bbt, lh, estimate]}
                            cycle_start: {$ref: "#/components/schemas/Date"}
                      tips:
                        type: array
                        items: {type: string}
              example:
                success: true
                data:
                  cycles_used: 2
                  window: {start: "2026-09-19", end: "2026-09-24", ovulation: "2026-09-24"}
                  confidence: high
                  evidence:
                    - {key: cycles, title: سیکل‌های کامل, detail: "۲ سیکل کامل، معمولاً ۲۸ روز (±۰)", strength: medium}
                    - {key: bbt_shift, title: جهش دمای پایه, detail: "جهش در ۲ سیکل، روز ۱۶ و ۱۵", strength: strong}
                    - {key: lh, title: تست LH این سیکل, detail: مثبت در روز ۱۳, strength: strong}
                  history:
                    - {month_label: شهریور, ovulation_day: 15, date: "2026-08-27", source: bbt, cycle_start: "2026-08-13"}
                    - {month_label: مرداد, ovulation_day: 14, date: "2026-07-29", source: bbt, cycle_start: "2026-07-16"}
                  tips: [شروع و پایان هر پریود را ثبت کن تا طول معمول سیکلت دقیق‌تر شود.]
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/fertility/today:
    get:
      tags: [Fertility]
      summary: Fertility home tiles for today
      description: |
        The three TTC tiles on the cycle home (LH test, basal temperature, intercourse) plus today's chance of
        pregnancy and cycle day, in 3 queries (profile, cycle history, merged day). `date` = today (Tehran).
        `chance` comes from the cycle engine's `fertility_level` for today (the same value as `cycle_view.fertility_level`;
        no second prediction model): `low` → 1 bar, `medium` → 3, `high` → 4, `peak` → 5; no resolvable cycle →
        `level: null`, the localized "unknown" label and 0 bars. Labels follow `Accept-Language`.
      operationId: getFertilityToday
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      responses:
        '200':
          description: Today's tiles
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [date, cycle_day, chance, lh, bbt, intercourse]
                    properties:
                      date: {$ref: "#/components/schemas/Date"}
                      cycle_day: {type: [integer, "null"]}
                      chance: {$ref: "#/components/schemas/FertilityChance"}
                      lh:
                        type: object
                        required: [value, label]
                        properties:
                          value: {type: [string, "null"], enum: [negative, faint, positive, null]}
                          label: {type: [string, "null"]}
                      bbt:
                        type: object
                        required: [value]
                        properties:
                          value: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/DecimalString"}]}
                      intercourse:
                        type: object
                        required: [value, label]
                        properties:
                          value: {type: [string, "null"], enum: [unprotected, protected, null]}
                          label: {type: [string, "null"]}
              example:
                success: true
                data:
                  date: "2026-09-23"
                  cycle_day: 14
                  chance: {level: peak, label: خیلی زیاد, bars: 5}
                  lh: {value: positive, label: مثبت}
                  bbt: {value: "36.70"}
                  intercourse: {value: null, label: null}
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/fertility/days/{date}:
    get:
      tags: [Fertility]
      summary: The merged fertility day
      description: |
        One day of the TTC log: `lh`, `mucus`, `bbt_time` from `fertility_logs`; `bbt`, `intercourse`, `symptoms`,
        `note` from `daily_health_logs` (the same row `GET /health-logs/{date}` shows). `symptoms` (in this order):
        `ovarian_pain` / `bloating` / `breast_sensitivity` = the matching `*_intensity` column is set (any intensity),
        `spotting` = `spotting` is true. `cycle_day` and `chance` come from the cycle engine for that date (a future
        date gets the predicted values). Any date is readable; a malformed one → 422 on `date`.
      operationId: getFertilityDay
      security:
        - {bearerAuth: []}
      parameters:
        - {name: date, in: path, required: true, schema: {$ref: "#/components/schemas/Date"}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The day
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: "#/components/schemas/FertilityDay"}
              example:
                success: true
                data: {date: "2026-09-22", cycle_day: 13, lh: positive, mucus: egg_white, bbt: "36.55", bbt_time: "06:45", intercourse: unprotected, symptoms: [ovarian_pain, bloating], note: صبح زود, chance: {level: high, label: زیاد, bars: 4}}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/FertilityValidationFailed"}
    put:
      tags: [Fertility]
      summary: Save the fertility day
      description: |
        Partial update: every key is optional, an omitted key stays as it is, an explicit `null` clears it
        (`symptoms: null` or `[]` clears all four). Unknown keys are ignored. One transaction:
        `lh` / `mucus` / `bbt_time` go to `fertility_logs` (a row left empty is deleted); `bbt` →
        `basal_body_temperature`, `intercourse` → `intercourse_type`, `note` → `notes` and the symptom chips go to
        `daily_health_logs` **through the health-log service**, so `POST /health-logs`' validation and side effects
        (period-start check, recalculation mark) run exactly as there. A selected intensity chip writes `low` unless the
        column already holds a value (kept); an unselected one is cleared; `spotting` writes `true` / null.
        When the health log answers the luteal-spotting warning, it is returned as the top-level `warning`.
        The day must not be in the future (Tehran). `bbt` 35.00–38.50 °C (stored with 2 decimals).
        Responds with the merged day, like GET.
      operationId: putFertilityDay
      security:
        - {bearerAuth: []}
      parameters:
        - {name: date, in: path, required: true, schema: {$ref: "#/components/schemas/Date"}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lh: {type: [string, "null"], enum: [negative, faint, positive, null]}
                mucus: {type: [string, "null"], enum: [dry, sticky, creamy, egg_white, null]}
                bbt: {type: [number, string, "null"], minimum: 35, maximum: 38.5, description: "°C; a numeric string is accepted."}
                bbt_time: {type: [string, "null"], pattern: "^\\d{2}:\\d{2}$", description: "`H:i`."}
                intercourse: {type: [string, "null"], enum: [unprotected, protected, null]}
                symptoms:
                  type: [array, "null"]
                  items: {type: string, enum: [ovarian_pain, bloating, breast_sensitivity, spotting]}
                note: {type: [string, "null"], maxLength: 2000}
            example: {lh: positive, mucus: egg_white, bbt: 36.55, bbt_time: "06:45", intercourse: unprotected, symptoms: [ovarian_pain, bloating], note: صبح زود}
      responses:
        '200':
          description: Saved; the merged day
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {$ref: "#/components/schemas/FertilityDay"}
                  warning:
                    type: object
                    description: "The health log's luteal-spotting warning (same body as `POST /health-logs`)."
                    required: [type, message]
                    properties:
                      type: {type: string, const: luteal_spotting_warning}
                      message: {type: string}
              example:
                success: true
                message: ثبت روز ذخیره شد
                data: {date: "2026-09-22", cycle_day: 22, lh: null, mucus: null, bbt: null, bbt_time: null, intercourse: null, symptoms: [spotting], note: null, chance: {level: low, label: کم, bars: 1}}
                warning: {type: luteal_spotting_warning, message: "این خون‌ریزی ممکن است لکه‌بینی لوتئال باشد نه شروع پریود. آیا مطمئن هستید؟"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/FertilityValidationFailed"}
  /api/v1/checkups:
    get:
      tags: [Checkups]
      summary: The screening plan
      description: |
        The user's periodic-checkup plan (docs/checkups/README.md): the shared catalog plus her custom checkups,
        evaluated by the status engine (`internal/checkups/engine`) for today (Tehran). `age` is null without a
        profile birthday. `summary` is always over the whole plan (disabled items excluded, `not_yet` counted as
        up to date); `?filter=action` lists due/overdue items, `done` recorded items that need no action.
        Labels follow `Accept-Language` (Jalali months and localized digits for fa). Three queries.
      operationId: getCheckups
      security:
        - {bearerAuth: []}
      parameters:
        - {name: filter, in: query, required: false, schema: {type: string, enum: [all, action, done]}}
