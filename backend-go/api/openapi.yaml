                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {type: "null"}
              example: {success: true, message: یادآور دارو حذف شد, data: null}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404': {$ref: "#/components/responses/CareNotFound"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
