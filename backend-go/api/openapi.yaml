  /api/v1/pregnancy/alerts:
    get:
      tags: [Pregnancy]
      summary: Get pregnancy alerts
      description: Retrieve all active pregnancy alerts for the authenticated user
      operationId: getPregnancyAlerts
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
        - name: level
          in: query
          description: Filter by alert level
          required: false
          schema: {type: string, enum: [info, warning, emergency]}
        - name: unread_only
          in: query
          description: Only show unread alerts
          required: false
          schema: {type: boolean}
      responses:
        '200':
          description: Alerts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [alerts, counts]
                    properties:
                      alerts:
                        type: array
                        items:
                          type: object
                          required:
                            - id
                            - user_id
                            - alert_level
                            - alert_type
                            - title
                            - message
                            - pregnancy_week
                            - trigger_symptoms
                            - medical_history_flags
                            - is_read
                            - is_dismissed
                            - read_at
                            - dismissed_at
                            - recommended_actions
                            - created_at
                            - updated_at
                          properties:
                            id: {type: integer}
                            user_id: {type: integer}
                            alert_level: {type: string}
                            alert_type: {type: string}
                            title: {type: string}
                            message: {type: string}
                            pregnancy_week: {type: integer}
                            trigger_symptoms:
                              type: object
                              properties:
                                movement_status: {type: string}
                                systolic: {type: number}
                                diastolic: {type: number}
                            medical_history_flags: {type: array}
                            is_read: {type: boolean}
                            is_dismissed: {type: boolean}
                            read_at:
                              anyOf: [{$ref: "#/components/schemas/LaravelDateTime"}, {type: "null"}]
                            dismissed_at:
                              anyOf:
                                - {$ref: "#/components/schemas/LaravelDateTime"}
                                - {$ref: "#/components/schemas/IsoDateTime"}
                                - {type: "null"}
                            recommended_actions: {type: array, items: {type: string}}
                            created_at: {$ref: "#/components/schemas/LaravelDateTime"}
                            updated_at: {$ref: "#/components/schemas/LaravelDateTime"}
                      counts:
                        type: object
                        required: [total, unread, emergency, warning, info]
                        properties:
                          total: {type: integer}
                          unread: {type: number}
                          emergency: {type: number}
                          warning: {type: number}
                          info: {type: number}
              example:
                success: true
                data:
                  alerts:
                    - id: 101501
                      user_id: 1015
                      alert_level: emergency
                      alert_type: symptom_based
