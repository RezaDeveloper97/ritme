  /api/v1/plus/trial:
    get:
      tags: [Plus]
      summary: The trial sheet — countdown, trial offer, offer prices and Plus usage since the trial began
      description: |
        Go only (B-N2-06, `nbl_Prem_TrialSheet`). `trial` adds `seconds_left` to the status trial object. `offer` is
        the running trial offer (null when none — see `PlusTrialOffer`); `plans` are the active plans with
        `offer_price` / `offer_monthly_price` (rials, before VAT; null when no offer runs). `usage.features` are the
        «این روزها از پلاس استفاده کردی» lines in display order: uses summed over the quota months since the trial's
        start month (`usage.since`; this month without a trial), `plus_limit` = the Plus monthly quota (null =
        unlimited). Checkout applies the same offer server-side.
      operationId: getPlusTrialSheet
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The trial sheet
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: "#/components/schemas/PlusTrialSheet"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/plus/trial/start:
    post:
      tags: [Plus]
      summary: Start the free trial
      description: |
        Once per user, ever (enforced by a unique key, so concurrent starts cannot both win), and only before any
        subscription. Responds with the status.
      operationId: startPlusTrial
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Started; the status
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {$ref: "#/components/schemas/PlusStatus"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/PlusFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/plus/checkout:
    post:
      tags: [Plus]
      summary: Price a plan or create an invoice and a payment
      description: |
        The server prices the plan; the body never carries an amount (any amount field is ignored).
        `discount_code` is case-insensitive; a rejected code is 422 on `discount_code` with `error_code`
        `discount_invalid|discount_not_started|discount_expired|discount_plan|discount_exhausted|discount_used`.
        VAT applies after the discount and is rounded down.

        - `preview: true` → `{quote}`; nothing is written.
        - otherwise → a pending invoice (it holds the discount for `PLUS_INVOICE_TTL_MINUTES`, default 30) and
          `payment` (send the user to `redirect_url`; the gateway returns them to the web app's return page with
          `reference`, `authority`, `status`). A 100 % discount is settled at once: invoice `paid`, `payment` null.

        503 `payment_unavailable` when no payment provider is configured (production until B-N2-05) or the provider
        failed.
      operationId: plusCheckout
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: {type: integer, minimum: 1}
                discount_code: {type: [string, "null"], maxLength: 64}
                preview: {type: [boolean, "null"]}
            example: {plan_id: 2, discount_code: RITME10}
      responses:
        '200':
          description: "A quote (preview) or the invoice and payment"
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data:
                    oneOf:
                      - type: object
                        required: [quote]
                        properties:
                          quote: {$ref: "#/components/schemas/PlusQuote"}
                      - type: object
                        required: [invoice, payment]
                        properties:
                          invoice: {$ref: "#/components/schemas/PlusInvoice"}
                          payment: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/PlusPayment"}]}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/PlusFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
        '503': {$ref: "#/components/responses/PlusPaymentUnavailable"}
  /api/v1/plus/verify:
    post:
      tags: [Plus]
      summary: Verify a payment
      description: |
        Settles the caller's invoice with the gateway after the return page. Idempotent: a verified invoice answers
        200 with `already_verified: true`, unchanged, without asking the gateway or adding time; concurrent verifies
        are serialised on the invoice row. Checks: the invoice belongs to the caller (else 404), `authority` is the
        invoice's own payment, the provider's settled amount equals the invoice total (`amount_mismatch`), and a
        bank reference can pay one invoice only. A declined payment marks the invoice failed (`payment_failed`;
        verifying again is `invoice_closed`); a provider error leaves it pending (503). A paid invoice adds a
        subscription period starting now, or right after the last valid period.
      operationId: plusVerify
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, authority]
              properties:
                reference: {type: string, maxLength: 32}
                authority: {type: string, maxLength: 191}
                status: {type: [string, "null"], maxLength: 32, description: "The gateway's callback status, passed through"}
            example: {reference: RPABCDEFGHIJKLMNOP, authority: FAKE-RPABCDEFGHIJKLMNOP, status: OK}
      responses:
        '200':
          description: Paid (or already paid); the invoice with its receipt and the status
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data:
                    type: object
                    required: [invoice, already_verified, status]
                    properties:
                      invoice: {$ref: "#/components/schemas/PlusInvoice"}
                      already_verified: {type: boolean}
                      status: {$ref: "#/components/schemas/PlusStatus"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404': {$ref: "#/components/responses/PlusFailed"}
        '422': {$ref: "#/components/responses/PlusFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
        '503': {$ref: "#/components/responses/PlusPaymentUnavailable"}
  /api/v1/plus/cancel:
    post:
      tags: [Plus]
      summary: Turn auto-renew off
      description: "Every valid (current or queued) period becomes `canceled` and stays valid until it ends. Idempotent while a period runs; 422 `no_subscription` without one. Responds with the status."
      operationId: plusCancel
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Canceled; the status
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {$ref: "#/components/schemas/PlusStatus"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/PlusFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/plus/restore:
    post:
      tags: [Plus]
      summary: Restore purchases
      description: |
        Re-checks the caller's pending checkouts with the gateway (paid, but the return page never verified) and
        settles the paid ones. An unpaid checkout stays pending until its reservation expires, then is failed.
        Responds with how many were restored and the status.
      operationId: plusRestore
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The restored count and the status
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data:
                    type: object
                    required: [restored, status]
                    properties:
                      restored: {type: integer, minimum: 0}
                      status: {$ref: "#/components/schemas/PlusStatus"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/payments/{provider}/return:
    get:
      tags: [Payments]
      summary: Gateway return hop
      description: |
        The payment gateway redirects the browser here after the payment (`callback_url` given at checkout). It changes
        nothing (CSRF-safe): it normalizes the provider's parameters (`authority`/`status` for the fake,
        `Authority`/`Status` for Zarinpal) and answers **303** to the web-app page named by `next` — honored only when
        it is on the allow-list (`PLUS_CALLBACK_URL`, `PAYMENT_RETURN_URLS`; scheme, host and path), otherwise the
        first allowed page (no open redirect) — with `?reference&authority&status` (`status` is `OK` or `NOK`;
        malformed values are dropped). The web app then calls `POST /plus/verify`, which settles server to server with
        the invoice's stored amount; these query values are never trusted for the verdict or the amount. Only the
        active `PAYMENT_PROVIDER` answers; any other provider is a 404.
      operationId: paymentsReturn
      security: []
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string, enum: [fake, zarinpal]}}
        - {name: reference, in: query, required: false, schema: {type: string}}
        - {name: next, in: query, required: false, description: The allow-listed web-app page to land on, schema: {type: string, format: uri}}
        - {name: authority, in: query, required: false, description: "Provider payment id (Zarinpal: `Authority`)", schema: {type: string}}
        - {name: status, in: query, required: false, description: "OK / NOK (Zarinpal: `Status`)", schema: {type: string}}
      responses:
        '303':
          description: Redirect to the allow-listed web-app return page
          headers:
            Location: {schema: {type: string, format: uri}}
            Cache-Control: {schema: {type: string, const: no-store}}
            Referrer-Policy: {schema: {type: string, const: no-referrer}}
        '404': {$ref: "#/components/responses/RouteNotFound"}
  /api/v1/payments/fake/pay/{authority}:
    get:
      tags: [Payments]
      summary: Fake gateway TEST page
      description: |
        Only while `PAYMENT_PROVIDER=fake` (the default outside production; refused at start-up in production). An
        HTML page clearly marked **TEST — FAKE GATEWAY** showing the amount and reference with "Simulate success" /
        "Simulate failure" buttons. No scripts, `frame-ancestors 'none'`, `no-store`, `no-referrer`.
      operationId: paymentsFakePage
      security: []
      parameters:
        - {name: authority, in: path, required: true, schema: {type: string, pattern: "^FAKE-"}}
      responses:
        '200':
          description: The TEST page
          content:
            text/html: {schema: {type: string}}
        '404':
          description: Unknown or expired test payment (HTML)
          content:
            text/html: {schema: {type: string}}
    post:
      tags: [Payments]
      summary: Fake gateway decision
      description: |
        The TEST page's form. Records the simulated outcome of a pending fake payment (a settled one keeps its
        outcome) and answers 303 to `/api/v1/payments/fake/return` with `authority` and `status`. Changes only the fake
        provider's own state (Redis, 7 days); the invoice is settled later by `POST /plus/verify`.
      operationId: paymentsFakeDecide
      security: []
      parameters:
        - {name: authority, in: path, required: true, schema: {type: string, pattern: "^FAKE-"}}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [success, fail]}
      responses:
        '303':
          description: Redirect to the gateway return hop
          headers:
            Location: {schema: {type: string, format: uri}}
        '404':
          description: Unknown or expired test payment (HTML)
          content:
            text/html: {schema: {type: string}}
        '422':
          description: Missing or unknown decision (HTML)
          content:
            text/html: {schema: {type: string}}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/pelvic:
    get:
      tags: [Pelvic]
      summary: The pelvic floor plan screen
      description: |
        The 8-week Kegel program as of today (Tehran): week, the catalog level of that week (`pelvic_levels`, meta
        `{week_from, hold_sec, rest_sec, reps, sets}`; the last level whose `week_from` ≤ week), the streak, the
        Saturday-to-Friday trained days, plus today's bladder diary. `program` is null without a program.
        Health data: only the caller's own rows.
      operationId: getPelvic
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: "#/components/schemas/PelvicOverview"}
              example:
                success: true
                data:
                  program:
                    started_on: "2026-09-09"
                    week: 3
                    weeks_total: 8
                    completed: false
                    level: {code: level_2, number: 2, title: سطح ۲, body: "عضلاتی را منقبض کن…", hold_sec: 5, rest_sec: 5, reps: 10, sets: 3, session_sec: 300, needs_review: true}
                    streak_days: 4
                    today_done: false
                    week_days: [{date: "2026-09-19", done: true}, {date: "2026-09-20", done: true}, {date: "2026-09-21", done: true}, {date: "2026-09-22", done: true}, {date: "2026-09-23", done: false}, {date: "2026-09-24", done: false}, {date: "2026-09-25", done: false}]
                  diary_today: {date: "2026-09-23", leak: cough, night_voids: 2, uti_symptoms: [], uti_alert: false}
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/pelvic/program:
    post:
      tags: [Pelvic]
      summary: Start or restart the program
      description: |
        One program per user: starting again moves `started_on` (trained days and diary are kept).
        `started_on` defaults to today and must not be in the future. Responds with the plan screen.
      operationId: startPelvicProgram
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                started_on: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Date"}]}
            example: {started_on: "2026-09-09"}
      responses:
        '200':
          description: Started; the plan screen
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {$ref: "#/components/schemas/PelvicOverview"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/PelvicValidationFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
    delete:
      tags: [Pelvic]
      summary: Stop the program
      description: "Deletes the program row; trained days and the bladder diary stay. Idempotent. Responds with the plan screen (`program: null`)."
      operationId: stopPelvicProgram
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Stopped; the plan screen
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {$ref: "#/components/schemas/PelvicOverview"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/pelvic/sessions:
    post:
      tags: [Pelvic]
      summary: Save a Kegel session
      description: |
        Adds one guided session to its day (`date`, default today, not in the future): one row per day accumulates
        the session count, completed sets and seconds, tagged with the level code of that day's program week.
        A stopped session counts too (send the sets actually done). Needs a program (422 on `program` otherwise).
        Responds with the plan screen.
      operationId: addPelvicSession
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sets_completed, duration_sec]
              properties:
                date: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Date"}]}
                sets_completed: {type: integer, minimum: 0, maximum: 20}
                duration_sec: {type: integer, minimum: 1, maximum: 3600}
            example: {sets_completed: 3, duration_sec: 300}
      responses:
        '200':
          description: Saved; the plan screen
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {$ref: "#/components/schemas/PelvicOverview"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/PelvicValidationFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/pelvic/diary/{date}:
    get:
      tags: [Pelvic]
      summary: One bladder-diary day
      description: "Any well-formed date; a day without a log answers the empty day. Malformed → 422 on `date`."
      operationId: getPelvicDiaryDay
      security:
        - {bearerAuth: []}
      parameters:
        - {name: date, in: path, required: true, schema: {$ref: "#/components/schemas/Date"}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The day
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: "#/components/schemas/PelvicDiaryDay"}
              example:
                success: true
                data: {date: "2026-09-22", leak: cough, night_voids: 2, uti_symptoms: [burning, frequency], uti_alert: true}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/PelvicValidationFailed"}
    put:
      tags: [Pelvic]
      summary: Save a bladder-diary day
      description: |
        Partial update: every key is optional, an omitted key stays, an explicit `null` clears it (`uti_symptoms:
        null` or `[]` clears all). Unknown keys are ignored; symptoms are de-duplicated into the enum order. A day
        left empty is deleted. The day must not be in the future (Tehran). Responds with the day.
      operationId: putPelvicDiaryDay
      security:
        - {bearerAuth: []}
      parameters:
        - {name: date, in: path, required: true, schema: {$ref: "#/components/schemas/Date"}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                leak: {type: [string, "null"], enum: [none, cough, urgency, unexplained, null]}
                night_voids: {type: [integer, "null"], minimum: 0, maximum: 20}
                uti_symptoms:
                  type: [array, "null"]
                  items: {type: string, enum: [burning, frequency, cloudy_odor]}
            example: {leak: cough, night_voids: 2, uti_symptoms: [burning]}
      responses:
        '200':
          description: Saved; the day
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {$ref: "#/components/schemas/PelvicDiaryDay"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/PelvicValidationFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/logs/taxonomy:
    get:
      tags: [Log Taxonomy]
      summary: The log taxonomy with labels
      description: |
        Categories → params → value sets of the day log v2 (Log_Taxonomy artboard, `internal/healthlog/taxonomy`),
        labelled in the request language (translation namespace `log-taxonomy`; a missing label falls back to the
        code). Without `mode` the user's current life-stage mode filters it (only what shows in that mode, no
        legacy-only values); `mode=all` lists everything with `legacy_only` flags. Param types: `single`, `multi`,
        `items` (per item a level, optional `score`), `number`, `integer`, `text`, `text_items`, `bool`, `link`
        (read-only tile owned by another feature, `source`).
      operationId: getLogTaxonomy
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
        - name: mode
          in: query
          required: false
          schema: {type: string, enum: [cycle, ttc, pregnancy, postpartum, menopause, teen, all]}
      responses:
        '200':
          description: The taxonomy
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [mode, categories]
                    properties:
                      mode: {type: [string, "null"], description: "the mode applied (null for `all`)"}
                      categories:
                        type: array
                        items: {$ref: "#/components/schemas/LogCategory"}
              example:
                success: true
                data:
                  mode: cycle
                  categories:
                    - code: bleeding
                      label: پریود و لکه‌بینی
                      group: {value: body, label: بدن}
                      modes: [cycle, ttc, menopause, teen, pregnancy, postpartum]
                      conditions: {}
                      params:
                        - {code: flow, type: single, label: شدت, modes: [cycle, ttc, menopause, teen, pregnancy], detail: false, alert: true, options: [{value: light, label: کم, modes: null, legacy_only: false}], levels: [], score: null, range: null, scale: null, unit: null, max_length: null, dynamic: false, source: null}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/ValidationFailed"}
  /api/v1/logs/days:
    get:
      tags: [Log Taxonomy]
      summary: Logged days in a range
      description: "The caller's days in [from, to] (at most 366 days) that have at least one entry, oldest first, each in the PUT body shape."
      operationId: listLogDays
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
        - {name: from, in: query, required: true, schema: {$ref: "#/components/schemas/Date"}}
        - {name: to, in: query, required: true, schema: {$ref: "#/components/schemas/Date"}, description: "on or after `from`, at most 366 days later"}
      responses:
        '200':
          description: The days
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [from, to, days]
                    properties:
                      from: {$ref: "#/components/schemas/Date"}
                      to: {$ref: "#/components/schemas/Date"}
                      days:
                        type: array
                        items: {$ref: "#/components/schemas/LogDay"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/ValidationFailed"}
  /api/v1/logs/days/{date}:
    get:
      tags: [Log Taxonomy]
      summary: One logged day
      description: "The caller's day in the PUT body shape (`categories` is `{}` when nothing is logged). Legacy days are read through the 00020 backfill and the live sync with `/health-logs`."
      operationId: getLogDay
      security:
        - {bearerAuth: []}
      parameters:
        - {name: date, in: path, required: true, description: "the day (Y-m-d, a real date)", schema: {$ref: "#/components/schemas/Date"}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The day
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: "#/components/schemas/LogDay"}
              example:
                success: true
                data: {date: "2026-09-14", categories: {bleeding: {flow: heavy, color: red}, pain: {location: {abdomen: {level: moderate, score: null}}}, mood: {moods: [sensitive]}}}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/ValidationFailed"}
    put:
      tags: [Log Taxonomy]
      summary: Save a day
      description: |
        Each param sent replaces the stored one (`null` clears it; a category sent as `null` clears all of it); params
        not sent are kept. Values per type: `single` → option code, `multi` → list of codes, `items` →
        `{item: {level, score?}}` or `{item: level}`, `number` / `integer` → number in the param's range, `text` →
        string, `text_items` → `{item: string}`, `bool` → boolean; `link` params are read-only. A new value must be
        available in the caller's mode (`GET /logs/taxonomy`); a value equal to the stored one always passes. Future
        days are refused. The legacy-representable values of the changed params are written back into
        `daily_health_logs` through the `/health-logs` save (period-start reconciliation included), so the engines
        keep reading them; v2-only values (pain score, pink blood, custom items…) live only here.
      operationId: putLogDay
      security:
        - {bearerAuth: []}
      parameters:
        - {name: date, in: path, required: true, description: "the day (Y-m-d, a real date)", schema: {$ref: "#/components/schemas/Date"}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categories]
              properties:
                categories: {$ref: "#/components/schemas/LogCategories"}
            example:
              categories:
                bleeding: {flow: medium, color: pink}
                pain: {location: {abdomen: {level: moderate, score: 6}}, relief: [heat]}
                mood: {moods: [calm]}
                measurements: {weight: 58.4}
                note: {text: "یادداشت"}
      responses:
        '200':
          description: Saved; the whole day
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: "#/components/schemas/LogDay"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/ValidationFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
    delete:
      tags: [Log Taxonomy]
      summary: Delete a day
      description: "Removes every v2 entry of the day and its `daily_health_logs` row. Idempotent."
      operationId: deleteLogDay
      security:
        - {bearerAuth: []}
      parameters:
        - {name: date, in: path, required: true, description: "the day (Y-m-d, a real date)", schema: {$ref: "#/components/schemas/Date"}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Deleted; the (empty) day
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: "#/components/schemas/LogDay"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/ValidationFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/logs/preferences:
    get:
      tags: [Log Taxonomy]
      summary: Log sheet preferences (order, visibility, quick tiles)
      description: |
        The caller's log sheet preferences for a life-stage mode (B-N3-02, nbl_Log_Customize): every category of the
        mode in her order with its label (request language), whether it is hidden or pinned and the param that takes
        her custom items (`custom_param`, null when none), the quick tiles (`pinned`, at most `max_pinned` = 8) and her
        active custom items. Without saved preferences (`is_default`) the order is the taxonomy order and the tiles
        follow the mode and, in `cycle` / `ttc` / `teen`, today's cycle phase (`phase`: menstrual, follicular,
        fertile, luteal, period_expected; null outside those modes or without cycle data). `customized` tells which
        of the three lists she saved; a list she did not save keeps following the default (tiles stay phase-aware).
        A tile key is a category code (`pain`: open the section) or `category.param` (`measurements.weight`,
        `pregnancy.kicks`: open that param). Tiles of hidden categories are not listed.
      operationId: getLogPreferences
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
        - {$ref: "#/components/parameters/LogPrefsMode"}
      responses:
        '200':
          description: The preferences in force
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LogPreferencesResponse"}
              example:
                success: true
                data:
                  mode: cycle
                  phase: luteal
                  is_default: true
                  customized: {order: false, hidden: false, pinned: false}
                  max_pinned: 8
                  pinned: [bleeding, pain, mood, symptoms, discharge, sleep, measurements.weight, note]
                  categories:
                    - {code: bleeding, label: پریود و لکه‌بینی, hidden: false, pinned: true, custom_param: null}
                    - {code: symptoms, label: علائم بدن, hidden: false, pinned: true, custom_param: general}
                  max_custom_items: 20
                  custom_items: []
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/ValidationFailed"}
    put:
      tags: [Log Taxonomy]
      summary: Save log sheet preferences
      description: |
        Each list sent replaces the saved one for the mode (`null` resets that list to the default); lists not sent
        are kept. `order` and `hidden` take category codes of the mode (categories missing from `order` follow in
        taxonomy order), `pinned` takes at most 8 tile keys of the mode, in order (`[]` = no quick tiles). No
        duplicates. Pinning a hidden category is allowed; its tile shows again once the category is unhidden.
        Returns the preferences as GET does.
      operationId: putLogPreferences
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
        - {$ref: "#/components/parameters/LogPrefsMode"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order: {type: [array, "null"], items: {type: string}}
                hidden: {type: [array, "null"], items: {type: string}}
                pinned: {type: [array, "null"], maxItems: 8, items: {type: string}}
            example: {order: [note, mood], hidden: [sex], pinned: [note, pain, measurements.bbt]}
      responses:
        '200':
          description: Saved; the preferences in force
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LogPreferencesResponse"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/ValidationFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
    delete:
      tags: [Log Taxonomy]
      summary: Reset log sheet preferences
      description: "Drops the saved preferences of the mode (custom items are kept). Returns the default preferences."
      operationId: deleteLogPreferences
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
        - {$ref: "#/components/parameters/LogPrefsMode"}
      responses:
        '200':
          description: Reset; the default preferences
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LogPreferencesResponse"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/ValidationFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/logs/custom-items:
    get:
      tags: [Log Taxonomy]
      summary: The caller's custom log items
      description: "Every custom item of the caller, deleted ones included (`deleted_at` set) so logged days keep their labels; oldest first."
      operationId: listLogCustomItems
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The custom items
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [max_custom_items, custom_items]
                    properties:
                      max_custom_items: {type: integer}
                      custom_items: {type: array, items: {$ref: "#/components/schemas/LogCustomItem"}}
        '401': {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [Log Taxonomy]
      summary: Add a custom log item
      description: |
        A user-defined item (e.g. «قهوه», a custom symptom) inside a category's custom param: `custom` → `items`,
        `symptoms` → `general`, `mood` → `moods`, `activity` → `types`, `appetite_energy` → `cravings`,
        `urogenital` → `symptoms`, `skin_hair` → `symptoms` (the `custom_param` of GET /logs/preferences). The label
        is trimmed and its whitespace collapsed (1–40 characters) and must be unique among the caller's active
        items of the category (case-insensitive); at most 20 active items. The returned `code` (`custom_<id>`) is
        the item code PUT /logs/days/{date} accepts in that param for this user only.
      operationId: createLogCustomItem
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, label]
              properties:
                category: {type: string, enum: [mood, symptoms, appetite_energy, activity, urogenital, skin_hair, custom]}
                label: {type: string, maxLength: 40}
            example: {category: custom, label: قهوه}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LogCustomItemResponse"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/ValidationFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/logs/custom-items/{id}:
    patch:
      tags: [Log Taxonomy]
      summary: Rename a custom log item
      description: "Changes the label of an active item of the caller (same label rules as POST); the code and logged days stay. 404 for another user's, a deleted or an unknown id."
      operationId: updateLogCustomItem
      security:
        - {bearerAuth: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: {type: string, maxLength: 40}
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LogCustomItemResponse"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404': {$ref: "#/components/responses/ModelNotFound"}
        '422': {$ref: "#/components/responses/ValidationFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
    delete:
      tags: [Log Taxonomy]
      summary: Delete a custom log item
      description: "Soft delete: logged days keep the item (and may still be re-saved with it), new input refuses it. Returns the item with `deleted_at`. 404 for another user's, an already deleted or an unknown id."
      operationId: deleteLogCustomItem
      security:
        - {bearerAuth: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LogCustomItemResponse"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404': {$ref: "#/components/responses/ModelNotFound"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/contraception:
    get:
      tags: [Contraception]
      summary: The contraception screen
      description: |
        `tracking` is the B-N2-01 «track contraception» switch (`user_life_profiles.track_contraception`, also on
        `GET|PUT /profile/life-stage`). `method` is null without a saved method; `pill` is the pack as of today (Tehran)
        for pill methods, else null; `reminders` are the care reminders the method created (rows in `reminders`, also
        listed by `/care/appointments` and `GET /reminders`), as the user left them. Missed-pill guidance is the catalog
        group `missed_pill_rules` (`GET /catalog/missed_pill_rules`). Health data: only the caller's own rows.
      operationId: getContraception
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The screen
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: "#/components/schemas/ContraceptionOverview"}
              example:
                success: true
                data:
                  tracking: true
                  method: {method: combined_pill, pack_type: "21_7", pack_started_on: "2026-09-16", packs_left: 1, reminder: {enabled: true, time: "21:00"}, inserted_on: null, iud_lifetime_years: null, followup_on: null, followup_done: false, iud_replace_on: null, injected_on: null, next_injection_on: null, replace_on: null}
                  pill:
                    pack_number: 1
                    pack_day: 8
                    pack_week: 2
                    pack_length: 28
                    active_days: 21
                    today: {date: "2026-09-23", kind: active, status: pending}
                    days: [{day: 1, date: "2026-09-16", kind: active, status: taken}]
                    streak_days: 7
                    missed_count: 0
                    next_pack_on: "2026-10-14"
                    packs_left: 1
                    runs_out_on: "2026-11-11"
                    refill_on: "2026-11-06"
                  reminders: [{kind: pill_refill, reminder_id: 12, type: custom, title: خرید بسته بعدی قرص, due_on: "2026-11-06", scheduled_at: "2026-11-06 09:00:00", recurrence: none, is_active: true}]
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/contraception/method:
    put:
      tags: [Contraception]
      summary: Save the contraception method
      description: |
        A full replace of the user's one method; fields that do not belong to the chosen method are ignored and stored
        empty. In one transaction it also switches «track contraception» on, sets the **one** pill reminder — the
        B-N1-09 `pill` notification category and time, the same schedule `/profile/cycle-settings` edits: on (unless
        `reminder_enabled: false`) for a pill method, its time changed only when `reminder_time` is sent; off for
        every other method — and syncs the method's care reminders: `pill_refill` (custom, 5 days before the counted
        packs run out), `iud_string_check` (custom, monthly from a month after insertion), `iud_followup` (appointment
        6 weeks after insertion, until `followup_done`), `iud_replacement` (appointment, insertion + lifetime),
        `injection_next` (appointment, last injection + 12 weeks), `implant_replacement` (appointment on `replace_on`).
        Kept reminders get their new date; the user's switch, notes and appointment details stay. `packs_left` is the
        number of unopened packs today (GET answers the current count, so sending it back keeps the stock).
      operationId: putContraceptionMethod
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: {$ref: "#/components/schemas/ContraceptionMethodCode"}
                pack_type: {type: [string, "null"], enum: ["21_7", "28", "24_4", null], description: "required for combined_pill"}
                pack_started_on: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Date"}], description: "first day of the current pack, not in the future; required for pill methods"}
                packs_left: {type: [integer, "null"], minimum: 0, maximum: 24}
                reminder_time: {type: [string, "null"], pattern: "^\\d{2}:\\d{2}$", description: "HH:MM, Tehran"}
                reminder_enabled: {type: boolean}
                inserted_on: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Date"}], description: "required for IUDs (optional for the implant), not in the future"}
                iud_lifetime_years: {type: [integer, "null"], minimum: 1, maximum: 12, description: "required for IUDs"}
                followup_done: {type: boolean, description: "IUD: the 6-week check-up visit is done"}
                injected_on: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Date"}], description: "last injection, required for injection, not in the future"}
                replace_on: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Date"}], description: "implant removal or replacement date"}
            example: {method: combined_pill, pack_type: "21_7", pack_started_on: "2026-09-16", packs_left: 1, reminder_time: "21:00"}
      responses:
        '200':
          description: Saved; the screen
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {$ref: "#/components/schemas/ContraceptionOverview"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/ContraceptionValidationFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
    delete:
      tags: [Contraception]
      summary: Stop tracking contraception
      description: "The method and its care reminders are deleted, «track contraception» and the pill reminder are switched off. The pill log stays. Idempotent."
      operationId: deleteContraceptionMethod
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Stopped; the screen
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {$ref: "#/components/schemas/ContraceptionOverview"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/contraception/pills:
    post:
      tags: [Contraception]
      summary: Log a pill day
      description: |
        `date` defaults to today and must not be in the future; `status` defaults to `taken`. One log per day (a second
        POST replaces it). 422 on `method` without a pill method, on `date` before the pack start or on a break day of
        a 21+7 pack. Responds with the screen.
      operationId: logContraceptionPill
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                date: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Date"}]}
                status: {type: [string, "null"], enum: [taken, missed, null]}
            example: {date: "2026-09-23", status: taken}
      responses:
        '200':
          description: Logged; the screen
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {$ref: "#/components/schemas/ContraceptionOverview"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/ContraceptionValidationFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/contraception/pills/{date}:
    delete:
      tags: [Contraception]
      summary: Remove a pill log (undo)
      description: "Any well-formed date; a day without a log is a no-op. Malformed → 422 on `date`. Responds with the screen."
      operationId: deleteContraceptionPill
      security:
        - {bearerAuth: []}
      parameters:
        - {name: date, in: path, required: true, schema: {$ref: "#/components/schemas/Date"}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Removed; the screen
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {$ref: "#/components/schemas/ContraceptionOverview"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/ContraceptionValidationFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/checkups:
    get:
      tags: [Checkups]
      summary: The screening plan
      description: |
        The user's periodic-checkup plan (docs/checkups/README.md): the shared catalog plus her custom checkups,
        evaluated by the status engine (`internal/checkups/engine`) for today (Tehran). `age` is null without a
        profile birthday. `summary` is always over the whole plan (disabled items excluded, `not_yet` counted as
        up to date); `?filter=action` lists due/overdue items, `done` recorded items that need no action.
        Labels follow `Accept-Language` (Jalali months and localized digits for fa). Three queries.
      operationId: getCheckups
      security:
        - {bearerAuth: []}
      parameters:
        - {name: filter, in: query, required: false, schema: {type: string, enum: [all, action, done]}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [age, summary, items]
                    properties:
                      age: {type: [integer, "null"]}
                      summary: {$ref: "#/components/schemas/CheckupSummary"}
                      items: {type: array, items: {$ref: "#/components/schemas/CheckupItem"}}
              example:
                success: true
                data:
                  age: 34
                  summary: {total: 6, up_to_date: 2, due: 3, overdue: 1}
                  items:
                    - {id: 5, key: dentist, title: دندان‌پزشکی, subtitle: null, category: six_monthly, section: overdue, status: overdue, icon: tooth, tone: teal, interval_label: هر ۶ ماه, timing_label: null, last_done_on: "2026-01-10", next_due_on: "2026-07-10", next_due_label: عقب‌افتاده از تیر, is_custom: false}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/CheckupValidationFailed"}
  /api/v1/checkups/home:
    get:
      tags: [Checkups]
      summary: The checkups card on the cycle home
      description: |
        The plan summary plus at most two due/overdue items (the monthly self-exam first, then cycle-timed, then
        overdue before due, then catalog order), in three queries (profile + pregnancy flag, cycle history, catalog joined with settings and the latest
        record per type). `data: null` when nothing applies (no enabled item) — the card hides.
      operationId: getCheckupsHome
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      responses:
        '200':
          description: The card
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    oneOf:
                      - {type: "null"}
                      - type: object
                        required: [summary, highlights]
                        properties:
                          summary: {$ref: "#/components/schemas/CheckupSummary"}
                          highlights: {type: array, maxItems: 2, items: {$ref: "#/components/schemas/CheckupItem"}}
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/checkups/preview-next:
    get:
      tags: [Checkups]
      summary: Preview the next due date (MarkDone banner)
      description: |
        When a checkup done on `done_on` is next due (`next_due_on`; `due_by` = the day before it turns overdue — the
        range maximum or the end of the cycle window). A monthly cycle-timed type lands on the window of the first
        predicted cycle after `done_on` (`cycle_timed: true`). The user's own override is not applied.
        `reminder_label` reflects the type's reminder switch.
      operationId: getCheckupsPreviewNext
      security:
        - {bearerAuth: []}
      parameters:
        - {name: type, in: query, required: true, schema: {type: integer}}
        - {name: done_on, in: query, required: true, schema: {$ref: "#/components/schemas/Date"}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The preview
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [next_due_on, due_by, next_due_label, interval_label, timing_label, reminder_label, cycle_timed]
                    properties:
                      next_due_on: {$ref: "#/components/schemas/Date"}
                      due_by: {$ref: "#/components/schemas/Date"}
                      next_due_label: {type: string}
                      interval_label: {type: string}
                      timing_label: {type: [string, "null"]}
                      reminder_label: {type: string}
                      cycle_timed: {type: boolean}
              example:
                success: true
                data: {next_due_on: "2029-09-20", due_by: "2029-09-20", next_due_label: ۳۰ شهریور ۱۴۰۸, interval_label: هر ۳ سال, timing_label: روز ۱۰ تا ۲۰ سیکل, reminder_label: ۳۰ روز قبل یادآوری می‌کنیم, cycle_timed: false}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404': {$ref: "#/components/responses/CheckupNotFound"}
        '422': {$ref: "#/components/responses/CheckupValidationFailed"}
  /api/v1/checkups/records:
    get:
      tags: [Checkups]
      summary: The checkup history
      description: |
        The user's records, newest first (`done_on`, then id), 20 per page. `filter=this_year` = since the first day of
        the current year in the request language's calendar (1 Farvardin for fa, 1 January otherwise);
        `with_attachment` = `has_attachment` records (the file itself is on the device only); `type` = one checkup.
      operationId: getCheckupRecords
      security:
        - {bearerAuth: []}
      parameters:
        - {name: filter, in: query, required: false, schema: {type: string, enum: [all, this_year, with_attachment]}}
        - {name: type, in: query, required: false, schema: {type: integer}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: One page of records
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [items, meta]
                    properties:
                      items:
                        type: array
                        items:
                          allOf:
                            - {$ref: "#/components/schemas/CheckupRecord"}
                            - type: object
                              required: [checkup_key, checkup_icon, checkup_tone]
                              properties:
                                checkup_key: {type: [string, "null"]}
                                checkup_icon: {type: [string, "null"]}
                                checkup_tone: {type: string}
                      meta:
                        type: object
                        required: [current_page, last_page, per_page, total]
                        properties:
                          current_page: {type: integer}
                          last_page: {type: integer}
                          per_page: {type: integer}
                          total: {type: integer}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/CheckupValidationFailed"}
  /api/v1/checkups/records/{recordId}:
    put:
      tags: [Checkups]
      summary: Update a checkup record
      description: |
        Partial update: only the keys sent change (`{"has_attachment": false}` is the attachment rollback); the merged
        record is validated like POST. Unknown keys are ignored. Responds with `{item, record}` (`item` null when the
        type is no longer in the plan).
      operationId: putCheckupRecord
      security:
        - {bearerAuth: []}
      parameters:
        - {name: recordId, in: path, required: true, schema: {type: integer}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CheckupRecordInput"}
            example: {has_attachment: false}
      responses:
        '200':
          description: Record updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CheckupRecordResult"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404': {$ref: "#/components/responses/CheckupNotFound"}
        '422': {$ref: "#/components/responses/CheckupValidationFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
    delete:
      tags: [Checkups]
      summary: Delete a checkup record
      operationId: deleteCheckupRecord
      security:
        - {bearerAuth: []}
      parameters:
        - {name: recordId, in: path, required: true, schema: {type: integer}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Record deleted
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {type: "null"}
              example: {success: true, message: سابقه چکاپ حذف شد, data: null}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404': {$ref: "#/components/responses/CheckupNotFound"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/checkups/custom:
    post:
      tags: [Checkups]
      summary: Add a custom checkup
      description: |
        The user's own checkup (`category = custom`, tone `neutral`, icon by `performed_by`, reminder lead 3 / 7 / 14
        days by interval). `title` and `note` (shown as the subtitle) are stored under the request language.
        `last_done_on` seeds a first record (result `normal`). Returns **201** with the item.

        **Cap:** at most 50 custom checkups per user; past that **422** `{success: false, message, errors: {limit:
        [message]}, error_code: limit_reached}` in the request language. **Throttle:** the shared per-user write budget,
        60 per minute (**429**).
      operationId: postCheckupCustom
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{$ref: "#/components/schemas/CustomCheckupInput"}]
              required: [title, interval_months, performed_by]
            example: {title: چشم‌پزشکی, interval_months: 24, performed_by: doctor, note: عینک, last_done_on: "2026-03-01"}
      responses:
        '201':
          description: Custom checkup created
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {$ref: "#/components/schemas/CheckupItem"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/CheckupValidationFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/checkups/custom/{id}:
    put:
      tags: [Checkups]
      summary: Update a custom checkup
      description: "Partial update of the user's own custom checkup (only the keys sent change); a new `last_done_on` adds a record. 404 for a catalog type or another user's checkup."
      operationId: putCheckupCustom
      security:
        - {bearerAuth: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CustomCheckupInput"}
            example: {interval_months: 12}
      responses:
        '200':
          description: Custom checkup updated
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/CheckupItem"}]}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404': {$ref: "#/components/responses/CheckupNotFound"}
        '422': {$ref: "#/components/responses/CheckupValidationFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
    delete:
      tags: [Checkups]
      summary: Delete a custom checkup
      description: "Deletes the user's custom checkup with its records and settings (cascade)."
      operationId: deleteCheckupCustom
      security:
        - {bearerAuth: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Custom checkup deleted
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {type: "null"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404': {$ref: "#/components/responses/CheckupNotFound"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/checkups/{id}:
    get:
      tags: [Checkups]
      summary: A checkup's detail
      description: |
        The item plus the catalog copy (localized `why`, `prep_steps`, `guide_steps`, `finding_options`), the latest two
        records and the user's switches. Any active type the user sees (a shared catalog row or her own custom
        checkup); a type the plan leaves out (hidden in pregnancy, past `age_max`) still opens. Admin edits show
        immediately (no cache).
      operationId: getCheckup
      security:
        - {bearerAuth: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The checkup
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: "#/components/schemas/CheckupDetail"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404': {$ref: "#/components/responses/CheckupNotFound"}
  /api/v1/checkups/{id}/records:
    post:
      tags: [Checkups]
      summary: Record a checkup as done
      description: |
        `done_on` must not be in the future (Tehran); `findings` ⊆ the type's `finding_options` keys (none for a type
        without options), de-duplicated; `next_due_on` (after `done_on`) overrides the computed next due date;
        `has_attachment` only flags that a report is stored **on the device** (the file never reaches the server).
        Unknown keys are ignored. Returns **201** with `{item, record}` — the recomputed item and the new record, whose
        id keys the on-device attachment.
      operationId: postCheckupRecord
      security:
        - {bearerAuth: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{$ref: "#/components/schemas/CheckupRecordInput"}]
              required: [done_on, result]
            example: {done_on: "2026-09-20", result: normal, findings: [none], note: null, has_attachment: false}
      responses:
        '201':
          description: Record created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CheckupRecordResult"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404': {$ref: "#/components/responses/CheckupNotFound"}
        '422': {$ref: "#/components/responses/CheckupValidationFailed"}
        '429': {$ref: "#/components/responses/WriteThrottled"}
  /api/v1/checkups/{id}/settings:
    put:
      tags: [Checkups]
      summary: Switch a checkup on/off and its reminder
      description: "Partial `{enabled?, remind?}` for a type the user sees (no row = both on). A disabled item stays listed with status `disabled` and leaves the summary. Returns the settings and the recomputed item."
      operationId: putCheckupSettings
      security:
        - {bearerAuth: []}
