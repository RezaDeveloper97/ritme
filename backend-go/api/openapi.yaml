                  data:
                    type: object
                    required: [locale, direction, messages]
                    properties:
                      locale: {type: string}
                      direction: {type: string}
                      messages:
                        type: object
                        additionalProperties:
                          type: object
                          additionalProperties:
                            anyOf:
                              - type: object
                                additionalProperties:
                                  anyOf:
                                    - type: object
                                      additionalProperties:
                                        anyOf:
                                          - type: object
                                            properties:
                                              good: {type: string}
                                              moderate: {type: string}
                                              poor: {type: string}
                                              feet: {type: string}
                                              hands: {type: string}
                                              face: {type: string}
                                              has_anxiety: {type: string}
                                              has_mood_swings: {type: string}
                                              has_depression_feelings: {type: string}
                                              not_felt_yet: {type: string}
                                              felt: {type: string}
                                              normal: {type: string}
                                              reduced: {type: string}
                                              increased: {type: string}
                                              none: {type: string}
                                          - {type: string}
                                    - type: array
                                      items:
                                        type: object
                                        required: [heading, body]
                                        properties: {heading: {type: string}, body: {type: string}}
                                    - {type: string}
                              - {type: string}
  /api/v1/messages/daily:
    get:
      tags: [Messages]
      summary: Get daily personalized messages
      description: |
        Automatically detects user's current mode (cycle/pregnancy) and returns personalized messages including base message, correlations, patterns (premium), and supplement tips (nutrition, sleep, exercise).

        Premium users with an override case that has no content get a 500 (D-11, kept as Laravel).
      operationId: getMessagesDaily
      security:
        - {bearerAuth: []}
      parameters:
        - name: date
          in: query
          description: Date for messages (YYYY-MM-DD). Defaults to today.
          required: false
          schema: {type: string, format: date, examples: ["2024-12-20"]}
        - name: mode
          in: query
          description: "Force specific mode (cycle, pregnancy). If not provided, auto-detects."
          required: false
          schema: {type: string, enum: [cycle, pregnancy]}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Messages retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required:
                      - mode
                      - date
                      - user_goal
                      - subscription_type
                      - context_info
                      - primary_message
                      - correlations
                      - patterns
                      - supplements
                      - tips
                    properties:
                      mode: {type: string}
                      date: {$ref: "#/components/schemas/Date"}
                      user_goal: {type: string}
                      subscription_type: {type: string}
                      context_info:
                        type: object
                        properties:
                          phase: {type: string}
                          phase_label: {type: string}
                          subphase: {type: string}
                          subphase_label: {type: string}
                          cycle_day: {type: integer}
                          cycle_length: {type: number}
                          is_fertile_window: {type: boolean}
                          is_pms_window: {type: boolean}
                          estimated_ovulation_day: {type: integer}
                          week: {type: integer}
                          day: {type: integer}
                          trimester: {type: number}
                          gestational_age: {type: string}
                          due_date: {$ref: "#/components/schemas/Date"}
                      primary_message:
                        type: object
                        required: [short_message, long_message, action_suggestion, dos, donts, has_override]
                        properties:
                          phase: {type: string}
                          phase_label: {type: string}
                          cycle_day: {type: integer}
                          short_message: {type: string}
                          long_message: {type: string}
                          action_suggestion: {type: string}
                          dos: {type: array, items: {type: string}}
                          donts: {type: array, items: {type: string}}
                          has_override: {type: boolean}
                          week: {type: integer}
                          day: {type: integer}
                          trimester: {type: number}
                          trimester_label: {type: string}
                          gestational_age: {type: string}
                          baby_development: {type: [string, "null"]}
                          body_changes: {type: [string, "null"]}
                          is_fertile_window: {type: boolean}
                          fertility_info: {type: [string, "null"]}
                          ttc_tips: {type: array, items: {type: string}}
                      correlations: {type: array}
                      patterns:
                        type: array
                        items:
                          type: object
                          required: [pattern_type, alert_level, message, recommendation]
                          properties:
                            pattern_type: {type: string}
                            alert_level: {type: string}
                            message: {type: string}
                            recommendation: {type: string}
                      supplements:
                        type: object
                        required: [nutrition, sleep, exercise]
                        properties:
                          nutrition:
                            type: object
                            required: [focus, foods, avoid, tip]
                            properties:
                              focus: {type: string}
                              foods: {type: array, items: {type: string}}
                              avoid: {type: array, items: {type: string}}
                              tip: {type: string}
                              essential: {type: array, items: {type: string}}
                              ttc_additions:
                                type: object
                                required: [essential, foods, avoid]
                                properties:
                                  essential: {type: array, items: {type: string}}
                                  foods: {type: array, items: {type: string}}
                                  avoid: {type: array, items: {type: string}}
                                  fertile_window_tip: {type: string}
                          sleep:
                            type: object
                            required: [recommended_hours, quality_focus, tips, avoid]
                            properties:
                              recommended_hours: {type: string}
                              quality_focus: {type: string}
                              tips: {type: array, items: {type: string}}
                              avoid: {type: array, items: {type: string}}
                              position: {type: string}
                          exercise:
                            type: object
                            required: [intensity, recommended, avoid, tip, duration]
                            properties:
                              intensity: {type: string}
                              recommended: {type: array, items: {type: string}}
                              avoid: {type: array, items: {type: string}}
                              tip: {type: string}
                              duration: {type: string}
                              precautions: {type: array, items: {type: string}}
                              ttc_note: {type: string}
                      tips: {type: array}
        '400':
          description: Profile not complete
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties: {success: {type: boolean}, message: {type: string}}
              example: {success: false, message: Please complete pregnancy onboarding first}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                required: [success, message, errors]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  errors:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
              example:
                success: false
                message: Invalid query parameters
                errors: {date: [The date field must match the format Y-m-d.]}
        '500': {$ref: "#/components/responses/ServerError"}
