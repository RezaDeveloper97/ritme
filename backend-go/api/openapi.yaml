        form: {type: string, enum: [tablet, capsule, syrup, injection, drops]}
        dose: {type: [string, "null"]}
        unit: {type: [string, "null"]}
        times: {type: array, items: {type: string}, description: "Sorted `HH:MM` slots."}
        weekdays: {type: array, items: {type: integer, minimum: 0, maximum: 6}, description: "Saturday = 0."}
