        title: {type: string, maxLength: 255, examples: [فولیک اسید]}
        dose: {type: [string, number, "null"], description: "Free text (≤ 50); a number is stored as its string.", examples: ["400"]}
        unit: {type: [string, number, "null"], description: "One of `mg|mcg|ml|iu|drop` (labelled) or free text (≤ 50).", examples: [mcg]}
        form: {type: string, enum: [tablet, capsule, syrup, injection, drops]}
        times: {type: array, minItems: 1, maxItems: 4, items: {type: string, pattern: "^\\d{2}:\\d{2}$"}, examples: [["08:00", "20:00"]]}
