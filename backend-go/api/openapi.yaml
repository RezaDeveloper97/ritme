        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404': {$ref: "#/components/responses/CheckupNotFound"}
        '422': {$ref: "#/components/responses/CheckupValidationFailed"}
  /api/v1/cycle/date/{date}:
    get:
      tags: [Cycle]
      summary: Get cycle calculation for specific date
      description: Retrieve calculated cycle data for a specific date
      operationId: getCycleDateByDate
      security:
        - {bearerAuth: []}
      parameters:
        - name: date
          in: path
          description: Date (YYYY-MM-DD)
          required: true
