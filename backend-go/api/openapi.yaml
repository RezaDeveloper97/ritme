              - mid_follicular
              - fertile_rising
              - high_fertility
              - ovulation_likely
              - post_ovulation
              - early_luteal
              - mid_luteal
              - late_luteal
              - pms_possible
              - period_expected
        - {$ref: "#/components/parameters/LocaleQuery"}
