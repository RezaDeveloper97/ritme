      tags: [Reminders]
      summary: Get reminder enums
      description: |
        Available reminder types and recurrence options for building the reminder form.

        A language without recurrence labels gets the English labels (D-01, approved
        2026-09-23). The Laravel stack still answers 500 for such a language until cutover.
      operationId: getRemindersEnums
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      responses:
        '200':
          description: Enums retrieved
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [types, recurrences]
                    properties:
                      types:
                        type: array
                        items:
                          type: object
                          required: [value, label, icon]
                          properties: {value: {type: string}, label: {type: string}, icon: {type: string}}
                      recurrences:
                        type: array
                        items:
                          type: object
                          required: [value, label]
                          properties: {value: {type: string}, label: {type: string}}
              example:
                success: true
                data:
                  types:
                    - {value: doctor, label: Doctor reminder, icon: stethoscope}
                    - {value: medication, label: Medication reminder, icon: pill}
                    - {value: appointment, label: Appointment reminder, icon: calendar-clock}
                    - {value: custom, label: Reminder, icon: bell}
                  recurrences:
                    - {value: none, label: One-off}
                    - {value: daily, label: Daily}
                    - {value: weekly, label: Weekly}
                    - {value: monthly, label: Monthly}
