        '404': {$ref: "#/components/responses/CareNotFound"}
    put:
      tags: [Care]
      summary: Update a medication reminder
      description: "Partial update: only the keys sent change. A body with only `is_active` and/or `notify` (the list switches) updates just those, without re-validating the rest, so legacy `/reminders` medications (no `starts_on` / times) can be toggled too. Any other body is merged over the stored medication (a missing `starts_on` defaults to the row's creation day) and validated as a whole, and the legacy columns are re-derived."
      operationId: putCareMedicationsById
      security:
        - {bearerAuth: []}
