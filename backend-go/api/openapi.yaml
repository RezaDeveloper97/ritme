                                systolic_pressure: {type: number}
                                diastolic_pressure: {type: number}
                                fasting_blood_sugar: {$ref: "#/components/schemas/DecimalString"}
                                post_meal_blood_sugar: {$ref: "#/components/schemas/DecimalString"}
                                overall_mood: {type: string}
                                has_anxiety: {type: boolean}
                                anxiety_severity: {type: [string, "null"]}
                                has_mood_swings: {type: [boolean, "null"]}
                                mood_swings_severity: {type: [integer, "null"]}
                                has_depression_feelings: {type: [boolean, "null"]}
                                depression_severity: {type: [integer, "null"]}
                                notes: {type: [string, "null"]}
                                created_at: {$ref: "#/components/schemas/LaravelDateTime"}
                                updated_at: {$ref: "#/components/schemas/LaravelDateTime"}
                          fetal_movements: {type: array, items: {$ref: "#/components/schemas/FetalMovement"}}
                      reminders: {type: array, items: {$ref: "#/components/schemas/Reminder"}}
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/reminders:
    get:
      tags: [Reminders]
      summary: List reminders
      description: "All of the authenticated user's reminders, newest first. Optionally filter by type."
      operationId: getReminders
      security:
        - {bearerAuth: []}
      parameters:
        - name: type
          in: query
          required: false
          schema: {type: string, enum: [doctor, medication, appointment, custom]}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Reminders retrieved
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {type: array, items: {$ref: "#/components/schemas/Reminder"}}
        '401': {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [Reminders]
      summary: Create a reminder
      description: "Returns **201**. `recurrence_time` echoes `\"16:00\"` here but reads back as `\"16:00:00\"`."
      operationId: postReminders
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [type, title]
              properties:
                type: {type: string, enum: [doctor, medication, appointment, custom]}
                title: {type: string, examples: ["ویتامین D"]}
                subtitle: {type: [string, "null"], examples: ["یک عدد بعد از ناهار"]}
                notes: {type: [string, "null"]}
                scheduled_at: {type: [string, "null"], format: date-time}
                recurrence: {type: string, default: none, enum: [none, daily, weekly, monthly]}
                recurrence_time: {type: [string, "null"], examples: ["16:00"]}
                starts_on: {type: [string, "null"], format: date}
                ends_on: {type: [string, "null"], format: date}
              type: object
      responses:
        '201':
          description: Reminder created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [type, title, is_active, user_id, updated_at, created_at, id]
                    properties:
                      type: {type: string}
                      title: {type: string}
                      recurrence: {type: string}
                      recurrence_time: {type: string}
                      starts_on: {$ref: "#/components/schemas/LaravelDateTime"}
                      is_active: {type: boolean}
                      user_id: {type: integer}
                      updated_at: {$ref: "#/components/schemas/LaravelDateTime"}
                      created_at: {$ref: "#/components/schemas/LaravelDateTime"}
                      id: {type: integer}
                      subtitle: {type: [string, "null"]}
                      notes: {type: [string, "null"]}
                      ends_on:
                        anyOf: [{$ref: "#/components/schemas/LaravelDateTime"}, {type: "null"}]
                      scheduled_at: {$ref: "#/components/schemas/LaravelDateTime"}
              example:
                success: true
                data:
                  type: appointment
                  title: "سونوگرافی"
                  recurrence: weekly
                  recurrence_time: "08:15"
                  starts_on: "2026-09-23T20:30:00.000000Z"
                  is_active: false
                  user_id: 1018
                  updated_at: "2026-09-23T06:30:00.000000Z"
                  created_at: "2026-09-23T06:30:00.000000Z"
                  id: 101805
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                required: [success, message, errors]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  errors:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
              example:
                success: false
                message: Validation failed
                errors:
                  type: [The selected type is invalid.]
                  recurrence: [The selected recurrence is invalid.]
  /api/v1/reminders/enums:
    get:
      tags: [Reminders]
      summary: Get reminder enums
      description: |
        Available reminder types and recurrence options for building the reminder form.

        A language without recurrence labels gets the English labels (D-01, approved
        2026-09-23). The Laravel stack still answers 500 for such a language until cutover.
      operationId: getRemindersEnums
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      responses:
        '200':
          description: Enums retrieved
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [types, recurrences]
                    properties:
                      types:
                        type: array
                        items:
                          type: object
                          required: [value, label, icon]
                          properties: {value: {type: string}, label: {type: string}, icon: {type: string}}
                      recurrences:
                        type: array
                        items:
                          type: object
                          required: [value, label]
                          properties: {value: {type: string}, label: {type: string}}
              example:
                success: true
                data:
                  types:
                    - {value: doctor, label: Doctor reminder, icon: stethoscope}
                    - {value: medication, label: Medication reminder, icon: pill}
                    - {value: appointment, label: Appointment reminder, icon: calendar-clock}
                    - {value: custom, label: Reminder, icon: bell}
                  recurrences:
                    - {value: none, label: One-off}
                    - {value: daily, label: Daily}
                    - {value: weekly, label: Weekly}
                    - {value: monthly, label: Monthly}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '500':
          description: "Laravel stack only, for a language without recurrence labels (D-01); the Go API answers 200 with English labels."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrameworkError"}
              example: {message: Server Error}
  /api/v1/reminders/{id}:
    put:
      tags: [Reminders]
      summary: Update a reminder
      description: |
        Update any subset of the reminder's fields, including toggling is_active.

        A non-numeric `{id}` answers the framework 404 `{message: ""}` (D-02, approved 2026-09-23).
      operationId: putRemindersById
      security:
        - {bearerAuth: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                type: {type: string, enum: [doctor, medication, appointment, custom]}
                title: {type: string}
                subtitle: {type: [string, "null"]}
                notes: {type: [string, "null"]}
                scheduled_at: {type: [string, "null"], format: date-time}
                recurrence: {type: string, enum: [none, daily, weekly, monthly]}
                recurrence_time: {type: [string, "null"]}
                starts_on: {type: [string, "null"], format: date}
                ends_on: {type: [string, "null"], format: date}
                is_active: {type: boolean}
              type: object
      responses:
        '200':
          description: Reminder updated
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required:
                      - id
                      - user_id
                      - type
                      - title
                      - subtitle
                      - notes
                      - scheduled_at
                      - recurrence
                      - recurrence_time
                      - starts_on
                      - ends_on
                      - is_active
                      - meta
                      - created_at
                      - updated_at
                    properties:
                      id: {type: integer}
                      user_id: {type: integer}
                      type: {type: string}
                      title: {type: string}
                      subtitle: {type: string}
                      notes: {type: [string, "null"]}
                      scheduled_at:
                        anyOf:
                          - {$ref: "#/components/schemas/LaravelDateTime"}
                          - {$ref: "#/components/schemas/IsoDateTime"}
                          - {type: "null"}
                      recurrence: {type: string}
                      recurrence_time: {type: [string, "null"]}
                      starts_on:
                        anyOf: [{$ref: "#/components/schemas/LaravelDateTime"}, {type: "null"}]
                      ends_on:
                        anyOf: [{$ref: "#/components/schemas/LaravelDateTime"}, {type: "null"}]
                      is_active: {type: boolean}
                      meta:
                        type: [object, "null"]
                        required: [phone]
                        properties: {phone: {type: string}}
                      created_at: {$ref: "#/components/schemas/LaravelDateTime"}
                      updated_at: {$ref: "#/components/schemas/LaravelDateTime"}
              example:
                success: true
                data:
                  id: 101801
                  user_id: 1018
                  type: appointment
                  title: "دکتر رضایی"
                  subtitle: "زنان و زایمان"
                  notes: null
                  scheduled_at: null
                  recurrence: none
                  recurrence_time: null
                  starts_on: null
                  ends_on: null
                  is_active: false
                  meta: {phone: "02100000000"}
                  created_at: "2026-09-23T05:30:00.000000Z"
                  updated_at: "2026-09-23T06:30:00.000000Z"
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404':
          description: "Reminder not found (`{success: false, message}`), or a non-numeric `{id}` (framework 404 `{message: \"\"}`, D-02)"
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required: [success, message]
                    properties: {success: {type: boolean}, message: {type: string}}
                  - {$ref: "#/components/schemas/FrameworkError"}
              example: {success: false, message: Reminder not found}
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                required: [success, message, errors]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  errors:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
              example:
                success: false
                message: Validation failed
                errors:
                  type: [The selected type is invalid.]
                  recurrence: [The selected recurrence is invalid.]
                  ends_on: [The ends on field must be a date after or equal to starts on.]
        '500':
          description: "Laravel stack only, for a non-numeric `{id}` (D-02); the Go API answers the framework 404."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrameworkError"}
              example: {message: Server Error}
    delete:
      tags: [Reminders]
      summary: Delete a reminder
      description: "A non-numeric `{id}` answers the framework 404 `{message: \"\"}` (D-02, approved 2026-09-23)."
      operationId: deleteRemindersById
      security:
        - {bearerAuth: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Reminder deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties: {success: {type: boolean}}
              example: {success: true}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404':
          description: "Reminder not found (`{success: false, message}`), or a non-numeric `{id}` (framework 404 `{message: \"\"}`, D-02)"
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required: [success, message]
                    properties: {success: {type: boolean}, message: {type: string}}
                  - {$ref: "#/components/schemas/FrameworkError"}
              example: {success: false, message: Reminder not found}
        '500':
          description: "Laravel stack only, for a non-numeric `{id}` (D-02); the Go API answers the framework 404."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrameworkError"}
              example: {message: Server Error}
  /storage/{path}:
    get:
      tags: [System]
      summary: Public upload disk
      description: "Files of the Laravel `public` disk (banner and article images), formerly served by Apache through the `storage:link` symlink. Supports `ETag`/`Last-Modified` and a single `Range`. Encoded separators, `..`, dot-files, directories and missing files answer the framework JSON 404 (D-13)."
      operationId: getStorageFile
      security: []
      parameters:
        - name: path
          in: path
          required: true
          description: "Path below `storage/app/public`, e.g. `banners/abc.webp`."
          schema: {type: string}
      responses:
        '200':
          description: The file
          content:
            application/octet-stream: {schema: {type: string, contentMediaType: application/octet-stream}}
        '206':
          description: Partial content (single range)
          content:
            application/octet-stream: {schema: {type: string, contentMediaType: application/octet-stream}}
        '304': {description: Not modified}
        '404': {$ref: "#/components/responses/RouteNotFound"}
  /up:
    get:
      tags: [System]
      summary: Liveness probe
      description: "Answers without touching MariaDB or Redis so a database hiccup never restarts the container. Go returns the plain text `OK`; Laravel returned an HTML page (D-10)."
      operationId: getUp
      security: []
      responses:
        '200':
          description: Alive
          content:
            text/plain: {schema: {type: string, const: OK}}
  /api/v1/pregnancy/v2/setup-copy:
    get:
      tags: [PregnancyV2]
      summary: Admin-edited copy of the pregnancy Setup screens
      description: |
        The `message_contents` group `pregnancy_setup` (welcome, dating, the three dating sources, history,
        result) in the request locale: per item the request-locale row, else the default language's row. Every
        item is always present; a text is null (a list `[]`) when no live row has it, so the app falls back to its
        bundled copy. The `result` texts are the raw templates (`{confidence}`, `{range_from}`, `{range_to}`,
        `{date}` unfilled; `dating-preview` returns them filled). No pregnancy needed (Setup runs before
        activation). One query. Go only (T-M7-20).
      operationId: getPregnancyV2SetupCopy
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      responses:
        '200':
          description: The Setup copy
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [welcome, dating, source_lmp, source_ultrasound, source_manual, history, result]
                    properties:
                      welcome:
                        type: object
                        required: [title, body, primary, secondary, benefits]
                        properties:
                          title: {type: [string, "null"]}
                          body: {type: [string, "null"]}
                          primary: {type: [string, "null"]}
                          secondary: {type: [string, "null"]}
                          benefits: {type: array, items: {type: string}}
                      dating:
                        type: object
                        required: [title, body]
                        properties:
                          title: {type: [string, "null"]}
                          body: {type: [string, "null"]}
                      source_lmp:
                        type: object
                        required: [label, hint]
                        properties:
                          label: {type: [string, "null"]}
                          hint: {type: [string, "null"]}
                      source_ultrasound:
                        type: object
                        required: [label, hint]
                        properties:
                          label: {type: [string, "null"]}
                          hint: {type: [string, "null"]}
                      source_manual:
                        type: object
                        required: [label, hint]
                        properties:
                          label: {type: [string, "null"]}
                          hint: {type: [string, "null"]}
                      history:
                        type: object
                        required: [title, body, disclaimer, skip]
                        properties:
                          title: {type: [string, "null"]}
                          body: {type: [string, "null"]}
                          disclaimer: {type: [string, "null"]}
                          skip: {type: [string, "null"]}
                      result:
                        type: object
                        required: [lead, suffix, due_label, confidence, range, basis_lmp, basis_ultrasound, basis_manual, primary, secondary]
                        properties:
                          lead: {type: [string, "null"]}
                          suffix: {type: [string, "null"]}
                          due_label: {type: [string, "null"]}
                          confidence: {type: [string, "null"]}
                          range: {type: [string, "null"]}
                          basis_lmp: {type: [string, "null"]}
                          basis_ultrasound: {type: [string, "null"]}
                          basis_manual: {type: [string, "null"]}
                          primary: {type: [string, "null"]}
                          secondary: {type: [string, "null"]}
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/pregnancy/v2/dating-preview:
    post:
      tags: [PregnancyV2]
      summary: Preview the gestational age and due date of a dating source (no write)
      description: |
        Setup step 3/3. `manual` dates from today. Usual birth range = due date ± (14 + uncertainty) days.
        `basis` / `range_label` are the `pregnancy_setup/result` templates (message_contents) with dates in the
        locale's calendar. More than 42w6d → 422 on the dating field.
      operationId: postPregnancyV2DatingPreview
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: {type: string, enum: [lmp, ultrasound, manual]}
                lmp_date: {$ref: "#/components/schemas/Date"}
                ultrasound_date: {$ref: "#/components/schemas/Date"}
                ultrasound_weeks: {type: integer, minimum: 0, maximum: 42}
                ultrasound_days: {type: integer, minimum: 0, maximum: 6}
                manual_weeks: {type: integer, minimum: 0, maximum: 42}
                manual_days: {type: integer, minimum: 0, maximum: 6}
      responses:
        '200':
          description: The preview
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: "#/components/schemas/PregnancyV2DatingPreview"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/PregnancyV2ValidationFailed"}
  /api/v1/pregnancy/v2/today:
    get:
      tags: [PregnancyV2]
      summary: Pregnancy Today screen
      description: |
        Week carousel (prev / current / next), due card, 40-week progress with trimester start dates, next visit
        (next upcoming non-cancelled M3 appointment, whatever its reminder switch, else the next active care-plan item), week tip (`pregnancy_week_tip/{week}`),
        this week's tasks with done state and the unread alert count — in ≤ 5 queries. Week counts to 42 when overdue.
        A GET first runs the daily alert evaluation (deduplicated per window, idempotent), so `unread_alerts` already
        counts the calendar alerts (`week_entered`, `weight_missing_week`) before the Alerts screen is opened; HEAD
        is read-only (T-M7-20).
      operationId: getPregnancyV2Today
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      responses:
        '200':
          description: Today
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [date, weeks, days, week, trimester, confidence, carousel, due, progress, next_visit, tip, tasks, unread_alerts]
                    properties:
                      date: {$ref: "#/components/schemas/Date"}
                      date_label: {type: string}
                      source: {type: string, enum: [lmp, ultrasound, manual]}
                      weeks: {type: integer}
                      days: {type: integer}
                      week: {type: integer, minimum: 1, maximum: 42}
                      trimester: {type: integer, enum: [1, 2, 3]}
                      confidence: {$ref: "#/components/schemas/PregnancyV2Confidence"}
                      uncertainty_days: {type: integer}
                      carousel:
                        type: array
                        items:
                          type: object
                          required: [week, trimester, title, relation]
                          properties:
                            week: {type: integer}
                            trimester: {type: integer}
                            title: {type: string, description: "The age: «۸ هفته و ۳ روز» on the current week, the completed weeks at the start of the week («۷ هفته») on the others"}
                            headline: {type: [string, "null"]}
                            size_line: {type: [string, "null"]}
                            illustration_key: {type: [string, "null"]}
                            relation: {type: string, enum: [past, current, future]}
                      due:
                        type: object
                        required: [date, date_label, days_left, overdue_days, range, range_label]
                        properties:
                          date: {$ref: "#/components/schemas/Date"}
                          date_label: {type: string}
                          days_left: {type: integer}
                          overdue_days: {type: integer}
                          range: {$ref: "#/components/schemas/PregnancyV2Range"}
                          range_label: {type: string}
                      progress:
                        type: object
                        required: [week, percent, trimesters]
                        properties:
                          week: {type: integer}
                          percent: {type: integer, minimum: 0, maximum: 100}
                          trimesters:
                            type: array
                            items:
                              type: object
                              required: [trimester, start_date, start_label, percent]
                              properties:
                                trimester: {type: integer}
                                start_date: {$ref: "#/components/schemas/Date"}
                                start_label: {type: string}
                                percent: {type: integer, description: position of the start on the 40-week bar}
                      next_visit:
                        oneOf:
                          - {type: "null"}
                          - type: object
                            required: [appointment_id, care_item_key, title, date, date_label, time, week, days_until, stage]
                            properties:
                              appointment_id: {type: [integer, "null"]}
                              care_item_key: {type: [string, "null"]}
                              title: {type: string}
                              date: {$ref: "#/components/schemas/Date"}
                              date_label: {type: string}
                              time: {type: [string, "null"], example: "09:30"}
                              week: {type: integer}
                              week_from: {type: integer}
                              week_to: {type: integer}
                              days_until: {type: integer}
                              stage: {type: [string, "null"], enum: [booked, done, result, null]}
                      tip: {$ref: "#/components/schemas/PregnancyV2Tip"}
                      tasks: {type: array, items: {$ref: "#/components/schemas/PregnancyV2Task"}}
                      unread_alerts: {type: integer}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '409': {$ref: "#/components/responses/PregnancyNotActive"}
  /api/v1/pregnancy/v2/weeks/{n}:
    get:
      tags: [PregnancyV2]
      summary: One week of the week-by-week page
      description: Admin-defined details (pregnancy_week_details) in the request language, date range, bookmark, tasks with done state and the week tip.
      operationId: getPregnancyV2Week
      security:
        - {bearerAuth: []}
