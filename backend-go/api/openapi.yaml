    post:
      tags: [Care]
      summary: Create an appointment
      description: |
        Returns **201** with the appointment. Stored as a `reminders` row (`type = appointment`, `recurrence = none`)
        with `scheduled_at` (Tehran wall-clock), so `GET /reminders` readers see it; `subtitle` = "with · specialty".
        `title` falls back to the topic label in the request language. Defaults: `remind_before` 1d,
        `add_to_calendar` false, `is_active` true, `prep` []. Prep items get server ids (`p1`, `p2`, …); client ids are
