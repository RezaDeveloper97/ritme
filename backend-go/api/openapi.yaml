      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [age, summary, items]
                    properties:
                      age: {type: [integer, "null"]}
                      summary: {$ref: "#/components/schemas/CheckupSummary"}
                      items: {type: array, items: {$ref: "#/components/schemas/CheckupItem"}}
              example:
                success: true
                data:
                  age: 34
                  summary: {total: 6, up_to_date: 2, due: 3, overdue: 1}
                  items:
                    - {id: 5, key: dentist, title: دندان‌پزشکی, subtitle: null, category: six_monthly, section: overdue, status: overdue, icon: tooth, tone: teal, interval_label: هر ۶ ماه, timing_label: null, last_done_on: "2026-01-10", next_due_on: "2026-07-10", next_due_label: عقب‌افتاده از تیر, is_custom: false}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/CheckupValidationFailed"}
  /api/v1/checkups/home:
    get:
      tags: [Checkups]
      summary: The checkups card on the cycle home
      description: |
        The plan summary plus at most two due/overdue items (the monthly self-exam first, then cycle-timed, then
        overdue before due, then catalog order), in three queries (profile + pregnancy flag, cycle history, catalog joined with settings and the latest
        record per type). `data: null` when nothing applies (no enabled item) — the card hides.
