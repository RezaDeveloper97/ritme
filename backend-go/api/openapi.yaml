              schema: {$ref: "#/components/schemas/FrameworkError"}
              example: {message: Server Error}
  /api/v1/reminders/{id}:
    put:
      tags: [Reminders]
      summary: Update a reminder
      description: |
        Update any subset of the reminder's fields, including toggling is_active.

        A non-numeric `{id}` answers the framework 404 `{message: ""}` (D-02, approved 2026-09-23).
        Turning `is_active` on for a cancelled care appointment (`type` appointment, `meta.status` cancelled) is a 422
        on `is_active` (D-29).
      operationId: putRemindersById
      security:
        - {bearerAuth: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                type: {type: string, enum: [doctor, medication, appointment, custom]}
                title: {type: string}
                subtitle: {type: [string, "null"]}
                notes: {type: [string, "null"]}
                scheduled_at: {type: [string, "null"], format: date-time}
                recurrence: {type: string, enum: [none, daily, weekly, monthly]}
                recurrence_time: {type: [string, "null"]}
                starts_on: {type: [string, "null"], format: date}
                ends_on: {type: [string, "null"], format: date}
                is_active: {type: boolean}
              type: object
      responses:
        '200':
          description: Reminder updated
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required:
                      - id
                      - user_id
                      - type
                      - title
                      - subtitle
                      - notes
                      - scheduled_at
                      - recurrence
                      - recurrence_time
                      - starts_on
                      - ends_on
                      - is_active
                      - meta
                      - created_at
                      - updated_at
                    properties:
                      id: {type: integer}
                      user_id: {type: integer}
                      type: {type: string}
                      title: {type: string}
                      subtitle: {type: string}
                      notes: {type: [string, "null"]}
                      scheduled_at:
                        anyOf:
                          - {$ref: "#/components/schemas/LaravelDateTime"}
                          - {$ref: "#/components/schemas/IsoDateTime"}
                          - {type: "null"}
                      recurrence: {type: string}
                      recurrence_time: {type: [string, "null"]}
                      starts_on:
                        anyOf: [{$ref: "#/components/schemas/LaravelDateTime"}, {type: "null"}]
                      ends_on:
                        anyOf: [{$ref: "#/components/schemas/LaravelDateTime"}, {type: "null"}]
                      is_active: {type: boolean}
                      meta:
                        type: [object, "null"]
                        required: [phone]
                        properties: {phone: {type: string}}
                      created_at: {$ref: "#/components/schemas/LaravelDateTime"}
                      updated_at: {$ref: "#/components/schemas/LaravelDateTime"}
              example:
                success: true
                data:
                  id: 101801
                  user_id: 1018
                  type: appointment
                  title: "دکتر رضایی"
                  subtitle: "زنان و زایمان"
                  notes: null
                  scheduled_at: null
                  recurrence: none
                  recurrence_time: null
                  starts_on: null
                  ends_on: null
                  is_active: false
                  meta: {phone: "02100000000"}
                  created_at: "2026-09-23T05:30:00.000000Z"
                  updated_at: "2026-09-23T06:30:00.000000Z"
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404':
          description: "Reminder not found (`{success: false, message}`), or a non-numeric `{id}` (framework 404 `{message: \"\"}`, D-02)"
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required: [success, message]
                    properties: {success: {type: boolean}, message: {type: string}}
                  - {$ref: "#/components/schemas/FrameworkError"}
              example: {success: false, message: Reminder not found}
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                required: [success, message, errors]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  errors:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
              example:
                success: false
                message: Validation failed
                errors:
                  type: [The selected type is invalid.]
                  recurrence: [The selected recurrence is invalid.]
                  ends_on: [The ends on field must be a date after or equal to starts on.]
        '500':
          description: "Laravel stack only, for a non-numeric `{id}` (D-02); the Go API answers the framework 404."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrameworkError"}
              example: {message: Server Error}
    delete:
      tags: [Reminders]
      summary: Delete a reminder
      description: "A non-numeric `{id}` answers the framework 404 `{message: \"\"}` (D-02, approved 2026-09-23)."
      operationId: deleteRemindersById
      security:
        - {bearerAuth: []}
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Reminder deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties: {success: {type: boolean}}
              example: {success: true}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404':
          description: "Reminder not found (`{success: false, message}`), or a non-numeric `{id}` (framework 404 `{message: \"\"}`, D-02)"
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required: [success, message]
                    properties: {success: {type: boolean}, message: {type: string}}
                  - {$ref: "#/components/schemas/FrameworkError"}
              example: {success: false, message: Reminder not found}
        '500':
          description: "Laravel stack only, for a non-numeric `{id}` (D-02); the Go API answers the framework 404."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FrameworkError"}
              example: {message: Server Error}
  /storage/{path}:
    get:
      tags: [System]
      summary: Public upload disk
      description: "Files of the Laravel `public` disk (banner and article images), formerly served by Apache through the `storage:link` symlink. Supports `ETag`/`Last-Modified` and a single `Range`. Encoded separators, `..`, dot-files, directories and missing files answer the framework JSON 404 (D-13)."
      operationId: getStorageFile
      security: []
      parameters:
        - name: path
          in: path
          required: true
          description: "Path below `storage/app/public`, e.g. `banners/abc.webp`."
          schema: {type: string}
      responses:
        '200':
          description: The file
          content:
            application/octet-stream: {schema: {type: string, contentMediaType: application/octet-stream}}
        '206':
          description: Partial content (single range)
          content:
            application/octet-stream: {schema: {type: string, contentMediaType: application/octet-stream}}
        '304': {description: Not modified}
        '404': {$ref: "#/components/responses/RouteNotFound"}
  /up:
    get:
      tags: [System]
      summary: Liveness probe
      description: "Answers without touching MariaDB or Redis so a database hiccup never restarts the container. Go returns the plain text `OK`; Laravel returned an HTML page (D-10)."
      operationId: getUp
      security: []
      responses:
        '200':
          description: Alive
          content:
            text/plain: {schema: {type: string, const: OK}}
  /api/v1/pregnancy/v2/setup-copy:
    get:
      tags: [PregnancyV2]
      summary: Admin-edited copy of the pregnancy Setup screens
      description: |
        The `message_contents` group `pregnancy_setup` (welcome, dating, the three dating sources, history,
        result) in the request locale: per item the request-locale row, else the default language's row. Every
        item is always present; a text is null (a list `[]`) when no live row has it, so the app falls back to its
        bundled copy. The `result` texts are the raw templates (`{confidence}`, `{range_from}`, `{range_to}`,
        `{date}` unfilled; `dating-preview` returns them filled). No pregnancy needed (Setup runs before
        activation). One query. Go only (T-M7-20).
      operationId: getPregnancyV2SetupCopy
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      responses:
        '200':
          description: The Setup copy
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [welcome, dating, source_lmp, source_ultrasound, source_manual, history, result]
                    properties:
                      welcome:
                        type: object
                        required: [title, body, primary, secondary, benefits]
                        properties:
                          title: {type: [string, "null"]}
                          body: {type: [string, "null"]}
                          primary: {type: [string, "null"]}
                          secondary: {type: [string, "null"]}
                          benefits: {type: array, items: {type: string}}
                      dating:
                        type: object
                        required: [title, body]
                        properties:
                          title: {type: [string, "null"]}
                          body: {type: [string, "null"]}
                      source_lmp:
                        type: object
                        required: [label, hint]
                        properties:
                          label: {type: [string, "null"]}
                          hint: {type: [string, "null"]}
                      source_ultrasound:
                        type: object
                        required: [label, hint]
                        properties:
                          label: {type: [string, "null"]}
                          hint: {type: [string, "null"]}
                      source_manual:
                        type: object
                        required: [label, hint]
                        properties:
                          label: {type: [string, "null"]}
                          hint: {type: [string, "null"]}
                      history:
                        type: object
                        required: [title, body, disclaimer, skip]
                        properties:
                          title: {type: [string, "null"]}
                          body: {type: [string, "null"]}
                          disclaimer: {type: [string, "null"]}
                          skip: {type: [string, "null"]}
                      result:
                        type: object
                        required: [lead, suffix, due_label, confidence, range, basis_lmp, basis_ultrasound, basis_manual, primary, secondary]
                        properties:
                          lead: {type: [string, "null"]}
                          suffix: {type: [string, "null"]}
                          due_label: {type: [string, "null"]}
                          confidence: {type: [string, "null"]}
                          range: {type: [string, "null"]}
                          basis_lmp: {type: [string, "null"]}
                          basis_ultrasound: {type: [string, "null"]}
                          basis_manual: {type: [string, "null"]}
                          primary: {type: [string, "null"]}
                          secondary: {type: [string, "null"]}
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/pregnancy/v2/dating-preview:
    post:
      tags: [PregnancyV2]
      summary: Preview the gestational age and due date of a dating source (no write)
      description: |
        Setup step 3/3. `manual` dates from today. Usual birth range = due date ± (14 + uncertainty) days.
        `basis` / `range_label` are the `pregnancy_setup/result` templates (message_contents) with dates in the
        locale's calendar. More than 42w6d → 422 on the dating field.
