                  success: {type: boolean}
                  data: {$ref: "#/components/schemas/PlusPlans"}
              example:
                success: true
                data:
                  currency: IRR
                  vat_rate_bps: 1000
                  trial_days: 7
                  plans:
                    - {id: 1, code: plus_1m, title: ۱ ماهه, badge: null, duration_months: 1, price: 990000, monthly_price: 990000, savings_percent: 0, is_highlighted: false}
                    - {id: 2, code: plus_3m, title: ۳ ماهه, badge: محبوب‌ترین, duration_months: 3, price: 2370000, monthly_price: 790000, savings_percent: 20, is_highlighted: true}
                    - {id: 3, code: plus_6m, title: ۶ ماهه, badge: null, duration_months: 6, price: 3900000, monthly_price: 650000, savings_percent: 34, is_highlighted: false}
  /api/v1/plus/status:
    get:
      tags: [Plus]
      summary: The caller's Plus status and entitlements
      description: |
        `tier` is `plus` (a subscription period covers now), `trial` (the free trial is running) or `free`.
        `subscription` is the covering period (`canceled` = auto-renew off, still valid until `ends_at`);
        `trial` the trial row (running or not); `trial_available` = never trialled and never subscribed.
        `entitlements` is every Plus feature for this month (Tehran calendar month from `period_start`, resetting at
        `resets_at`): `limit`/`remaining` are null when unlimited and 0 when locked. Trials get the Plus quotas.
        `trial_offer` is the running trial offer (B-N2-06; null unless the trial runs, the user has no subscription and
        the admin percent is above 0) — the same object as the home banner.
      operationId: getPlusStatus
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The status
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: "#/components/schemas/PlusStatus"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/plus/usage:
    get:
      tags: [Plus]
      summary: This month's feature usage
      description: "Every Plus feature with this month's counter (the trial sheet's usage lines and quota display)."
      operationId: getPlusUsage
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The usage
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: "#/components/schemas/PlusUsage"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/plus/history:
    get:
      tags: [Plus]
      summary: Payment history
      description: "The caller's latest 50 invoices, newest first, each with its receipt (null unless paid)."
      operationId: getPlusHistory
      security:
        - {bearerAuth: []}
      parameters:
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: The invoices
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
