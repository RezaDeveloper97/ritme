              example: {success: false, message: Invalid date format. Use YYYY-MM-DD.}
  /api/v1/cycle/month/{year}/{month}:
    get:
      tags: [Cycle]
      summary: Get cycle calculations for a month
      description: |
        Retrieve all calculated cycle data for a specific month (calendar view)

        Encoded with `JSON_UNESCAPED_UNICODE`. In the default `full` view `text_flags`, `daily_tips` and `source_*` stay raw `{en, fa}` blobs.
      operationId: getCycleMonthByYearByMonth
      security:
        - {bearerAuth: []}
      parameters:
        - name: year
          in: path
          description: Year
          required: true
          schema: {type: integer, examples: [2024]}
        - name: month
          in: path
          description: Month (1-12)
          required: true
          schema: {type: integer, examples: [12]}
        - name: view
          in: query
          description: "Opt-in payload size. `full` (default, unchanged — the Android app reads it) returns every engine field per day, including the bilingual `text_flags`, `daily_tips` and `source_*` snapshots. `calendar` returns per day only calculation_date, cycle_day, phase, subphase, estimated_ovulation_day, cycle_length_used, is_fertile_window, is_pms_window, is_period_tomorrow, final_probability and cycle_variability (~93 % smaller) and skips the tip/text work. A day without cycle data keeps the same sentinel in both views: `cycle_day` null."
          required: false
          schema: {type: string, default: full, enum: [full, calendar]}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Monthly cycle calculations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [calculations, calculation_status, is_recalculating, month_summary]
                    properties:
                      calculations:
                        type: array
                        items:
                          type: object
                          required:
                            - calculation_date
                            - cycle_day
                            - phase
                            - subphase
                            - estimated_ovulation_day
                            - cycle_length_used
                            - is_fertile_window
                            - is_pms_window
                            - is_period_tomorrow
                            - final_probability
                            - cycle_variability
                          properties:
                            calculation_date: {$ref: "#/components/schemas/Date"}
                            cycle_day: {type: [integer, "null"]}
                            phase: {type: [string, "null"]}
                            subphase: {type: [string, "null"]}
                            estimated_ovulation_day: {type: [integer, "null"]}
                            cycle_length_used: {type: [number, "null"]}
                            is_fertile_window: {type: boolean}
                            is_pms_window: {type: boolean}
                            is_period_tomorrow: {type: boolean}
                            final_probability: {type: [number, "null"]}
                            cycle_variability: {type: [string, "null"]}
                            is_luteal_spotting: {type: boolean}
                            cycle_score: {type: [number, "null"]}
                            age_factor: {type: [number, "null"]}
                            base_probability: {type: [number, "null"]}
                            symptom_score: {type: [number, "null"]}
                            uncertainty_range: {type: [number, "null"]}
                            text_flags:
                              type: object
                              properties:
                                fertility_status: {$ref: "#/components/schemas/RawTranslations"}
                                probability_message: {$ref: "#/components/schemas/RawTranslations"}
                                phase_info: {$ref: "#/components/schemas/RawTranslations"}
                                pms_warning: {$ref: "#/components/schemas/RawTranslations"}
                                period_prediction: {$ref: "#/components/schemas/RawTranslations"}
                                incomplete_profile: {$ref: "#/components/schemas/RawTranslations"}
                            daily_tips:
                              type: array
                              items:
                                type: object
                                required: [type, fa, en, title]
                                properties:
                                  type: {type: string}
                                  fa: {type: string}
                                  en: {type: string}
                                  title: {$ref: "#/components/schemas/RawTranslations"}
                            source_profile_data:
                              type: [object, "null"]
                              required: [birthday, period_duration, cycle_duration, last_period_start]
                              properties:
                                birthday: {$ref: "#/components/schemas/Date"}
                                period_duration: {type: number}
                                cycle_duration: {type: number}
                                last_period_start: {$ref: "#/components/schemas/Date"}
                            source_daily_log_data:
                              type: [object, "null"]
                              additionalProperties:
                                anyOf:
                                  - {type: array, items: {type: string}}
                                  - {type: string}
                                  - {type: number}
                                  - {type: boolean}
                                  - {type: "null"}
                      calculation_status: {type: string}
                      is_recalculating: {type: boolean}
                      month_summary:
                        type: object
                        required: [fertile_days, period_days, pms_days]
                        properties:
                          fertile_days: {type: integer}
                          period_days: {type: integer}
                          pms_days: {type: integer}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422':
          description: Invalid month or unknown view
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties: {success: {type: boolean}, message: {type: string}}
              example: {success: false, message: Invalid month. Must be between 1 and 12.}
  /api/v1/cycle/period:
    post:
      tags: [Period Log]
      summary: Log a complete period range
      description: "Creates a logged period from an explicit start (and optional end) date in one call. Unlike start+end, this never depends on which period is currently ongoing, so a client reconciling several ranges at once can't close the wrong one."
      operationId: postCyclePeriod
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [start_date]
              properties:
                start_date: {type: string, format: date, examples: ["2026-03-21"]}
                end_date:
                  description: Omit/null to leave the period ongoing
                  type: [string, "null"]
                  format: date
                  examples: ["2026-03-25"]
              type: object
      responses:
        '200':
          description: Period created
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data:
                    type: object
                    required: [id, active, period_start_date, period_end_date, warnings]
                    properties:
                      id: {type: integer}
                      active: {type: boolean}
                      period_start_date: {$ref: "#/components/schemas/Date"}
                      period_end_date:
                        anyOf: [{$ref: "#/components/schemas/Date"}, {type: "null"}]
                      warnings:
                        type: array
                        items:
                          type: object
                          required: [type, message]
                          properties: {type: {type: string}, message: {type: string}}
              example:
                success: true
                message: Profile updated successfully
                data:
                  id: 101805
                  active: false
                  period_start_date: "2026-03-30"
                  period_end_date: "2026-04-03"
                  warnings: []
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422':
          description: Validation error / overlap
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  errors:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
                  code: {type: string}
              example:
                success: false
                message: The end date field must be a date after or equal to start date.
                errors: {end_date: [The end date field must be a date after or equal to start date.]}
  /api/v1/cycle/period/end:
    post:
      tags: [Period Log]
      summary: Mark the ongoing period as ended
      description: Closes the current ongoing period with an end date (defaults to today) and records the bleeding length.
      operationId: postCyclePeriodEnd
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      requestBody:
        content:
          application/json:
            schema:
              properties:
                date:
                  description: "Period end date; defaults to today"
                  type: [string, "null"]
                  format: date
                  examples: ["2024-12-05"]
              type: object
      responses:
        '200':
          description: Period end recorded
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data:
                    type: object
                    required: [active, period_start_date, period_end_date, warnings]
                    properties:
                      active: {type: boolean}
                      period_start_date: {$ref: "#/components/schemas/Date"}
                      period_end_date: {$ref: "#/components/schemas/Date"}
                      warnings:
                        type: array
                        items:
                          type: object
                          required: [type, message]
                          properties: {type: {type: string}, message: {type: string}}
              example:
                success: true
                message: Profile updated successfully
                data:
                  active: false
                  period_start_date: "2026-09-21"
                  period_end_date: "2026-09-21"
                  warnings:
                    - type: short_period_flag
                      message: "Was this really a period or spotting? You can still log it."
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422':
          description: Validation error / no ongoing period
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  errors:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
              example: {success: false, message: The period end date cannot be before its start date.}
  /api/v1/cycle/period/history:
    get:
      tags: [Period Log]
      summary: List logged periods
      description: "All periods the user has logged (newest first), so the client can render and edit real logged ranges as opposed to predictions."
      operationId: getCyclePeriodHistory
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      responses:
        '200':
          description: Logged periods
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [periods]
                    properties:
                      periods:
                        type: array
                        items:
                          type: object
                          required: [id, period_start_date, period_end_date, source]
                          properties:
                            id: {type: integer}
                            period_start_date: {$ref: "#/components/schemas/Date"}
                            period_end_date:
                              anyOf: [{$ref: "#/components/schemas/Date"}, {type: "null"}]
                            source: {type: string}
              example:
                success: true
                data:
                  periods:
                    - id: 100405
                      period_start_date: "2026-08-17"
                      period_end_date: "2026-08-21"
                      source: user_logged
                    - id: 100404
                      period_start_date: "2026-07-20"
                      period_end_date: "2026-07-24"
                      source: user_logged
                    - id: 100403
                      period_start_date: "2026-06-22"
                      period_end_date: "2026-06-26"
                      source: user_logged
                    - id: 100402
                      period_start_date: "2026-05-25"
                      period_end_date: "2026-05-29"
                      source: user_logged
                    - id: 100401
                      period_start_date: "2026-04-27"
                      period_end_date: "2026-05-01"
                      source: user_logged
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/cycle/period/start:
    post:
      tags: [Period Log]
      summary: Mark a period as started
      description: "Records the start of a menstrual period (defaults to today), re-anchors the cycle and triggers recalculation."
      operationId: postCyclePeriodStart
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      requestBody:
        content:
          application/json:
            schema:
              properties:
                date:
                  description: "Period start date; defaults to today"
                  type: [string, "null"]
                  format: date
                  examples: ["2024-12-01"]
              type: object
      responses:
        '200':
          description: Period start recorded
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data:
                    type: object
                    required: [active, period_start_date, period_end_date, warnings]
                    properties:
                      active: {type: boolean}
                      period_start_date: {$ref: "#/components/schemas/Date"}
                      period_end_date:
                        anyOf: [{$ref: "#/components/schemas/Date"}, {type: "null"}]
                      warnings:
                        type: array
                        items:
                          type: object
                          required: [type, message]
                          properties: {type: {type: string}, message: {type: string}}
              example:
                success: true
                message: Profile updated successfully
                data:
                  active: true
                  period_start_date: "2026-09-23"
                  period_end_date: null
                  warnings:
                    - type: close_to_previous
                      message: "This is very close to your previous period. Are you sure it is a new period and not continued bleeding?"
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  errors:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
                  code: {type: string}
                  data:
                    type: object
                    required: [open_period_start]
                    properties: {open_period_start: {$ref: "#/components/schemas/Date"}}
              example:
                success: false
                message: The date field must be a valid date.
                errors: {date: [The date field must be a valid date.]}
  /api/v1/cycle/period/status:
    get:
      tags: [Period Log]
      summary: Current period logging state
      description: "Returns whether the user currently has an ongoing (open) period, so the client can show Start vs End."
      operationId: getCyclePeriodStatus
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      responses:
        '200':
          description: Period status
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [active, period_start_date, period_end_date]
                    properties:
                      active: {type: boolean}
                      period_start_date:
                        anyOf: [{$ref: "#/components/schemas/Date"}, {type: "null"}]
                      period_end_date:
                        anyOf: [{$ref: "#/components/schemas/Date"}, {type: "null"}]
              example:
                success: true
                data: {active: false, period_start_date: "2026-09-21", period_end_date: "2026-09-23"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/cycle/period/{period}:
    put:
      tags: [Period Log]
      summary: Edit a logged period
      description: "Moves a logged period's start and/or end date, then re-anchors the cycle and recalculates predictions."
      operationId: putCyclePeriodByPeriod
      security:
        - {bearerAuth: []}
      parameters:
        - {name: period, in: path, required: true, schema: {type: integer}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [start_date]
              properties:
                start_date: {type: string, format: date, examples: ["2024-12-02"]}
                end_date:
                  description: Omit/null to leave the period ongoing
                  type: [string, "null"]
                  format: date
                  examples: ["2024-12-06"]
              type: object
      responses:
        '200':
          description: Period updated
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data:
                    type: object
                    required: [id, period_start_date, period_end_date, warnings]
                    properties:
                      id: {type: integer}
                      period_start_date: {$ref: "#/components/schemas/Date"}
                      period_end_date:
                        anyOf: [{$ref: "#/components/schemas/Date"}, {type: "null"}]
                      warnings: {type: array}
              example:
                success: true
                message: Profile updated successfully
                data:
                  id: 100406
                  period_start_date: "2026-09-13"
                  period_end_date: "2026-09-18"
                  warnings: []
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404':
          description: Period not found
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties: {success: {type: boolean}, message: {type: string}}
              example: {success: false, message: Period not found.}
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  errors:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
                  code: {type: string}
              example:
                success: false
                message: The start date field is required.
                errors: {start_date: [The start date field is required.]}
    delete:
      tags: [Period Log]
      summary: Delete a logged period
      description: "Removes a logged period, re-anchors the cycle on the most recent remaining period and recalculates predictions."
      operationId: deleteCyclePeriodByPeriod
      security:
        - {bearerAuth: []}
      parameters:
        - {name: period, in: path, required: true, schema: {type: integer}}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Period deleted
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data:
                    type: object
                    required: [deleted]
                    properties: {deleted: {type: boolean}}
              example: {success: true, message: Profile updated successfully, data: {deleted: true}}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '404':
          description: Period not found
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties: {success: {type: boolean}, message: {type: string}}
              example: {success: false, message: Period not found.}
  /api/v1/cycle/phase-content/{phase}:
    get:
      tags: [Content]
      summary: Get educational content for a cycle sub-phase
      description: "Returns the nine localized content sections for a given fine-grained cycle sub-phase (the cycle_view.subphase value), for the Phase Details screen."
      operationId: getCyclePhaseContentByPhase
      security:
        - {bearerAuth: []}
      parameters:
        - name: phase
          in: path
          description: "Sub-phase key (e.g. menstruation, high_fertility, pms_possible)"
          required: true
          schema:
            type: string
            enum:
              - menstruation
              - early_follicular
              - mid_follicular
              - fertile_rising
              - high_fertility
              - ovulation_likely
              - post_ovulation
              - early_luteal
              - mid_luteal
              - late_luteal
              - pms_possible
              - period_expected
        - {$ref: "#/components/parameters/LocaleQuery"}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Phase content retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [phase, phase_label, sections]
                    properties:
                      phase: {type: string}
                      phase_label: {type: string}
                      sections:
                        type: object
                        required:
                          - symptom_prediction
                          - vaginal_discharge
                          - fertility
                          - hormonal_changes
                          - sex_tips
                          - nutrition
                          - exercise
                          - skin_care
                          - sleep
                        properties:
                          symptom_prediction: {type: string}
                          vaginal_discharge: {type: string}
                          fertility: {type: string}
                          hormonal_changes: {type: string}
                          sex_tips: {type: string}
                          nutrition: {type: string}
                          exercise: {type: string}
                          skin_care: {type: string}
                          sleep: {type: string}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422':
          description: Invalid phase key
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties: {success: {type: boolean}, message: {type: string}}
              example: {success: false, message: Invalid phase key}
  /api/v1/cycle/recalculate:
    post:
      tags: [Cycle]
      summary: Trigger recalculation
      description: "Records a recalculation of the cycle data. Every cycle endpoint computes live from the user's inputs, so the recalculation completes synchronously: the version is bumped and the status is `completed` in the response (and in /cycle/status) right away. Kept for clients that call it after daily log updates."
      operationId: postCycleRecalculate
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      responses:
        '200':
          description: Recalculation completed
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data:
                    type: object
                    required: [version, status]
                    properties: {version: {type: integer}, status: {type: string}}
              example: {success: true, message: Recalculation completed, data: {version: 2, status: completed}}
        '400':
          description: Profile not complete
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties: {success: {type: boolean}, message: {type: string}}
              example: {success: false, message: Please complete your profile first}
        '401': {$ref: "#/components/responses/Unauthenticated"}
