                source: {type: string, enum: [lmp, ultrasound, manual]}
                lmp_date: {$ref: "#/components/schemas/Date"}
                ultrasound_date: {$ref: "#/components/schemas/Date"}
                ultrasound_weeks: {type: integer, minimum: 0, maximum: 42}
                ultrasound_days: {type: integer, minimum: 0, maximum: 6}
                manual_weeks: {type: integer, minimum: 0, maximum: 42}
                manual_days: {type: integer, minimum: 0, maximum: 6}
      responses:
        '200':
          description: The preview
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data: {$ref: "#/components/schemas/PregnancyV2DatingPreview"}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/PregnancyV2ValidationFailed"}
  /api/v1/pregnancy/v2/today:
    get:
      tags: [PregnancyV2]
      summary: Pregnancy Today screen
      description: |
        Week carousel (prev / current / next), due card, 40-week progress with trimester start dates, next visit
        (next upcoming non-cancelled M3 appointment, whatever its reminder switch, else the next active care-plan item), week tip (`pregnancy_week_tip/{week}`),
        this week's tasks with done state and the unread alert count — in ≤ 5 queries. Week counts to 42 when overdue.
        A GET first runs the daily alert evaluation (deduplicated per window, idempotent), so `unread_alerts` already
        counts the calendar alerts (`week_entered`, `weight_missing_week`) before the Alerts screen is opened; HEAD
        is read-only (T-M7-20).
      operationId: getPregnancyV2Today
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      responses:
        '200':
          description: Today
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [date, weeks, days, week, trimester, confidence, carousel, due, progress, next_visit, tip, tasks, unread_alerts]
                    properties:
                      date: {$ref: "#/components/schemas/Date"}
                      date_label: {type: string}
                      source: {type: string, enum: [lmp, ultrasound, manual]}
                      weeks: {type: integer}
                      days: {type: integer}
                      week: {type: integer, minimum: 1, maximum: 42}
                      trimester: {type: integer, enum: [1, 2, 3]}
                      confidence: {$ref: "#/components/schemas/PregnancyV2Confidence"}
                      uncertainty_days: {type: integer}
                      carousel:
                        type: array
                        items:
                          type: object
                          required: [week, trimester, title, relation]
                          properties:
                            week: {type: integer}
                            trimester: {type: integer}
                            title: {type: string, description: "The age: «۸ هفته و ۳ روز» on the current week, the completed weeks at the start of the week («۷ هفته») on the others"}
                            headline: {type: [string, "null"]}
                            size_line: {type: [string, "null"]}
                            illustration_key: {type: [string, "null"]}
                            relation: {type: string, enum: [past, current, future]}
                      due:
                        type: object
                        required: [date, date_label, days_left, overdue_days, range, range_label]
                        properties:
                          date: {$ref: "#/components/schemas/Date"}
                          date_label: {type: string}
                          days_left: {type: integer}
                          overdue_days: {type: integer}
                          range: {$ref: "#/components/schemas/PregnancyV2Range"}
                          range_label: {type: string}
                      progress:
                        type: object
                        required: [week, percent, trimesters]
                        properties:
                          week: {type: integer}
                          percent: {type: integer, minimum: 0, maximum: 100}
                          trimesters:
                            type: array
                            items:
                              type: object
                              required: [trimester, start_date, start_label, percent]
                              properties:
                                trimester: {type: integer}
                                start_date: {$ref: "#/components/schemas/Date"}
                                start_label: {type: string}
                                percent: {type: integer, description: position of the start on the 40-week bar}
                      next_visit:
                        oneOf:
                          - {type: "null"}
                          - type: object
                            required: [appointment_id, care_item_key, title, date, date_label, time, week, days_until, stage]
                            properties:
                              appointment_id: {type: [integer, "null"]}
                              care_item_key: {type: [string, "null"]}
                              title: {type: string}
                              date: {$ref: "#/components/schemas/Date"}
                              date_label: {type: string}
                              time: {type: [string, "null"], example: "09:30"}
                              week: {type: integer}
                              week_from: {type: integer}
                              week_to: {type: integer}
                              days_until: {type: integer}
                              stage: {type: [string, "null"], enum: [booked, done, result, null]}
                      tip: {$ref: "#/components/schemas/PregnancyV2Tip"}
                      tasks: {type: array, items: {$ref: "#/components/schemas/PregnancyV2Task"}}
                      unread_alerts: {type: integer, description: "Unread, not dismissed v2 alerts of the Alerts window (the last 7 days) — exactly what GET /pregnancy/v2/alerts lists; legacy v1 rows are not counted."}
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '409': {$ref: "#/components/responses/PregnancyNotActive"}
