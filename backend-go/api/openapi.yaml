  /api/v1/health-logs:
    get:
      tags: [Daily Health Log]
      summary: Get health logs list
      description: "Retrieve paginated list of user's daily health logs with optional date filtering"
      operationId: getHealthLogs
      security:
        - {bearerAuth: []}
      parameters:
        - name: from_date
          in: query
          description: Filter logs from this date (YYYY-MM-DD)
          required: false
          schema: {type: string, format: date, examples: ["2024-12-01"]}
        - name: to_date
          in: query
          description: Filter logs until this date (YYYY-MM-DD)
          required: false
          schema: {type: string, format: date, examples: ["2024-12-31"]}
        - {$ref: "#/components/parameters/AcceptLanguage"}
      responses:
        '200':
          description: Health logs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required:
                      - current_page
                      - data
                      - first_page_url
                      - from
                      - last_page
                      - last_page_url
                      - links
                      - next_page_url
                      - path
                      - per_page
                      - prev_page_url
                      - to
                      - total
                    properties:
                      current_page: {type: integer}
                      data:
                        type: array
                        items:
                          type: object
                          additionalProperties:
                            anyOf:
                              - {type: array, items: {type: string}}
                              - {type: string}
                              - {type: number}
                              - {type: boolean}
                              - {type: "null"}
                      first_page_url: {type: string}
                      from: {type: [number, "null"]}
                      last_page: {type: integer}
                      last_page_url: {type: string}
                      links:
                        type: array
                        items:
                          type: object
                          required: [url, label, page, active]
                          properties:
                            url: {type: [string, "null"]}
                            label: {type: string}
                            page: {type: [integer, "null"]}
                            active: {type: boolean}
                      next_page_url: {type: [string, "null"]}
                      path: {type: string}
                      per_page: {type: integer}
                      prev_page_url: {type: [string, "null"]}
                      to: {type: [number, "null"]}
                      total: {type: integer}
              example:
                success: true
                data:
                  current_page: 1
                  data: []
                  first_page_url: "http://127.0.0.1:8090/api/v1/health-logs?page=1"
                  from: null
                  last_page: 1
                  last_page_url: "http://127.0.0.1:8090/api/v1/health-logs?page=1"
                  links:
                    - {url: null, label: "&laquo; Previous", page: null, active: false}
                    - url: "http://127.0.0.1:8090/api/v1/health-logs?page=1"
                      label: "1"
                      page: 1
                      active: true
                    - {url: null, label: "Next &raquo;", page: null, active: false}
                  next_page_url: null
                  path: "http://127.0.0.1:8090/api/v1/health-logs"
                  per_page: 30
                  prev_page_url: null
                  to: null
                  total: 0
        '401': {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [Daily Health Log]
      summary: Create or update daily health log
      description: |
        Create a new health log or update existing one for the specified date. Each user can have only one log per day.

        Upsert on `(user_id, log_date)`: **201** when the row is created, **200** when it is updated. On create `data` holds only the attributes that were sent plus `user_id`, `id` and timestamps (Eloquent); on update the full row. An optional top-level `warning` follows `data`.
      operationId: postHealthLogs
      security:
        - {bearerAuth: []}
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [log_date]
              properties:
                log_date:
                  description: Date of the log entry
                  type: string
                  format: date
                  examples: ["2024-12-07"]
                bleeding_intensity:
                  description: Bleeding intensity level
                  type: string
                  enum: [low, medium, high, very_high]
                blood_color: {description: Blood color, type: string, enum: [bright_red, red, dark_red, brown]}
                has_clots:
                  description: "Legacy presence-only clotting flag; superseded by clots_amount"
                  type: boolean
                clots_amount: {description: Amount of clotting, type: string, enum: [none, low, medium, high]}
                spotting: {description: Spotting occurrence, type: boolean}
                bleeding_smell:
                  description: Bleeding odor
                  type: string
                  enum: [normal, slightly_unusual, strong_unpleasant]
                headache_intensity: {description: Headache intensity, type: string, enum: [low, medium, high]}
                stomach_ache_intensity:
                  description: Stomach ache intensity
                  type: string
                  enum: [low, medium, high]
                pelvic_pain_intensity:
                  description: Pelvic pain intensity
                  type: string
                  enum: [low, medium, high]
                breast_pain_intensity:
                  description: Breast pain intensity
                  type: string
                  enum: [low, medium, high]
                back_pain_intensity:
                  description: Back pain intensity
                  type: string
                  enum: [low, medium, high]
                ovarian_pain_intensity:
                  description: Ovarian pain intensity
                  type: string
                  enum: [low, medium, high]
                nausea_intensity:
                  description: Nausea/vomiting intensity
                  type: string
                  enum: [low, medium, high]
                bloating_intensity: {description: Bloating intensity, type: string, enum: [low, medium, high]}
                diarrhea: {description: Diarrhea occurrence, type: boolean}
                constipation: {description: Constipation occurrence, type: boolean}
                appetite_change: {description: Appetite change, type: string, enum: [loss, gain, normal]}
                food_craving: {description: Food craving, type: boolean}
                breast_sensitivity_intensity:
                  description: Breast sensitivity intensity
                  type: string
                  enum: [low, medium, high]
                vaginal_dryness: {description: Vaginal dryness, type: boolean}
                vaginal_burning:
                  description: "Legacy presence-only flag; superseded by vaginal_burning_intensity"
                  type: boolean
                vaginal_burning_intensity:
                  description: Vaginal burning intensity
                  type: string
                  enum: [low, medium, high]
                vaginal_itching:
                  description: "Legacy presence-only flag; superseded by vaginal_itching_intensity"
                  type: boolean
                vaginal_itching_intensity:
                  description: Vaginal itching intensity
                  type: string
                  enum: [low, medium, high]
                vaginal_smell_change: {description: Vaginal smell change, type: boolean}
                urination_change:
                  description: Urination frequency change
                  type: string
                  enum: [increase, decrease, normal]
                urination_burning_intensity:
                  description: Urination burning intensity
                  type: string
                  enum: [low, medium, high]
                acne: {description: Acne occurrence, type: boolean}
                oily_skin: {description: Oily skin, type: boolean}
                hair_loss: {description: Hair loss, type: boolean}
                swelling: {description: Swelling/puffiness, type: boolean}
                fatigue: {description: Fatigue, type: boolean}
                dizziness: {description: Dizziness, type: boolean}
                hot_flashes: {description: Hot flashes, type: boolean}
                chills: {description: Chills, type: boolean}
                moods:
                  description: Mood states (can select multiple)
                  type: array
                  items: {type: string, enum: [happy, calm, angry, anxious, sad, frustrated, sensitive, bored]}
                sleep_duration:
                  description: Sleep duration in hours
                  type: string
                  enum: ["0_3", "3_6", "6_9", "9_plus"]
                sleep_quality: {description: Sleep quality, type: string, enum: [good, medium, bad]}
                exercise_type:
                  description: Types of physical activity (can select multiple)
                  type: array
                  items:
                    type: string
                    enum: [walking, running, cycling, gym, yoga, swimming, dance, team_sport, other]
                exercise_duration: {description: Exercise duration in minutes, type: integer, examples: [45]}
                exercise_intensity:
                  description: Perceived exercise intensity
                  type: string
                  enum: [low, medium, high]
                sexual_activities:
                  description: During/after intercourse experiences (can select multiple)
                  type: array
                  items:
                    type: string
                    enum:
                      - high_desire
                      - protected_intercourse
                      - unprotected_intercourse
                      - no_desire
                      - dryness
                      - burning
                      - pain_during_intercourse
                      - bleeding_after_intercourse
                      - lubricant_use
                sexual_desire:
                  description: "Libido relative to the user's baseline"
                  type: string
                  enum: [lower, normal, higher]
                intercourse_type:
                  description: Whether intercourse was protected
                  type: string
                  enum: [protected, unprotected]
                weight: {description: Body weight in kg, type: number, format: float, examples: [65.5]}
                basal_body_temperature:
                  description: Basal body temperature (BBT) in Celsius
                  type: number
                  format: float
                  examples: [36.5]
                discharge_color:
                  description: Vaginal discharge color
                  type: string
                  enum: [clear, white, yellow, green, gray, pink_bloody]
                discharge_texture:
                  description: Vaginal discharge texture
                  type: string
                  enum: [watery, creamy, egg_white, thick]
                discharge_amount:
                  description: Vaginal discharge amount
                  type: string
                  enum: [low, medium, high]
                discharge_smell:
                  description: Vaginal discharge smell
                  type: string
                  enum: [normal, slightly_unusual, strong_unpleasant]
                discharge_itching: {description: Discharge-related itching, type: boolean}
                discharge_burning: {description: Discharge-related burning, type: boolean}
                frequent_urination: {description: Frequent urination, type: boolean}
                medications:
                  description: Medications and supplements taken
                  properties:
                    painkillers: {type: string, examples: [Ibuprofen]}
                    hormonal_pills: {type: string, examples: [LD]}
                    antibiotics: {type: string, examples: [Amoxicillin]}
                    supplements: {type: string, examples: ["Iron, Vitamin D"]}
                  type: object
                notes: {description: Personal notes, type: string, examples: [Feeling good today]}
              type: object
      responses:
        '200':
          description: Health log updated successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data:
                    type: object
                    additionalProperties:
                      anyOf:
                        - {type: array, items: {type: string}}
                        - {type: string}
                        - {type: number}
                        - {type: boolean}
                        - {type: "null"}
        '201':
          description: Health log created successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data:
                    type: object
                    required: [user_id, log_date, updated_at, created_at, id]
                    properties:
                      user_id: {type: integer}
                      log_date: {$ref: "#/components/schemas/Date"}
                      bleeding_intensity: {type: string}
                      updated_at: {$ref: "#/components/schemas/LaravelDateTime"}
                      created_at: {$ref: "#/components/schemas/LaravelDateTime"}
                      id: {type: integer}
                      sleep_duration: {type: string}
                      sleep_quality: {type: string}
                      weight: {$ref: "#/components/schemas/DecimalString"}
                      notes: {type: string}
                      moods: {type: array, items: {type: string}}
                      fatigue: {type: boolean}
                      exercise_type: {type: [array, "null"], items: {type: string}}
                      exercise_duration: {type: number}
                      blood_color: {type: string}
                      has_clots: {type: boolean}
                      clots_amount: {type: string}
                      bleeding_smell: {type: string}
                      stomach_ache_intensity: {type: string}
                      pelvic_pain_intensity: {type: string}
                      back_pain_intensity: {type: string}
                      nausea_intensity: {type: string}
                      bloating_intensity: {type: string}
                      diarrhea: {type: boolean}
                      constipation: {type: boolean}
                      appetite_change: {type: string}
                      food_craving: {type: boolean}
                      breast_sensitivity_intensity: {type: string}
                      vaginal_itching_intensity: {type: string}
                      urination_change: {type: string}
                      acne: {type: boolean}
                      exercise_intensity: {type: string}
                      discharge_color: {type: string}
                      discharge_texture: {type: string}
                      discharge_amount: {type: string}
                      frequent_urination: {type: boolean}
                      medications:
                        type: object
                        required: [painkillers, supplements]
                        properties: {painkillers: {type: string}, supplements: {type: string}}
                      spotting: {type: boolean}
                  warning:
                    type: object
                    required: [type, message]
                    properties: {type: {type: string}, message: {type: string}}
              example:
                success: true
                message: Health log created successfully
                data:
                  user_id: 1005
                  log_date: "2026-09-23"
                  spotting: true
                  updated_at: "2026-09-23T06:30:00.000000Z"
                  created_at: "2026-09-23T06:30:00.000000Z"
                  id: 101802
                warning:
                  type: luteal_spotting_warning
                  message: "This bleeding might be luteal spotting, not the start of your period. Are you sure?"
        '401': {$ref: "#/components/responses/Unauthenticated"}
        '422': {$ref: "#/components/responses/ValidationFailed"}
