group: analysis-ttc
entries:
  # D-175 (task T-M10-26, engine v6 M10, user OK 2026-10-21): BBT needs ≥ 10 temperatures in the cycle (SPEC v6 §4.1,
  # the engine/bbt minimum) — the card is ready from 10 and names min_temps / days_needed; the «how was it
  # confirmed» line says 10 instead of 6 + 3.
  - case: "*"
    where: data.bbt.data.min_temps
    deviation: D-175
    reason: BBT minimum temperatures in the cycle
  - case: "*"
    where: data.bbt.data.days_needed
    deviation: D-175
    reason: BBT temperatures still needed
  - case: "ttc_logged"
    step: 5
    where: data.bbt.ready
    deviation: D-175
    reason: 4 logged temperatures are below the 10-temperature minimum
  - case: "*"
    where: data.explanation.params.need
    deviation: D-175
    reason: BBT minimum 10 (was 6 + 3)
  - case: "*"
    where: data.explanation.text
    deviation: D-175
    reason: BBT minimum 10 (was 6 + 3)
  # D-175 (task T-M10-26b): top finding on the TTC hub = strength × recency (the cycle hub's scorer) over the cycle
  # sentence and, for Plus, the egg-white mucus pattern; without one the days nudge.
  - case: "*"
    where: data.top_finding.**
    deviation: D-175
    reason: TTC hub top finding (strength × recency), new key

  # D-178 (T-M10-29): new 8th entitlement row plus.analysis_long_range in the trial-start response.
  - case: "*_trial"
    where: data.entitlements
    deviation: D-178
    reason: new entitlement row plus.analysis_long_range (8 rows instead of 7)
