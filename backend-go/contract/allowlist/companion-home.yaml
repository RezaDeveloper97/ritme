group: companion-home
entries:
  # D-204 (T-M11-05): family.Grants.Apply writes a grants_changed activity row at invite and at accept; the owner's
  # /companions/audit trail has two more rows and the ids shift by two.
  - case: linked_granted_then_revoked
    step: 6
    where: body
    deviation: D-204
    reason: two extra grants_changed rows (invite + accept) from family.Grants.Apply; ids shift by two
  # D-194 (T-M11-06; F-01, F-03): member projections v6 on the companion home — the link view lists effective
  # sections only, the cycle card is the cycle_phase DTO (main_phase, period_soon for a partner; no dates or numbers),
  # and the symptoms card is gone.
  - case: "*"
    where: data.grants.*
    deviation: D-194
    reason: accept lists effective sections only (no none rows, no symptoms)
  - case: "*"
    where: data.partners[*].link.grants.*
    deviation: D-194
    reason: the home link view lists effective sections only
  - case: "*"
    where: data.partners[*].cycle.*
    deviation: D-194
    reason: the cycle card is the cycle_phase DTO — no dates or numbers
  - case: "*"
    where: data.partners[*].symptoms
    deviation: D-194
    reason: the symptoms card is removed (F-03)
  # D-208 («ریتمی همراه» v2, Go only): the member link and each partner card gain settings {goal, action_prefs}; each
  # partner card gains signals (null per signal unless the owner shares it; a coarse today yes/no otherwise).
  - case: "*"
    where: data.settings
    deviation: D-208
    reason: accept link gains settings (companion v2)
  - case: "*"
    where: data.partners[*].link.settings
    deviation: D-208
    reason: the home link view gains settings (companion v2)
  - case: "*"
    where: data.partners[*].settings
    deviation: D-208
    reason: partner card gains settings (companion v2)
  - case: "*"
    where: data.partners[*].signals
    deviation: D-208
    reason: partner card gains day signals (companion v2)
  - case: "*"
    where: data.companion.goal
    deviation: D-208
    reason: POST /companions companion gains goal (companion v2)
  - case: "*"
    where: data.companion.goals
    deviation: D-208
    reason: POST /companions companion gains goals (companion v2) — the multi-select list
  - case: "*"
    where: data.companion.signals
    deviation: D-208
    reason: POST /companions companion gains signal consents (companion v2)
  - case: "*"
    where: data.companion.action_prefs
    deviation: D-208
    reason: POST /companions companion gains action_prefs (companion v2)
