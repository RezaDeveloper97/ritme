group: cycle-sweep
entries:
  # D-26 (task T-M2-34, backend review #4): the predicted daily card maps its fertility level with
  # FertilityLevelV11() like cycle_view.fertility_level (Laravel: legacy fertilityLevel()).
  - case: "*"
    where: "**.daily_card.fertility_level"
    deviation: D-26
    reason: v1.1 mapping (post_ovulation → low, ovulation_likely → peak) instead of the legacy one
  - case: "*"
    where: "**.daily_card.fertility_label"
    deviation: D-26
    reason: label of the v1.1 fertility level
  # D-27 (task T-M2-35, stage regression A B-2): the post-ovulation predicted card has its own
  # "fertility is lower now" note instead of the fertile window's "fertility is higher here".
  - case: "*"
    where: "**.daily_card.subtitle"
    deviation: D-27
    reason: post_ovulation note (fertility level low) instead of Laravel's reused fertile-window note
