group: healthrecord-extract
entries:
  # D-169 (task T-M10-18): the trimester is by completed days (ACOG CO 700: T1 to 13+6). After the applied scan the
  # pregnant_lmp_w8 persona is 13+1 on the contract day — trimester 1 now (the golden had the old `weeks <= 12` → 2).
  - case: "dating_apply.*"
    step: 12
    where: data.status.trimester
    deviation: D-169
    reason: 13+1 is the first trimester (completed days)
  - case: "dating_apply.*"
    step: 12
    where: data.status.gestational_age.trimester
    deviation: D-169
    reason: 13+1 is the first trimester (completed days)
  - case: "dating_apply.*"
    step: 12
    where: data.status.flags.trimester_info.*
    deviation: D-169
    reason: the trimester flag text follows the trimester (13+1 → 1)

  # D-178 (T-M10-29): new 8th entitlement row plus.analysis_long_range in the trial-start response.
  - case: "*"
    where: data.entitlements
    deviation: D-178
    reason: new entitlement row plus.analysis_long_range (8 rows instead of 7)

  # D-178: the same 8th row in GET /plus/usage (row 1 plus.lab_ai is unchanged during the trial).
  - case: "*"
    where: data.features
    deviation: D-178
    reason: new entitlement row plus.analysis_long_range (8 rows instead of 7)
