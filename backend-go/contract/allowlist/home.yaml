  # day, so the trimester-keyed smart tip (sections[3]) carries the first-trimester copy.
  - case: "index.pregnant_manual_w14.*"
    step: 1
    where: data.sections[3].data.text
    deviation: D-169
    reason: smart tip keyed by the trimester (13+0 → trimester 1 copy)
