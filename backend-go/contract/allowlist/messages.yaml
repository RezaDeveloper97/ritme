group: messages
entries:
  # D-28 (task T-M2-35, stage regression A B-3): /messages/daily reads the day by the v1.1
  # display window (task.md §19, ends on ovulation). The fixture's ttc persona has one date on
  # the legacy O + 1 day (2026-09-26): Laravel says phase ovulation + fertile window there, Go
  # luteal + not fertile, so every phase-keyed layer (base message, nutrition, sleep, exercise)
  # carries the luteal copy.
  - case: "daily_dates.ttc.*"
    where: data.context_info.phase
    deviation: D-28
    reason: O + 1 is luteal by the §19 display window (legacy engine says ovulation)
  - case: "daily_dates.ttc.*"
    where: data.context_info.phase_label
    deviation: D-28
    reason: label of the §19 phase
  - case: "daily_dates.ttc.*"
    where: data.context_info.is_fertile_window
    deviation: D-28
    reason: the §19 display window ends on ovulation
  - case: "daily_dates.ttc.*"
    where: data.primary_message.**
    deviation: D-28
    reason: base message of the §19 phase (luteal instead of ovulation copy)
  - case: "daily_dates.ttc.*"
    where: data.supplements.**
    deviation: D-28
    reason: nutrition / sleep / exercise modules keyed by the §19 phase

  # D-169 (task T-M10-18, engine v6 M10, user OK 2026-10-21): the trimester is by completed days (ACOG CO 700: T1 to
  # 13+6; Laravel's `weeks <= 12` put 13+0 … 13+6 in trimester 2). The manual 12+0 persona is 13+0 on the contract
  # day, so /messages/daily in pregnancy mode reads trimester 1 and every trimester-keyed layer (base message,
  # nutrition, sleep, exercise) carries the first-trimester copy.
  - case: "daily.pregnant_manual_w14.*"
    step: 1
    where: data.context_info.trimester
    deviation: D-169
    reason: 13+0 is the first trimester (completed days)
  - case: "daily.pregnant_manual_w14.*"
    step: 1
    where: data.primary_message.**
    deviation: D-169
    reason: base message of trimester 1 (trimester, label and copy)
  - case: "daily.pregnant_manual_w14.*"
    step: 1
    where: data.supplements.**
    deviation: D-169
    reason: nutrition / sleep / exercise modules keyed by the trimester
  - case: "daily_force_mode_pregnant.*"
    step: 2
    where: data.context_info.trimester
    deviation: D-169
    reason: 13+0 is the first trimester (completed days)
  - case: "daily_force_mode_pregnant.*"
    step: 2
    where: data.primary_message.**
    deviation: D-169
    reason: base message of trimester 1 (trimester, label and copy)
  - case: "daily_force_mode_pregnant.*"
    step: 2
    where: data.supplements.**
    deviation: D-169
    reason: nutrition / sleep / exercise modules keyed by the trimester

  # D-172 (task T-M10-21, engine v6 M10, user OK 2026-10-21): the checkup inside a menopause message gains
  # `informational` (bool) and `label` (null | "after_pregnancy"). Additive; the Go-only golden predates them.
  - case: "menopause_flow.*"
    where: data.messages[*].data.checkup.informational
    deviation: D-172
    reason: new checkup item key (additive)
  - case: "menopause_flow.*"
    where: data.messages[*].data.checkup.label
    deviation: D-172
    reason: new checkup item key (additive)

  # D-214 (user request 2026-11-25): a low-energy cycle day is no longer Laravel's 500 (D-11); Go serves the
  # cycle_override/low_energy copy. The premium persona's 2026-09-14 and 2026-09-20 steps hit it.
  - case: "daily_dates_premium.*"
    step: 1
    where: status
    deviation: D-214
    reason: 200 with the low_energy override instead of Laravel's 500
  - case: "daily_dates_premium.*"
    step: 1
    where: body
    deviation: D-214
    reason: the daily message envelope instead of {"message":"Server Error"}
  - case: "daily_dates_premium.*"
    step: 2
    where: status
    deviation: D-214
    reason: 200 with the low_energy override instead of Laravel's 500
  - case: "daily_dates_premium.*"
    step: 2
    where: body
    deviation: D-214
    reason: the daily message envelope instead of {"message":"Server Error"}
