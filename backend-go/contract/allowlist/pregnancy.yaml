group: pregnancy
entries:
  # D-134 (task T-M9-05, engine v6, user OK 2026-10-21): a blood pressure at or above 160/110 is the severe tier.
  # v1 (this Laravel route) answers an emergency alert with the severe copy and the call-now actions instead of
  # Laravel's warning "High Blood Pressure" (the fixture week log sends 165/112).
  - case: "weekly_store_upsert.*"
    step: 1
    where: data.alerts[0].alert_level
    deviation: D-134
    reason: ≥160/110 is the severe tier → emergency (Laravel warning)
  - case: "weekly_store_upsert.*"
    step: 1
    where: data.alerts[0].title
    deviation: D-134
    reason: severe-tier title
  - case: "weekly_store_upsert.*"
    step: 1
    where: data.alerts[0].message
    deviation: D-134
    reason: severe-tier message (contact now, 115 with warning signs)
  - case: "weekly_store_upsert.*"
    step: 1
    where: data.alerts[0].trigger_symptoms.severe
    deviation: D-134
    reason: the severe tier is recorded on the alert
  - case: "weekly_store_upsert.*"
    step: 1
    where: data.alerts[0].recommended_actions
    deviation: D-134
    reason: severe-tier actions (two instead of Laravel's three)
  - case: "weekly_store_upsert.*"
    step: 1
    where: data.alerts[0].recommended_actions[*]
    deviation: D-134
    reason: severe-tier actions (call the doctor or midwife now, call 115)

  # D-134 (task T-M9-05): the v2 emergency rules (bp_high, fetal_movement, critical_symptom) now fire with the
  # embedded fa/en copy when the admin message_contents row is missing — the contract dump has none, so before
  # T-M9-05 no v2 row was written there. v2 alerts share the pregnancy_alerts table (alert_type 'v2:<rule>',
  # T-M7-04), so the extra rows move the auto-increment ids of later v1 alerts and are counted by the legacy
  # /pregnancy/alerts/summary. The v1 alerts in the responses are otherwise unchanged. Since T-M10-08/08b (D-165) the
  # counts below come from the preg.* message_inbox rows read next to the legacy v1 rows.
  - case: "weekly_store_upsert.*"
    step: 2
    where: data.alerts[*].id
    deviation: D-134
    reason: the step-1 v2 emergency rows (embedded copy) take two ids first
  - case: "fetal_movement_store_reduced.*"
    step: 2
    where: data.alerts[*].id
    deviation: D-134
    reason: the step-1 v2 fetal_movement row (embedded copy) takes one id first
  - case: "symptoms_store_alerts.*"
    step: 2
    where: data.counts.total
    deviation: D-134
    reason: the preg.* inbox rows (D-165) are counted next to the legacy v1 alerts
  - case: "symptoms_store_alerts.*"
    step: 2
    where: data.counts.unread
    deviation: D-134
    reason: the preg.* inbox critical_symptom row (D-165) is unread
  - case: "symptoms_store_alerts.*"
    step: 2
    where: data.counts.emergency
    deviation: D-134
    reason: the preg.* inbox critical_symptom row (D-165) is emergency level

  # D-169 (task T-M10-18, engine v6 M10, user OK 2026-10-21): the trimester is by completed days (SPEC v6 §3.1, ACOG
  # CO 700: T1 to 13+6, T2 14+0 … 27+6, T3 from 28+0, registry key pregnancy.trimester). Laravel's `weeks <= 12` put
  # 13+0 … 13+6 in trimester 2. The manual 12+0 persona is 13+0 on the contract day, the onboarding scan (10+3 on
  # 2026-09-01) 13+4 — both now trimester 1; nothing else in the payloads moves.
  - case: "*.pregnant_manual_w14.*"
    where: "**.trimester"
    deviation: D-169
    reason: 13+0 is the first trimester (completed days; Laravel weeks <= 12 → 2)
  - case: "*.pregnant_manual_w14.*"
    where: "**.trimester_info.*"
    deviation: D-169
    reason: the trimester flag text follows the trimester (13+0 → 1)
  - case: "fetal_movement_store_first_felt.*"
    where: "**.trimester"
    deviation: D-169
    reason: the persona is pregnant_manual_w14 (13+0 → trimester 1)
  - case: "fetal_movement_store_first_felt.*"
    where: "**.trimester_info.*"
    deviation: D-169
    reason: the trimester flag text follows the trimester (13+0 → 1)
  - case: "onboarding_ultrasound.*"
    where: "**.trimester"
    deviation: D-169
    reason: the 10+3 scan of 2026-09-01 is 13+4 on the contract day — first trimester
  - case: "onboarding_ultrasound.*"
    where: "**.trimester_info.*"
    deviation: D-169
    reason: the trimester flag text follows the trimester (13+4 → 1)

  # D-165 (task T-M10-08, engine v6 M10, user OK 2026-10-21): pregnancy alerts come from the message engine (seeded
  # preg.* rules, goose 00113; locked safety rules have a code-held fallback). The v1 save answers keep their shape and
  # key order, but each alert is now one open inbox row: alert_type is the rule name (critical_symptom, fetal_movement,
  # bp_high …), title / message / recommended_actions are the engine copy, id is the message_inbox id,
  # trigger_symptoms carries the evidence (bools for critical symptoms), and several hits merge into one critical
  # alert. The Laravel-schema contract DB has no 00113 rows, so only the locked safety rules fire here (no GDM alert).
  - case: "symptoms_store_alerts.*"
    where: data.alerts.**
    deviation: D-165
    reason: engine alerts (one merged critical_symptom inbox row, engine copy)
  - case: "symptoms_store_spotting.*"
    where: data.alerts.**
    deviation: D-165
    reason: spotting ≤ week 12 is the locked critical_symptom rule (engine copy, emergency)
  - case: "symptoms_store_upsert"
    where: data.alerts.**
    deviation: D-165
    reason: reduced fetal movement is the locked fetal_movement rule; severe-symptom counts need the seeded rule
  - case: "weekly_store_upsert.*"
    where: data.alerts.**
    deviation: D-165
    reason: engine alerts (fetal_movement, bp severe); GDM is a non-locked rule absent from the contract DB
  - case: "fetal_movement_store_reduced.*"
    where: data.alerts.**
    deviation: D-165
    reason: the locked fetal_movement rule with the engine copy
  # D-165 (task T-M10-08b): /pregnancy/alerts/summary reads the alerts inbox (preg.* rows) next to the legacy rows, so
  # has_emergency / has_unread match Laravel again; latest_emergency is now the inbox row — the one merged
  # critical_symptom alert (bleeding + fluid leakage + severe pain) with the engine copy, instead of Laravel's newest
  # "Emergency: Heavy Bleeding" pregnancy_alerts row. Its level, read state, week and timestamps are unchanged.
  - case: "symptoms_store_alerts.*"
    step: 2
    where: data.latest_emergency.id
    deviation: D-165
    reason: the message_inbox id of the critical_symptom row
  - case: "symptoms_store_alerts.*"
    step: 2
    where: data.latest_emergency.alert_type
    deviation: D-165
    reason: alert_type is the rule name (critical_symptom; Laravel symptom_based)
  - case: "symptoms_store_alerts.*"
    step: 2
    where: data.latest_emergency.title
    deviation: D-165
    reason: engine copy of the merged critical symptom alert
  - case: "symptoms_store_alerts.*"
    step: 2
    where: data.latest_emergency.message
    deviation: D-165
    reason: engine copy (contact the doctor or midwife now)
  - case: "symptoms_store_alerts.*"
    step: 2
    where: data.latest_emergency.trigger_symptoms.*
    deviation: D-165
    reason: the evidence is every critical symptom logged (bools), one merged alert instead of one per symptom
  - case: "symptoms_store_alerts.*"
    step: 2
    where: data.latest_emergency.recommended_actions[*]
    deviation: D-165
    reason: the rule's action labels (call the doctor or midwife, got it)
