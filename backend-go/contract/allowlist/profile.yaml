group: profile
entries:
  # D-22 (task T-M2-30): the fa BMI fallback copy says «ریتمی» instead of Laravel's Latin "Ritme".
  # Only the ar cases hit the code fallback (the fixture has fa/en message_contents rows).
  - case: "show.*.ar"
    where: data.bmi.message
    deviation: D-22
    reason: fa fallback BMI text names the app «ریتمی»; Laravel's copy has the Latin "Ritme"

  # D-24 (task T-M2-34, backend review #2): POST /profile without last_period_start no longer
  # invents a period dated today, so the profile keeps last_period_start null and no
  # recalculation runs (calculation_* stay at their defaults).
  - case: create_profile_empty_body
    where: "**.last_period_start"
    deviation: D-24
    reason: Laravel defaults last_period_start to today; Go leaves it null
  - case: create_profile_empty_body
    where: "**.calculation_status"
    deviation: D-24
    reason: no cycle field set → no markRecalculated (pending instead of completed)
  - case: create_profile_empty_body
    where: "**.calculation_started_at"
    deviation: D-24
    reason: no markRecalculated → null
  - case: create_profile_empty_body
    where: "**.calculation_completed_at"
    deviation: D-24
    reason: no markRecalculated → null
  - case: create_profile_empty_body
    where: "**.calculation_version"
    deviation: D-24
    reason: no markRecalculated → 0

  # D-33 (task B-N1-12, security audit L3): the export also carries the Go-only consents, support reports
  # and notification settings (Laravel has none of these tables).
  - case: "export*"
    where: data.consents
    deviation: D-33
    reason: Go-only user_consents rows in the data export
  - case: "export*"
    where: data.support_reports
    deviation: D-33
    reason: Go-only support reports (no file path) in the data export
  - case: "export*"
    where: data.notification_settings
    deviation: D-33
    reason: Go-only notification settings in the data export
