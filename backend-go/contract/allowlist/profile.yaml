group: profile
entries:
  # D-22 (task T-M2-30): the fa BMI fallback copy says «ریتمی» instead of Laravel's Latin "Ritme".
  # Only the ar cases hit the code fallback (the fixture has fa/en message_contents rows).
  - case: "show.*.ar"
    where: data.bmi.message
    deviation: D-22
    reason: fa fallback BMI text names the app «ریتمی»; Laravel's copy has the Latin "Ritme"

  # D-24 (task T-M2-34, backend review #2): POST /profile without last_period_start no longer
  # invents a period dated today, so the profile keeps last_period_start null and no
  # recalculation runs (calculation_* stay at their defaults).
  - case: create_profile_empty_body
    where: "**.last_period_start"
    deviation: D-24
    reason: Laravel defaults last_period_start to today; Go leaves it null
  - case: create_profile_empty_body
    where: "**.calculation_status"
    deviation: D-24
    reason: no cycle field set → no markRecalculated (pending instead of completed)
  - case: create_profile_empty_body
    where: "**.calculation_started_at"
    deviation: D-24
    reason: no markRecalculated → null
  - case: create_profile_empty_body
    where: "**.calculation_completed_at"
    deviation: D-24
    reason: no markRecalculated → null
  - case: create_profile_empty_body
    where: "**.calculation_version"
    deviation: D-24
    reason: no markRecalculated → 0

  # D-33 (task B-N1-12, security audit L3): the export also carries the Go-only consents, support reports
  # and notification settings (Laravel has none of these tables).
  - case: "export*"
    where: data.consents
    deviation: D-33
    reason: Go-only user_consents rows in the data export
  - case: "export*"
    where: data.support_reports
    deviation: D-33
    reason: Go-only support reports (no file path) in the data export
  - case: "export*"
    where: data.notification_settings
    deviation: D-33
    reason: Go-only notification settings in the data export

  # D-58 (task B-N6-05b, security review L5): the export also carries the Go-only AI usage rows still linked to the
  # user (ai_usage_logs, 90-day retention; no content). The consent rows (D-33 above) now carry `version` too.
  - case: "export*"
    where: data.ai_usage
    deviation: D-58
    reason: Go-only ai_usage_logs rows (counts and cost only) in the data export

  # D-34 (task B-N2-01): the export also carries the Go-only onboarding v2 / life-stage row (null when none).
  - case: "export*"
    where: data.life_profile
    deviation: D-34
    reason: Go-only user_life_profiles row in the data export

  # D-96 (user decision 2026-10-12): the export also carries the Go-only canvas health data, one key per section
  # (internal/accountexport; empty lists / null for a user without such data).
  - case: "export*"
    where: data.pelvic_floor
    deviation: D-96
    reason: Go-only pelvic floor program, sessions and bladder diary in the data export
  - case: "export*"
    where: data.contraception
    deviation: D-96
    reason: Go-only contraception method, pill pack and reminders in the data export
  - case: "export*"
    where: data.menopause
    deviation: D-96
    reason: Go-only menopause profile, daily log, hot flashes, scores and treatments in the data export
  - case: "export*"
    where: data.ivf
    deviation: D-96
    reason: Go-only IVF cycles, meds, injections, scans, two-week wait and reminders in the data export
  - case: "export*"
    where: data.condition_programs
    deviation: D-96
    reason: Go-only condition program enrolments, pain diary, PMDD and PBAC in the data export
  - case: "export*"
    where: data.loss
    deviation: D-96
    reason: Go-only loss path rows with the private note opened for the owner in the data export
  - case: "export*"
    where: data.insurance
    deviation: D-96
    reason: Go-only insurance policies, claims and questionnaires with sealed text opened for the owner in the data export
  - case: "export*"
    where: data.shop
    deviation: D-96
    reason: Go-only shop orders and addresses with buyer PII opened for the owner in the data export
  - case: "export*"
    where: data.directory
    deviation: D-96
    reason: Go-only directory bookings, reviews, reports, applications and file metadata in the data export

  # D-123 (task T-M9-27, engine v6, user OK 2026-10-21 in T-M9-01; DECISIONS.md I-01): a declared last_period_start is
  # stored as the onboarding anchor user_profiles.onboarding_last_period_start (Laravel leaves the column null) and no
  # longer as a confirmed user_profile_confirmed cycle_histories row with an assumed end, so the period history of an
  # onboarding-only user is empty.
  - case: "create_profile.*"
    where: "**.onboarding_last_period_start"
    deviation: D-123
    reason: the declared LMP is the onboarding anchor column (Laravel null)
  - case: "create_profile.*"
    step: 3
    where: data.periods
    deviation: D-123
    reason: no seed period row for the declared LMP (Laravel lists the user_profile_confirmed row)
  - case: update_cycle_fields
    where: "**.onboarding_last_period_start"
    deviation: D-123
    reason: a changed last_period_start is a new declaration → onboarding anchor column (Laravel null)
