  # D-213 (task T-M12-06, S-10/S-11): GET /profile/export and DELETE /account sit behind a named per-user limiter
  # (3/hour) and a step-up (the runner sends X-Step-Up via `step_up: true`; Laravel has neither), so Go adds the
  # X-RateLimit-* headers Laravel's unthrottled routes never send. Bodies and statuses still match the goldens.
  - case: "export.*"
    step: 1
    where: "header:x-ratelimit-limit"
    deviation: D-213
    reason: Go-only 3/hour/user throttle on the data export
  - case: "export.*"
    step: 1
    where: "header:x-ratelimit-remaining"
    deviation: D-213
    reason: Go-only 3/hour/user throttle on the data export
  - case: "destroy_account*"
    step: 1
    where: "header:x-ratelimit-limit"
    deviation: D-213
    reason: Go-only 3/hour/user throttle on account deletion
  - case: "destroy_account*"
    step: 1
    where: "header:x-ratelimit-remaining"
    deviation: D-213
    reason: Go-only 3/hour/user throttle on account deletion
