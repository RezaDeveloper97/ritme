# City services (/api/v1/city-services/*) — Go only (bloom B-N10-05, deviations.md D-92): there is no Laravel route, so
# these goldens were recorded from the Go server and reviewed by hand (new-endpoint skill, step 8).
# CB-DIR-02 (mother & child directory): options / listings / listing / slots are public, IP-throttled (X-RateLimit-*
# headers, hence `reset: true` so every case starts from an empty Redis keyspace) and gained the directory params and
# fields. Fixture (dump.sql): city tehran (1); listings 1 Abpari pool (online, verified, hours, services, slots), 2
# Ghoncheh class (request, no hours), 3 Taab-Taab playhouse (phone, open every day), 4 a DRAFT playhouse (never
# public), 5 a bloom-era link-mode pool with no directory data; slots of listing 1: one past, one closed, one of an
# inactive service, one full. The clock is pinned at 2026-09-23 10:00 Tehran (a Wednesday = weekly_hours day 4).
# The booking life cycle, IDOR, reviews and the privacy rules are covered by internal/http/city_services_int_test.go
# and internal/cityservices/admin_int_test.go.
# CB-DIR-03 (directory bookings on bloom's booking routes): the fixture's `engaged` persona (1018) has a COMPLETED
# booking 1 (DNE23456, Water intro) and a CONFIRMED booking 2 (CNF23456) on slot 1 = today 17:00, i.e. inside Abpari's
# 24 h free-cancellation window. `regular` (1004) has no booking or child, so the slot flow creates a child first.
# The overbooking race, the seat release on reject and every-route IDOR live in
# internal/http/directory_bookings_int_test.go. Booking codes are random (pattern).
# Case format: backend-go/cmd/contract/cases.go (StepSpec / CaseSpec doc comments).
group: city-services
defaults:
  persona: regular
  locales: none
  patterns:
    data.booking.code: '^[2-9A-HJ-NP-Z]{8}$'
    data.bookings.*.code: '^[2-9A-HJ-NP-Z]{8}$'
cases:
  - name: options
    doc: Tehran; only the categories with a published listing (class, pool, playhouse); amenities, place age ranges, sorts
    locales: [none, en]
    reset: true
    method: GET
    path: /api/v1/city-services/options
    status: 200
  - name: options_anon
    doc: Public since CB-DIR-02 (browse without login)
    persona: anon
    reset: true
    method: GET
    path: /api/v1/city-services/options
    status: 200
  - name: listings_empty
    reset: true
    method: GET
    path: /api/v1/city-services/listings
    query: {category: music_art}
    status: 200
  - name: listings_all
    doc: Default rank without position or age = smoothed rating; the draft never shows
    persona: anon
    reset: true
    method: GET
    path: /api/v1/city-services/listings
    status: 200
  - name: listings_pool
    doc: bloom's city + category filter keeps working
    reset: true
    method: GET
    path: /api/v1/city-services/listings
    query: {city: "1", category: pool}
    status: 200
  - name: listings_near
    doc: Distance sort within 5 km of Vanak; the pool without a pin is out of the radius
    persona: anon
    locales: [en]
    reset: true
    method: GET
    path: /api/v1/city-services/listings
    query: {lat: "35.7576", lng: "51.4099", radius_km: "5", sort: distance}
    status: 200
  - name: listings_filtered
    doc: 14-month-old, open now, female instructor → Abpari only (Ghoncheh has no weekly hours)
    persona: anon
    reset: true
    method: GET
    path: /api/v1/city-services/listings
    query: {age_months: "14", open_now: "1", amenities: female_instructor, lat: "35.7576", lng: "51.4099"}
    status: 200
  - name: listings_bbox
    doc: Map viewport around Vanak / Jordan
    persona: anon
    reset: true
    method: GET
    path: /api/v1/city-services/listings
    query: {bbox: "51.40,35.75,51.42,35.78", per_page: "50"}
    status: 200
  - name: listings_q
    persona: anon
    reset: true
    method: GET
    path: /api/v1/city-services/listings
    query: {q: pool}
    status: 200
  - name: listings_bad_city
    reset: true
    method: GET
    path: /api/v1/city-services/listings
    query: {city: abc}
    status: 422
  - name: listings_bad_bbox
    persona: anon
    reset: true
    method: GET
    path: /api/v1/city-services/listings
    query: {bbox: "51.42,35.75,51.40"}
    status: 422
  - name: listings_bad_amenity
    persona: anon
    reset: true
    method: GET
    path: /api/v1/city-services/listings
    query: {amenities: "sauna"}
    status: 422
  - name: listings_radius_without_point
    persona: anon
    reset: true
    method: GET
    path: /api/v1/city-services/listings
    query: {radius_km: "5"}
    status: 422
  - name: listing_place
    doc: The place page — services (the inactive one hidden), next slots (past / closed / inactive-service ones hidden), reviews summary
    persona: anon
    locales: [none, en]
    reset: true
    method: GET
    path: /api/v1/city-services/listings/1
    query: {lat: "35.7700", lng: "51.4200"}
    status: 200
  - name: listing_legacy
    doc: A bloom-era link-mode row renders with empty directory fields
    reset: true
    method: GET
    path: /api/v1/city-services/listings/5
    status: 200
  - name: listing_draft
    persona: anon
    reset: true
    method: GET
    path: /api/v1/city-services/listings/4
    status: 404
  - name: listing_missing
    reset: true
    method: GET
    path: /api/v1/city-services/listings/999
    status: 404
  - name: slots
    persona: anon
    reset: true
    method: GET
    path: /api/v1/city-services/listings/1/slots
    status: 200
  - name: slots_service
    persona: anon
    reset: true
    method: GET
    path: /api/v1/city-services/listings/1/slots
    query: {service_id: "2", from: "2026-09-24", days: "2"}
    status: 200
  - name: slots_foreign_service
    doc: A service of another place is a field error
    persona: anon
    reset: true
    method: GET
    path: /api/v1/city-services/listings/1/slots
    query: {service_id: "6"}
    status: 422
  - name: slots_draft
    persona: anon
    reset: true
    method: GET
    path: /api/v1/city-services/listings/4/slots
    status: 404
  - name: bookings_empty
    method: GET
    path: /api/v1/city-services/bookings
    status: 200
  - name: bookings_anon
    persona: anon
    method: GET
    path: /api/v1/city-services/bookings
    status: 401
  - name: booking_invalid
    doc: Missing fields and an unknown listing are 422 with the field bag
    method: POST
    path: /api/v1/city-services/bookings
    body: {listing_id: 999, contact_name: "", contact_phone: "abc", preferred_date: "2020-01-01", child_age_range: "has asthma"}
    status: 422
  - name: cancel_missing
    method: POST
    path: /api/v1/city-services/bookings/999/cancel
    status: 404

  # --- CB-DIR-03: booking requests, my bookings, cancel window, reschedule, reviews, reports ---
  - name: bookings_upcoming
    doc: «پیش رو» — the confirmed slot booking with its code, service, slot, price snapshot and cancel window (passed)
    persona: engaged
    locales: [none, en]
    method: GET
    path: /api/v1/city-services/bookings
    query: {scope: upcoming}
    status: 200
  - name: bookings_past
    doc: «گذشته» — the completed booking, reviewable
    persona: engaged
    method: GET
    path: /api/v1/city-services/bookings
    query: {scope: past}
    status: 200
  - name: bookings_bad_scope
    method: GET
    path: /api/v1/city-services/bookings
    query: {scope: all}
    status: 422
  - name: booking_show
    doc: Dir_Booked
    persona: engaged
    locales: [none, en]
    method: GET
    path: /api/v1/city-services/bookings/2
    status: 200
  - name: booking_show_foreign
    doc: Someone else's booking is a 404 (owner-scoped)
    method: GET
    path: /api/v1/city-services/bookings/2
    status: 404
  - name: booking_show_anon
    persona: anon
    method: GET
    path: /api/v1/city-services/bookings/2
    status: 401
  - name: cancel_window_passed
    doc: Confirmed, slot at 17:00 today, cancel free until 24 h before → 422
    persona: engaged
    locales: [none, en]
    method: POST
    path: /api/v1/city-services/bookings/2/cancel
    status: 422
  - name: booking_online_needs_slot
    doc: An online place takes a slot, not a free day
    method: POST
    path: /api/v1/city-services/bookings
    body: {listing_id: 1, preferred_date: "2026-09-24"}
    status: 422
  - name: booking_full_slot
    method: POST
    path: /api/v1/city-services/bookings
    body: {listing_id: 1, slot_id: 2}
    status: 422
  - name: booking_slot_flow
    doc: Dir_Book → Dir_Booked → Dir_MyBookings — a 14-month-old on Water intro today 17:00 (contact from the account), the full slot refused for a reschedule, then cancelled (still requested, before the start)
    locales: [none, en]
    steps:
      - method: POST
        path: /api/v1/children
        body: {name: Arian, birth_date: "2025-07-20", sex: boy}
        status: 201
        capture: {cid: data.id}
      - method: POST
        path: /api/v1/city-services/bookings
        body: {listing_id: 1, slot_id: 1, child_id: "{{cid}}", note: "First time in the water"}
        status: 201
        capture: {bid: data.booking.id}
      - method: GET
        path: /api/v1/city-services/bookings
        query: {scope: upcoming}
        status: 200
      - method: POST
        path: "/api/v1/city-services/bookings/{{bid}}/reschedule"
        body: {slot_id: 2}
        status: 422
      - method: POST
        path: "/api/v1/city-services/bookings/{{bid}}/cancel"
        status: 200
  - name: booking_foreign_child
    doc: A child id that is not hers reads as not found
    method: POST
    path: /api/v1/city-services/bookings
    body: {listing_id: 1, slot_id: 1, child_id: 999}
    status: 422
  - name: review_flow
    doc: One pending (moderated) review per completed booking
    persona: engaged
    locales: [none, en]
    steps:
      - method: POST
        path: /api/v1/city-services/bookings/1/review
        body: {rating: 5, score_cleanliness: 5, score_instructor: 4, score_amenities: 4, body: "Warm water and a kind instructor."}
        status: 201
      - method: POST
        path: /api/v1/city-services/bookings/1/review
        body: {rating: 4}
        status: 422
  - name: review_not_completed
    persona: engaged
    method: POST
    path: /api/v1/city-services/bookings/2/review
    body: {rating: 5}
    status: 422
  - name: review_invalid
    persona: engaged
    locales: [fa, en]
    method: POST
    path: /api/v1/city-services/bookings/1/review
    body: {rating: 9, score_instructor: 0}
    status: 422
  - name: review_foreign
    method: POST
    path: /api/v1/city-services/bookings/1/review
    body: {rating: 1}
    status: 404
  - name: report
    doc: «گزارش اطلاعات نادرست»; a second open report is refused
    locales: [none, en]
    steps:
      - method: POST
        path: /api/v1/city-services/listings/2/report
        body: {reason: closed, note: "Closed since the summer"}
        status: 201
      - method: POST
        path: /api/v1/city-services/listings/2/report
        body: {reason: other}
        status: 422
  - name: report_invalid
    locales: [fa, en]
    method: POST
    path: /api/v1/city-services/listings/2/report
    body: {reason: spam}
    status: 422
  - name: report_draft
    method: POST
    path: /api/v1/city-services/listings/4/report
    body: {reason: closed}
    status: 404
  - name: report_anon
    persona: anon
    method: POST
    path: /api/v1/city-services/listings/2/report
    body: {reason: closed}
    status: 401
