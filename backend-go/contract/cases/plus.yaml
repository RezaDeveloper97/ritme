# Ritme Plus (/api/v1/plus/*) — Go only (B-N2-04, deviations D-35): there is no Laravel route, so these goldens were
# recorded from the Go server and reviewed by hand (new-endpoint skill, step 8). The fixture dump carries the seven
# empty plus_* tables plus the three seed plans (goose 00015 / Laravel 2026_10_01_000006), added by hand — the DDL a
# full re-record reproduces. The contract server runs with APP_ENV=contract → PAYMENT_PROVIDER defaults to the
# internal/payments fake (B-N2-05: TEST page at /api/v1/payments/fake/pay/{authority}, state in Redis; verify asks the
# fake, not the posted status) and the default config (VAT 1000 bps, 7-day trial, 30-minute invoice reservation,
# return page http://localhost:3000/plus/return). Paying = POSTing the TEST page's form (decision=success|fail).
# Invoice references are random (80 bits), so they and everything derived from them (authority, bank ref,
# redirect URL) are pattern-checked and passed between steps with capture.
# Races (double trial, concurrent verify, discount limits), amount tampering, replayed bank references, IDOR and
# provider errors are covered by internal/plus/plus_int_test.go; entitlement rules and pricing by its unit tests.
# Case format: backend-go/cmd/contract/cases.go (StepSpec / CaseSpec doc comments).
group: plus
defaults:
  persona: no_profile
  locales: [none, en]
  patterns:
    data.invoice.reference: '^RP[A-Z2-7]{16}$'
    "data[*].reference": '^RP[A-Z2-7]{16}$'
    data.payment.authority: '^FAKE-RP[A-Z2-7]{16}$'
    data.invoice.receipt.ref_id: '^FAKE-REF-RP[A-Z2-7]{16}$'
    "data[*].receipt.ref_id": '^FAKE-REF-RP[A-Z2-7]{16}$'
    data.payment.redirect_url: '^http://127\.0\.0\.1:8090/api/v1/payments/fake/pay/FAKE-RP[A-Z2-7]{16}$'
cases:
  - name: plans_public
    doc: Public plan list — seeded 1/3/6-month plans with per-month price, savings and the highlighted badge
    persona: anon
    locales: [none, en, fa]
    method: GET
    path: /api/v1/plus/plans
    status: 200

  - name: status_new_user
    doc: Never trialled, never subscribed → free, trial available, Plus features locked, free assistant quota 5
    method: GET
    path: /api/v1/plus/status
    status: 200
  - name: status_anon
    persona: anon
    locales: none
    method: GET
    path: /api/v1/plus/status
    status: 401
  - name: usage_new_user
    locales: none
    method: GET
    path: /api/v1/plus/usage
    status: 200
  - name: history_empty
    locales: none
    method: GET
    path: /api/v1/plus/history
    status: 200

  - name: trial_flow
    doc: Start the trial → Plus quotas; a second start is refused; one week later it is over
    steps:
      - method: POST
        path: /api/v1/plus/trial/start
        status: 200
      - method: POST
        path: /api/v1/plus/trial/start
        status: 422
      - method: GET
        path: /api/v1/plus/usage
        status: 200
      - method: GET
        path: /api/v1/plus/status
        now: "2026-09-30T10:00:00+03:30"
        status: 200
  - name: trial_anon
    persona: anon
    locales: none
    method: POST
    path: /api/v1/plus/trial/start
    status: 401

  # B-N2-06: the trial offer (admin percent, seeded 50 in plus_settings), the trial sheet and checkout pricing.
  - name: trial_sheet_new_user
    doc: No trial yet → no offer, list-price plans (offer_price null), this month's (empty) usage lines
    method: GET
    path: /api/v1/plus/trial
    status: 200
  - name: trial_sheet_anon
    persona: anon
    locales: none
    method: GET
    path: /api/v1/plus/trial
    status: 401
  - name: trial_offer_flow
    doc: Start the trial → status carries the offer → trial sheet with countdown and half prices → checkout preview applies 50 % server-side → at the trial end the offer is gone and checkout is list price
    steps:
      - method: POST
        path: /api/v1/plus/trial/start
        status: 200
      - method: GET
        path: /api/v1/plus/trial
        now: "2026-09-25T19:38:00+03:30"
        status: 200
      - method: POST
        path: /api/v1/plus/checkout
        now: "2026-09-25T19:38:00+03:30"
        body: {plan_id: 2, preview: true}
        status: 200
      - method: GET
        path: /api/v1/plus/status
        now: "2026-09-30T10:00:00+03:30"
        status: 200
      - method: POST
        path: /api/v1/plus/checkout
        now: "2026-09-30T10:00:00+03:30"
        body: {plan_id: 2, preview: true}
        status: 200

  - name: checkout_preview
    doc: Price the 3-month plan (VAT 10 % on 2,370,000 rials); nothing is written
    method: POST
    path: /api/v1/plus/checkout
    body: {plan_id: 2, preview: true}
    status: 200
  - name: checkout_invalid
    doc: Missing plan, unknown plan, unknown discount code
    locales: [none, en, fa]
    steps:
      - method: POST
        path: /api/v1/plus/checkout
        body: {}
        status: 422
      - method: POST
        path: /api/v1/plus/checkout
        body: {plan_id: 99}
        status: 422
      - method: POST
        path: /api/v1/plus/checkout
        body: {plan_id: 1, discount_code: NOPE, preview: true}
        status: 422

  - name: purchase_flow
    doc: Checkout (client amounts ignored) → pay on the fake TEST page → return hop → verify → idempotent replay → history → cancel
    locales: none
    steps:
      - method: POST
        path: /api/v1/plus/checkout
        body: {plan_id: 2, total: 1}
        status: 200
        capture: {ref: data.invoice.reference, auth: data.payment.authority}
      - method: GET
        path: "/api/v1/payments/fake/pay/{{auth}}"
        status: 200
        ignore_body: true
      - method: POST
        path: "/api/v1/payments/fake/pay/{{auth}}"
        raw_body: decision=success
        content_type: application/x-www-form-urlencoded
        status: 303
        ignore_body: true
        ignore: ["header:location"]
      - method: GET
        path: /api/v1/payments/fake/return
        query: {reference: "{{ref}}", authority: "{{auth}}", status: OK, next: "https://evil.example/plus/return"}
        status: 303
        ignore_body: true
        ignore: ["header:location"]
      - method: POST
        path: /api/v1/plus/verify
        now: "2026-09-23T10:05:00+03:30"
        body: {reference: "{{ref}}", authority: "{{auth}}", status: OK}
        status: 200
      - method: POST
        path: /api/v1/plus/verify
        now: "2026-09-23T10:06:00+03:30"
        body: {reference: "{{ref}}", authority: "{{auth}}", status: OK}
        status: 200
      - method: GET
        path: /api/v1/plus/history
        status: 200
      - method: POST
        path: /api/v1/plus/cancel
        now: "2026-09-23T10:06:00+03:30"
        status: 200
      - method: GET
        path: /api/v1/plus/status
        now: "2026-12-23T10:05:00+03:30"
        status: 200

  - name: payment_declined
    doc: The user cancelled on the TEST page → payment_failed even when the client posts status OK; the invoice is closed
    locales: [none, en]
    steps:
      - method: POST
        path: /api/v1/plus/checkout
        body: {plan_id: 1}
        status: 200
        capture: {ref: data.invoice.reference, auth: data.payment.authority}
      - method: POST
        path: "/api/v1/payments/fake/pay/{{auth}}"
        raw_body: decision=fail
        content_type: application/x-www-form-urlencoded
        status: 303
        ignore_body: true
        ignore: ["header:location"]
      - method: POST
        path: /api/v1/plus/verify
        body: {reference: "{{ref}}", authority: "{{auth}}", status: NOK}
        status: 422
      - method: POST
        path: /api/v1/plus/verify
        body: {reference: "{{ref}}", authority: "{{auth}}", status: OK}
        status: 422

  - name: verify_unknown
    doc: Another user's or a made-up reference → 404 (no existence leak)
    locales: none
    method: POST
    path: /api/v1/plus/verify
    body: {reference: RPAAAAAAAAAAAAAAAA, authority: FAKE-RPAAAAAAAAAAAAAAAA, status: OK}
    status: 404
  - name: verify_invalid
    locales: [none, fa]
    method: POST
    path: /api/v1/plus/verify
    body: {}
    status: 422

  - name: cancel_without_subscription
    locales: [none, en]
    method: POST
    path: /api/v1/plus/cancel
    status: 422
  - name: restore_nothing
    locales: none
    method: POST
    path: /api/v1/plus/restore
    status: 200
