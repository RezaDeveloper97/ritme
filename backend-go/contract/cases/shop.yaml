# Shop catalog (/api/v1/shop/*) — Go only (bloom B-N10-03, deviations.md D-91): there is no Laravel route, so these
# goldens were recorded from the Go server and reviewed by hand (new-endpoint skill, step 8).
# The fixture has the two seeded categories and no products (products are admin data). Product lists with rows, the
# link-out URL with utm_source, click counting without a user id, teen exclusion and the admin CRUD are covered by
# internal/http/shop_int_test.go and internal/shop/admin_int_test.go.
# Case format: backend-go/cmd/contract/cases.go (StepSpec / CaseSpec doc comments).
group: shop
defaults:
  persona: regular
  locales: none
cases:
  - name: categories
    doc: The two seeded categories in display order, localized title, no products yet
    locales: [none, en]
    method: GET
    path: /api/v1/shop/categories
    status: 200
  - name: categories_anon
    persona: anon
    method: GET
    path: /api/v1/shop/categories
    status: 401
  - name: products_empty
    doc: A category without products lists []
    method: GET
    path: /api/v1/shop/products
    query: {category: layette}
    status: 200
  - name: products_unknown_category
    method: GET
    path: /api/v1/shop/products
    query: {category: nope}
    status: 404
  - name: product_missing
    method: GET
    path: /api/v1/shop/products/999
    status: 404
  - name: click_missing
    method: POST
    path: /api/v1/shop/products/999/click
    status: 404
  # CB-SHOP-02: the internal catalog (/api/v1/shop/catalog/*). The fixture (dump.sql, 00080 tables) has two sellers,
  # sub-categories baby-clothes (layette) and skin-care (beauty), three products with variants and two published
  # reviews plus one pending. Teen 403, inactive sellers, link-out exclusion and bought-together from orders are covered
  # by internal/http/shop_catalog_int_test.go (no teen persona in the fixture).
  - name: catalog_home
    doc: Layette home — roots, sub-categories with counts, best-seller sections
    locales: [none, en]
    method: GET
    path: /api/v1/shop/catalog/home
    status: 200
  - name: catalog_home_beauty
    method: GET
    path: /api/v1/shop/catalog/home
    query: {root: beauty}
    status: 200
  - name: catalog_home_sub_category
    doc: A sub-category is not a home
    method: GET
    path: /api/v1/shop/catalog/home
    query: {root: baby-clothes}
    status: 404
  - name: catalog_home_anon
    persona: anon
    method: GET
    path: /api/v1/shop/catalog/home
    status: 401
  - name: catalog_products
    doc: Layette subtree with filter choices (sizes, colors, materials, price range), popular first
    locales: [none, en]
    method: GET
    path: /api/v1/shop/catalog/products
    query: {category: layette}
    status: 200
  - name: catalog_products_filtered
    doc: Size filter by default-language value plus price sort
    method: GET
    path: /api/v1/shop/catalog/products
    query: {category: baby-clothes, size: "۳ تا ۶ ماه", sort: price_asc}
    status: 200
  - name: catalog_products_skin_type
    method: GET
    path: /api/v1/shop/catalog/products
    query: {skin_type: oily}
    status: 200
  - name: catalog_products_unknown_category
    method: GET
    path: /api/v1/shop/catalog/products
    query: {category: nope}
    status: 404
  - name: catalog_product
    doc: Detail — variants with stock, seller terms, attributes, latest published reviews, bought-together
    locales: [none, en]
    method: GET
    path: /api/v1/shop/catalog/products/1
    status: 200
  - name: catalog_product_beauty
    doc: Beauty detail — IRC code, expiry, skin types, volume variant
    method: GET
    path: /api/v1/shop/catalog/products/3
    status: 200
  - name: catalog_product_missing
    method: GET
    path: /api/v1/shop/catalog/products/999
    status: 404
  - name: catalog_reviews
    method: GET
    path: /api/v1/shop/catalog/products/1/reviews
    query: {per_page: '1'}
    status: 200
  - name: catalog_reviews_missing
    method: GET
    path: /api/v1/shop/catalog/products/999/reviews
    status: 404
  # CB-SHOP-03: cart, discount code, addresses, COD checkout, orders, cancel (/api/v1/shop/{cart,addresses,checkout,
  # orders,returns}). Fixture (dump.sql, 00087): code WELCOME10 (10 %, cap 50 000, min 200 000, once per user), address
  # 1 of the regular persona (1004), slot 1 (panbe, 2026-09-26 17–21, capacity 10) and slot 2 (banoo, 2026-09-24 9–13).
  # The order code is random (8 digits, checked by pattern). Stock / slot races, idempotent double-taps, returns after
  # delivery, the checklist link and the teen 403 are covered by internal/http/shop_order_int_test.go.
  - name: cart_empty
    method: GET
    path: /api/v1/shop/cart
    status: 200
  - name: cart_anon
    persona: anon
    method: GET
    path: /api/v1/shop/cart
    status: 401
  - name: cart_and_checkout
    doc: Two sellers, the discount code, then the checkout review (addresses, per-seller fee + slots, COD only)
    locales: [none, en]
    steps:
      - {method: POST, path: /api/v1/shop/cart/items, body: {variant_id: 2, quantity: 1}, status: 200}
      - {method: POST, path: /api/v1/shop/cart/items, body: {variant_id: 3}, status: 200}
      - {method: POST, path: /api/v1/shop/cart/items, body: {variant_id: 4, quantity: 1}, status: 200}
      - {method: PUT, path: /api/v1/shop/cart/items/4, body: {quantity: 2}, status: 200}
      - {method: PUT, path: /api/v1/shop/cart/discount, body: {code: welcome10}, status: 200}
      - {method: GET, path: /api/v1/shop/checkout, status: 200}
  - name: cart_refusals
    doc: Out of stock (variant 1 has none), over the line limit, unknown code, a line not in the cart
    steps:
      - {method: POST, path: /api/v1/shop/cart/items, body: {variant_id: 1}, status: 422}
      - {method: POST, path: /api/v1/shop/cart/items, body: {variant_id: 2, quantity: 11}, status: 422}
      - {method: POST, path: /api/v1/shop/cart/items, body: {variant_id: 999}, status: 422}
      - {method: PUT, path: /api/v1/shop/cart/discount, body: {code: NOPE}, status: 422}
      - {method: DELETE, path: /api/v1/shop/cart/items/3, status: 404}
  - name: addresses
    doc: List, add (Persian digits folded), validation failure
    steps:
      - {method: GET, path: /api/v1/shop/addresses, status: 200}
      - {method: POST, path: /api/v1/shop/addresses, body: {label: Work, recipient_name: Regular, recipient_phone: "۰۹۱۲ ۱۲۳ ۴۵۶۷", city: Tehran, address_line: "Enghelab St, No. 9", is_default: true}, status: 201}
      - {method: POST, path: /api/v1/shop/addresses, body: {recipient_name: Regular, recipient_phone: "123", city: Tehran}, status: 422}
      - {method: GET, path: /api/v1/shop/addresses, status: 200}
  - name: address_foreign
    doc: Another user's address is a 404, and cannot be ordered to
    persona: irregular
    steps:
      - {method: PUT, path: /api/v1/shop/addresses/1, body: {recipient_name: X, recipient_phone: "09120000000", city: X, address_line: X}, status: 404}
      - {method: DELETE, path: /api/v1/shop/addresses/1, status: 404}
      - {method: POST, path: /api/v1/shop/cart/items, body: {variant_id: 2}, status: 200}
      - {method: POST, path: /api/v1/shop/orders, body: {idempotency_key: irregular-0001, address_id: 1, payment_method: cod}, status: 422}
  - name: place_order
    doc: COD order with slots and plain packaging; the same key replays (200); list, detail, cancel
    patterns:
      data.order.code: '^[0-9]{8}$'
      data.orders[*].code: '^[0-9]{8}$'
    steps:
      - {method: POST, path: /api/v1/shop/cart/items, body: {variant_id: 2, quantity: 1}, status: 200}
      - {method: POST, path: /api/v1/shop/cart/items, body: {variant_id: 4, quantity: 1}, status: 200}
      - {method: POST, path: /api/v1/shop/orders, body: {idempotency_key: regular-order-1, address_id: 1, payment_method: online}, status: 422}
      - method: POST
        path: /api/v1/shop/orders
        body: {idempotency_key: regular-order-1, address_id: 1, payment_method: cod, discreet: true, slots: [{seller_id: 1, slot_id: 1}, {seller_id: 2, slot_id: 2}]}
        status: 201
        capture: {order: data.order.id}
      - method: POST
        path: /api/v1/shop/orders
        body: {idempotency_key: regular-order-1, address_id: 1, payment_method: cod, discreet: true, slots: [{seller_id: 1, slot_id: 1}, {seller_id: 2, slot_id: 2}]}
        status: 200
      - {method: GET, path: /api/v1/shop/orders, status: 200}
      - {method: GET, path: "/api/v1/shop/orders/{{order}}", status: 200}
      - {method: POST, path: "/api/v1/shop/orders/{{order}}/cancel", status: 200}
      - {method: POST, path: "/api/v1/shop/orders/{{order}}/cancel", status: 422}
  - name: order_missing
    method: GET
    path: /api/v1/shop/orders/999
    status: 404
  - name: returns_empty
    method: GET
    path: /api/v1/shop/returns
    status: 200
