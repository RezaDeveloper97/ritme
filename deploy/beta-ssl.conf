## beta.ritme.app + beta-admin.ritme.app — the public beta stack (compose project `ritme-beta`, /opt/ritme-beta).
## Mounted as conf.d/zz-beta.conf when BETA_CONF=./deploy/beta-ssl.conf (deploy-beta.sh sets it).
##
## ArvanCloud sits in front of beta.ritme.app and terminates the public TLS; it reaches this origin on :443.
## Until deploy/enable-https-beta.sh has issued each host's own certificate, ssl/beta-*.pem and ssl/beta-admin-*.pem
## are copies of production's certificate (deploy-beta.sh puts them there) — they only secure the CDN → origin hop.
##
## No upstream{} blocks on purpose: every beta target is resolved at REQUEST time (variables + Docker DNS in
## vhost-beta.inc), so the shared production proxy keeps passing `nginx -t` even while the beta stack is down.

# The real client IP (T-M12-02): each beta server block includes cdn-real-ip.inc (via vhost-beta*.inc), which turns
# $remote_addr into the client ONLY for requests that really came through an ArvanCloud edge. The old
# "rightmost X-Forwarded-For" map is gone: a request straight to this origin could write that entry itself.

server {
    listen 80;
    server_name beta.ritme.app;
    include /etc/nginx/conf.d/acme.inc;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name beta.ritme.app;
    ssl_certificate     /etc/nginx/ssl/beta-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/beta-privkey.pem;

    # ArvanCloud may redirect the HTTP-01 challenge to https before it reaches us.
    include /etc/nginx/conf.d/acme.inc;
    include /etc/nginx/conf.d/vhost-beta.inc;
}

# The admin panel host (admin-web at `/`, admin API on Go) — deploy/vhost-beta-admin.inc.
server {
    listen 80;
    server_name beta-admin.ritme.app;
    include /etc/nginx/conf.d/acme.inc;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name beta-admin.ritme.app;
    ssl_certificate     /etc/nginx/ssl/beta-admin-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/beta-admin-privkey.pem;

    include /etc/nginx/conf.d/acme.inc;
    include /etc/nginx/conf.d/vhost-beta-admin.inc;
}
