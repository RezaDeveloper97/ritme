## instructor.ritme.app on :80 only — the pre-certificate state (serves the ACME
## challenge). Selected by INSTRUCTOR_CONF in the server's compose env file;
## deploy/enable-https-instructor.sh prod then switches it to instructor-ssl.conf.
server {
    listen 80;
    server_name instructor.ritme.app;
    include /etc/nginx/conf.d/acme.inc;
    include /etc/nginx/conf.d/vhost-instructor.inc;
}
