## instructor.ritme.app over HTTPS — its own certificate (ssl/instructor-*.pem), so
## prod's SAN certificate (api/adpanell/web) is never re-issued for it.
server {
    listen 80;
    server_name instructor.ritme.app;
    include /etc/nginx/conf.d/acme.inc;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name instructor.ritme.app;
    ssl_certificate     /etc/nginx/ssl/instructor-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/instructor-privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/conf.d/vhost-instructor.inc;
}
