## instructor.ritmeapp.ir on :80 only — the pre-certificate state (serves the ACME
## challenge). Selected by INSTRUCTOR_STAGE_CONF in the server's compose env file;
## deploy/enable-https-instructor.sh stage then switches it to instructor-stage-ssl.conf.
server {
    listen 80;
    server_name instructor.ritmeapp.ir;
    include /etc/nginx/conf.d/acme.inc;
    include /etc/nginx/conf.d/vhost-instructor-stage.inc;
}
