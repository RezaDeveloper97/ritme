## instructor.ritmeapp.ir over HTTPS — its own certificate (ssl/instructor-stage-*.pem),
## issued by deploy/enable-https-instructor.sh stage.
server {
    listen 80;
    server_name instructor.ritmeapp.ir;
    include /etc/nginx/conf.d/acme.inc;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name instructor.ritmeapp.ir;
    ssl_certificate     /etc/nginx/ssl/instructor-stage-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/instructor-stage-privkey.pem;
    include /etc/nginx/conf.d/vhost-instructor-stage.inc;
}
