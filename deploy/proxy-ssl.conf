## HTTPS variant of proxy.conf — activated by deploy/enable-https.sh once
## certbot has issued certificates for the three hostnames.
##
## Certs are COPIED (not symlinked) into /opt/ritme/ssl by the certbot deploy
## hook, because the container cannot follow /etc/letsencrypt/live's symlinks.
## All three hostnames share one certificate (SAN), issued together.

## Pinned to the containers' unique names (not the "backend"/"frontend"
## service aliases) because the proxy container is also attached to the
## shared `ritme-edge` network for staging, and staging's compose services
## are literally also named "backend"/"frontend" — Docker's embedded DNS
## can resolve those bare aliases to the STAGE containers instead of these,
## silently routing all production traffic to staging. See incident 2026-08-31.
upstream backend_upstream  { server ritme-backend-1:80; }
upstream frontend_upstream { server ritme-frontend-1:3000; }

# ── Strangler route groups (deploy/go-routes.inc, api.ritme.app) ───────────
# One upstream per group, same pinning rule: Laravel = ritme-backend-1:80,
# Go = ritme-backend-go-1:80 (pinned container names, never `backend-go`).
# All on Laravel until T-M2-26. MANAGED BY deploy/switch-go-route.sh
#   deploy/switch-go-route.sh prod <group> on|off
upstream prod_route_content   { server ritme-backend-1:80; }
upstream prod_route_reminders { server ritme-backend-1:80; }
upstream prod_route_healthlog { server ritme-backend-1:80; }
upstream prod_route_profile   { server ritme-backend-1:80; }
upstream prod_route_pregnancy { server ritme-backend-1:80; }
upstream prod_route_cycle     { server ritme-backend-1:80; }
upstream prod_route_messages  { server ritme-backend-1:80; }
upstream prod_route_home      { server ritme-backend-1:80; }
upstream prod_route_auth      { server ritme-backend-1:80; }

ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_prefer_server_ciphers off;

# ── :80 — ACME plus a redirect to https ─────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/conf.d/acme.inc;
    # Unknown hostname / bare IP: nothing to redirect to.
    location / { return 444; }
}

server {
    listen 80;
    server_name api.ritme.app adpanell.ritme.app web.ritme.app;
    include /etc/nginx/conf.d/acme.inc;
    location / { return 301 https://$host$request_uri; }
}

# ── :443 ────────────────────────────────────────────────────────────────────
# A TLS default_server is required so an unknown SNI doesn't fall through to
# whichever block happens to be first.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.ritme.app;
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # HTTPS only from here on (pwa-audit H-4). Deliberately no includeSubDomains
    # and no preload: both are hard to undo. Server-level, so it reaches every
    # response unless a location in the vhost .inc defines its own add_header.
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/conf.d/vhost-api.inc;
}

server {
    listen 443 ssl;
    http2 on;
    server_name adpanell.ritme.app;
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # HTTPS only from here on (pwa-audit H-4). Deliberately no includeSubDomains
    # and no preload: both are hard to undo. Server-level, so it reaches every
    # response unless a location in the vhost .inc defines its own add_header.
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/conf.d/vhost-admin.inc;
}

server {
    listen 443 ssl;
    http2 on;
    server_name web.ritme.app;
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # HTTPS only from here on (pwa-audit H-4). Deliberately no includeSubDomains
    # and no preload: both are hard to undo. Server-level, so it reaches every
    # response unless a location in the vhost .inc defines its own add_header.
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/conf.d/vhost-web.inc;
}
