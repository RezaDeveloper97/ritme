## nginx reverse proxy for the Ritme stack (runs as the `proxy` container).
##
## Three hostnames, three roles:
##   api.ritme.app       -> Laravel API
##   adpanell.ritme.app  -> Blade admin panel
##   web.ritme.app       -> Next.js frontend
##
## This is the HTTP-only variant, used before a certificate exists (it is what
## serves the ACME challenge that gets us one). `deploy/enable-https.sh` flips
## PROXY_CONF in the server .env over to proxy-ssl.conf.

upstream backend_upstream  { server backend:80; }
upstream frontend_upstream { server frontend:3000; }

# Requests that reach us by IP or an unknown hostname get nothing.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name api.ritme.app;
    include /etc/nginx/conf.d/acme.inc;
    include /etc/nginx/conf.d/vhost-api.inc;
}

server {
    listen 80;
    server_name adpanell.ritme.app;
    include /etc/nginx/conf.d/acme.inc;
    include /etc/nginx/conf.d/vhost-admin.inc;
}

server {
    listen 80;
    server_name web.ritme.app;
    include /etc/nginx/conf.d/acme.inc;
    include /etc/nginx/conf.d/vhost-web.inc;
}
