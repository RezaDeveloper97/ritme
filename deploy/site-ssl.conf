## betatest.ritme.app — the Laravel marketing site (compose project `ritme-site`, /opt/ritme-site).
## Mounted as conf.d/zz-site.conf when SITE_CONF=./deploy/site-ssl.conf (laravel-site/deploy-betatest.sh sets it).
##
## The upstream is resolved at REQUEST time (variable + docker DNS) — never at nginx start — so the production
## proxy keeps starting even when the site stack is down or not deployed yet.
## Pinned container name `ritme-site-app-1`, never a bare service alias (see the 2026-08-31 incident note in
## proxy-ssl.conf: bare aliases on the shared `ritme-edge` network can resolve to another project's containers).
##
## ArvanCloud sits in front of betatest.ritme.app and terminates the public TLS; it reaches this origin on :443.
## Until laravel-site/deploy/betatest/enable-https.sh has issued betatest's own certificate the block serves the
## existing production certificate (ssl/fullchain.pem); afterwards ssl/betatest-*.pem.

server {
    listen 80;
    server_name betatest.ritme.app;
    include /etc/nginx/conf.d/acme.inc;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name betatest.ritme.app;
    ssl_certificate     /etc/nginx/ssl/betatest-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/betatest-privkey.pem;

    include /etc/nginx/conf.d/acme.inc;

    # Admin media uploads go up to 15 MB; join-request forms carry several photos.
    client_max_body_size 64m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $site_upstream http://ritme-site-app-1:80;

    location / {
        proxy_pass $site_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Always https: the public scheme is decided by ArvanCloud, whatever it used to reach this origin.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
