## ritme.app / www.ritme.app — the Laravel marketing site (compose project `ritme-site`, /opt/ritme-site).
## betatest.ritme.app is the old beta hostname: still served by the same app (noindex) until the main domain is
## public, then the app 301s it to ritme.app (APP_CANONICAL_REDIRECT=true, flipped by laravel-site/deploy-betatest.sh).
## Mounted as conf.d/zz-site.conf when SITE_CONF=./deploy/site-ssl.conf (deploy-betatest.sh sets it).
##
## The upstream is resolved at REQUEST time (variable + docker DNS) — never at nginx start — so the production
## proxy keeps starting even when the site stack is down or not deployed yet.
## Pinned container name `ritme-site-app-1`, never a bare service alias (see the 2026-08-31 incident note in
## proxy-ssl.conf: bare aliases on the shared `ritme-edge` network can resolve to another project's containers).
##
## ArvanCloud sits in front of the public hostnames and terminates the public TLS; it reaches this origin on :443.
## Certificates: ssl/site-*.pem for ritme.app + www.ritme.app, ssl/betatest-*.pem for betatest.ritme.app
## (laravel-site/deploy/betatest/enable-https.sh issues them; until then a placeholder copy is served).

server {
    listen 80;
    server_name ritme.app www.ritme.app betatest.ritme.app;
    include /etc/nginx/conf.d/acme.inc;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ritme.app www.ritme.app;
    ssl_certificate     /etc/nginx/ssl/site-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/site-privkey.pem;

    include /etc/nginx/conf.d/acme.inc;
    include /etc/nginx/conf.d/zz-site-app.inc;
}

server {
    listen 443 ssl;
    http2 on;
    server_name betatest.ritme.app;
    ssl_certificate     /etc/nginx/ssl/betatest-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/betatest-privkey.pem;

    include /etc/nginx/conf.d/acme.inc;
    # The beta hostname must never be indexed, whatever robots.txt says now that the app runs in production.
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/conf.d/zz-site-app.inc;
}
