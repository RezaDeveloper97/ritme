## Staging on :80 only — the pre-certificate state. It serves the ACME
## challenge that gets us a certificate, after which enable-https-stage.sh
## swaps STAGE_CONF over to stage-ssl.conf.
##
## Loaded as conf.d/zz-stage.conf, i.e. AFTER default.conf, so the
## `listen 80 default_server` block there still owns unknown hostnames.

upstream stage_backend_upstream  { server stage-backend:80; }
upstream stage_frontend_upstream { server stage-frontend:3000; }

server {
    listen 80;
    server_name stage.ritmeapp.ir;
    include /etc/nginx/conf.d/acme.inc;
    include /etc/nginx/conf.d/vhost-stage.inc;
}
