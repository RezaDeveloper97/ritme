## Staging disabled (the default). Mounted as conf.d/zz-stage.conf when
## STAGE_CONF is unset in the server .env, so a stack with no staging
## environment carries no extra server blocks at all.
##
## deploy-stage.sh flips STAGE_CONF to ./deploy/stage-http.conf, and
## deploy/enable-https-stage.sh flips it again to ./deploy/stage-ssl.conf once
## a certificate for stage.ritmeapp.ir exists.
