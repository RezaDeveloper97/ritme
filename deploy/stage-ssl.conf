## Staging over HTTPS. Activated by deploy/enable-https-stage.sh, which sets
## STAGE_CONF=./deploy/stage-ssl.conf in the server .env.
##
## stage.ritmeapp.ir is on a DIFFERENT registrable domain than the production
## hostnames (ritmeapp.ir vs ritme.app), so it gets its OWN certificate, copied
## to ssl/stage-*.pem — prod's ssl/fullchain.pem is never touched.

upstream stage_backend_upstream  { server stage-backend:80; }
upstream stage_frontend_upstream { server stage-frontend:3000; }

# ── Strangler route groups (deploy/go-routes.inc) ──────────────────────────
# One upstream per group. MANAGED BY deploy/switch-go-route.sh — flip with
#   deploy/switch-go-route.sh stage <group> on|off
# Laravel = stage-backend:80, Go = stage-backend-go:80 (both stage-only
# aliases on ritme-edge; never a bare service name — see proxy-ssl.conf).
# A Go target makes `nginx -t` fail while the stage backend-go container is
# down, which is what the switch script's rollback relies on.
upstream stage_route_content   { server stage-backend-go:80; }
upstream stage_route_reminders { server stage-backend-go:80; }
upstream stage_route_healthlog { server stage-backend-go:80; }
upstream stage_route_profile   { server stage-backend-go:80; }
upstream stage_route_pregnancy { server stage-backend-go:80; }
upstream stage_route_cycle     { server stage-backend-go:80; }
upstream stage_route_messages  { server stage-backend-go:80; }
upstream stage_route_home      { server stage-backend-go:80; }
upstream stage_route_auth      { server stage-backend-go:80; }

server {
    listen 80;
    server_name stage.ritmeapp.ir;
    include /etc/nginx/conf.d/acme.inc;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name stage.ritmeapp.ir;
    ssl_certificate     /etc/nginx/ssl/stage-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/stage-privkey.pem;
    include /etc/nginx/conf.d/vhost-stage.inc;
}
