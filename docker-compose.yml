name: ritme

# Data safety: mysql-data / redis-data / backend-storage are named volumes.
# `docker compose build` / `up --build` / `down` never touch them — data is
# only lost with an explicit `docker compose down -v`.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ritme_salamat}
      MYSQL_USER: ${DB_USERNAME:-ritme}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # Host port 3307 so it doesn't clash with a locally installed MySQL.
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence so queued jobs / cache survive container restarts.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &backend-env
      APP_NAME: Ritme
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:?set APP_KEY in .env (echo "APP_KEY=base64:$(openssl rand -base64 32)")}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-ritme_salamat}
      DB_USERNAME: ${DB_USERNAME:-ritme}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      SMS_PROVIDER: ${SMS_PROVIDER:-kavenegar}
      SMSIR_API_KEY: ${SMSIR_API_KEY:-}
      SMSIR_TEMPLATE_ID: ${SMSIR_TEMPLATE_ID:-511293}
      SMSIR_LINE_NUMBER: ${SMSIR_LINE_NUMBER:-}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
      KAVENEGAR_TEMPLATE_LOGIN_OTP: ${KAVENEGAR_TEMPLATE_LOGIN_OTP:-1507703}
      RUN_MIGRATIONS: "true"
      # Serves the Blade admin panel at /admin on the SAME domain. The proxy
      # must route /admin -> backend (see proxy.conf). To later move the panel
      # to its own subdomain, split this into a dedicated `admin` service
      # (same image, ADMIN_PANEL_ENABLED=true, RUN_MIGRATIONS=false) and point
      # admin.<domain> at it — the /admin routes work unchanged either way.
      ADMIN_PANEL_ENABLED: ${ADMIN_PANEL_ENABLED:-true}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@ritmeapp.ir}
      # No default: an unset password must fail `compose up` rather than seed a
      # well-known credential. The seeder only creates the admin if it does not
      # already exist (firstOrCreate), so this is read once at first provision.
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:?set ADMIN_SEED_PASSWORD in .env}
      ADMIN_SEED_NAME: ${ADMIN_SEED_NAME:-مدیر ارشد}
      # Swagger UI is gated by HTTP Basic auth (see SwaggerBasicAuth). In prod
      # SWAGGER_PASSWORD must be set or the docs fail closed (401).
      SWAGGER_USER: ${SWAGGER_USER:-ritme}
      SWAGGER_PASSWORD: ${SWAGGER_PASSWORD:-}
      L5_SWAGGER_GENERATE_ALWAYS: ${L5_SWAGGER_GENERATE_ALWAYS:-false}
    volumes:
      - backend-storage:/var/www/html/storage
    ports:
      - "8080:80"

  queue:
    build: ./backend
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    depends_on:
      backend:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    volumes:
      - backend-storage:/var/www/html/storage

  # Go port of the API (milestone M2, strangler cutover — docs/go-migration/).
  # Runs BESIDE `backend` on the same MariaDB, Redis and storage volume; nginx
  # moves one route group at a time to it (deploy/go-routes.inc,
  # deploy/switch-go-route.sh). It never migrates, seeds or generates Passport
  # keys — Laravel still owns all of that until T-M2-27.
  backend-go:
    build: ./backend-go
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Laravel's entrypoint runs the migrations and creates the Passport key
      # pair on a fresh volume; Go only reads them.
      backend:
        condition: service_started
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
      HTTP_ADDR: ":80"
      STORAGE_PATH: /var/www/html/storage
      # Go's own Redis namespace: it never reads Laravel's PHP-serialized
      # cache/queue entries (ritme-cache-/ritme-database- prefixes).
      REDIS_PREFIX: "ritme-go:"
    # uid 33 = www-data in the PHP image: the Passport keys on backend-storage
    # are 0600 www-data. (The image already runs as 33; pinned here too so an
    # image change can't silently break key access.)
    user: "33:33"
    volumes:
      # Read-write: besides the Passport keys and serving /storage/* (app/public),
      # the Go admin API (T-M2-21) writes uploads (app/public), DB-edited
      # translations (app/translations) and admin-created lang files (app/lang).
      - backend-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    ports:
      - "8081:80"

  frontend:
    build:
      context: ./frontend
      args:
        # Inlined into the browser bundle at build time — must be a URL the
        # user's browser can reach (hence localhost, not the service name).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # Next.js admin app (M2, T-M2-22) — replaces the Blade panel on the admin host.
  # Internal only: nginx on adpanell proxies `/` here and `/api/admin/` to
  # backend-go (wired in T-M2-25), so the browser sees ONE origin and the
  # __Host- session cookie + CSRF work without CORS. NEXT_PUBLIC_* are build-time.
  admin-web:
    build:
      context: ./admin-web
      args:
        NEXT_PUBLIC_ADMIN_API_BASE_URL: ${NEXT_PUBLIC_ADMIN_API_BASE_URL:-/api/admin/v1}
        NEXT_PUBLIC_API_BASE_URL: ${ADMIN_WEB_PUBLIC_API_BASE_URL:-/api/v1}
        # Next basePath; empty = served at `/` (prod's own admin host). The
        # stage overlay sets `/panel` (one shared origin).
        NEXT_PUBLIC_ADMIN_BASE_PATH: ${ADMIN_WEB_BASE_PATH:-}
    restart: unless-stopped
    depends_on:
      - backend-go
    expose:
      - "3000"

volumes:
  mysql-data:
  redis-data:
  backend-storage:
