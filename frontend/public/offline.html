<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F7F3FF" />
  <meta name="color-scheme" content="light dark" />
  <title>ریتمی — آفلاین</title>
  <style>
    /* Standalone offline page: served straight from the SW cache, so it cannot
       depend on app CSS. Values mirror the Night & Bloom tokens in globals.css
       (--page, --surface, --text-1/2, --brand-fill, --on-brand). */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F7F3FF;
      color: #231B3B;
      font-family: Vazirmatn, system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 360px;
      border: 1px solid #E7E1F4;
    }
    .card img { width: 96px; height: 96px; border-radius: 24px; margin-bottom: 20px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
    p { font-size: 14px; color: #5E5873; line-height: 1.9; margin-bottom: 24px; }
    button {
      font: inherit;
      font-weight: 600;
      color: #FFFFFF;
      background: #6E54F0;
      border: 0;
      border-radius: 999px;
      padding: 12px 32px;
      cursor: pointer;
    }
    /* Dark appearance, driven by [data-theme] — written by the inline script
       below with the app's rule: a stored light/dark wins, otherwise (system,
       the default) prefers-color-scheme decides. */
    html[data-theme="dark"] body { background: #17112B; color: #F6F1FF; }
    html[data-theme="dark"] .card { background: #221A3D; border-color: #34295A; }
    html[data-theme="dark"] p { color: #B8AED6; }
    html[data-theme="dark"] button { background: #B9A6FF; color: #17112B; }
  </style>
  <script>
    // Same bootstrap as the app (shared/theme). This page is served from the
    // service-worker cache with no JS bundle, so it re-reads the preference
    // itself rather than importing anything.
    (function () {
      try {
        var s = null;
        try { s = localStorage.getItem('ritme_theme'); } catch (e) {}
        var dark = s === 'dark' || (s !== 'light' && !!window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#17112B' : '#F7F3FF');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="ریتمی" />
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>به نظر می‌رسد آفلاین هستید. لطفاً اتصال خود را بررسی کنید و دوباره تلاش کنید.</p>
    <p>اگر از VPN یا فیلترشکن استفاده می‌کنید، لطفاً آن را خاموش کنید و دوباره تلاش کنید.</p>
    <button onclick="location.reload()">تلاش دوباره</button>
  </div>
</body>
</html>
