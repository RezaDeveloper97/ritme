# Document root = public/, .htaccess fully honoured (same as the cPanel docroot layout).
<VirtualHost *:80>
    ServerName betatest.ritme.app
    DocumentRoot /var/www/html/public

    # Everything outside public/ is never served, even if a rewrite rule were wrong.
    <Directory /var/www/html>
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
