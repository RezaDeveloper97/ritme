# Ritme site — betatest stack (compose project `ritme-site`, /opt/ritme-site on the production server).
# Publishes NO host ports: production's nginx proxy reaches `ritme-site-app-1:80` over the shared `ritme-edge`
# network (deploy/site-*.conf in the monorepo). Deployed by laravel-site/deploy-betatest.sh.
name: ritme-site

x-app: &app
  image: ritme-site:latest
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - storage:/var/www/html/storage
    - media:/var/www/html/public/media

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: deploy/betatest/Dockerfile
    networks: [default, ritme-edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *app
    command: ["scheduler"]

  db:
    # MariaDB, not MySQL: the server CPU lacks x86-64-v2 (see the production compose).
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=128M"]
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  storage:
  media:
  db:

networks:
  ritme-edge:
    external: true
